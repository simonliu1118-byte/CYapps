name: CYCloud Identity Development Deploy

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/CYCloudIdentity/**"
      - ".github/workflows/cycloudidentity-deploy.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: 'Read-only preflight or preserve-existing development upgrade'
        type: choice
        options: [preflight, upgrade]
        default: preflight
        required: true
  push:
    branches:
      - deploy/cycloudidentity-development
      - deploy/cycloudidentity-development-preflight

permissions:
  contents: read

concurrency:
  group: cycloudidentity-development
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/CYCloudIdentity

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Scan public source
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/scan-public-package.py apps/CYCloudIdentity

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Type-check Worker
        run: npm run check

      - name: Run auth-core tests
        run: npm test

      - name: Render CI-only Cloudflare config
        env:
          CYID_WORKER_NAME: cycloud-identity-ci
          CYID_D1_DATABASE_NAME: cycloud_identity_ci
          CYID_D1_DATABASE_ID: 11111111-1111-4111-8111-111111111111
          CYID_LOGIN_RATE_LIMIT_NAMESPACE_ID: "900101"
          CYID_SESSION_TTL_SECONDS: "3600"
          CYID_EMAIL_PROVIDER: brevo
          CYID_EMAIL_FROM: Identity Test <identity@example.test>
          CYID_EMAIL_DAILY_BUDGET: "50"
          CYID_CORE_ACCOUNT_APPLICATION_ID: APP_TEST_LOGIN
          CYID_ACCOUNT_PORTAL_URL: https://portal.example.test/
        run: node scripts/render-deploy-config.mjs --output wrangler.ci.generated.jsonc

      - name: Validate migrations locally
        run: npx wrangler d1 migrations apply DB --local --persist-to /tmp/cycloudidentity-ci-d1 --config wrangler.ci.generated.jsonc

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.ci.generated.jsonc

      - name: Remove generated config
        if: always()
        run: rm -f wrangler.ci.generated.jsonc

  deploy-development:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    defaults:
      run:
        working-directory: apps/CYCloudIdentity

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CYID_WORKER_NAME: ${{ secrets.CYID_WORKER_NAME }}
      CYID_D1_DATABASE_ID: ${{ vars.CYID_D1_DATABASE_ID }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Read-only provider preflight and private recovery checkpoint
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node scripts/deployment-preflight.mjs before "$RUNNER_TEMP/cyid-upgrade-audit.json"

      - name: Validate preserved development bundle before mutation
        shell: bash
        run: |
          set -euo pipefail
          if ! npx wrangler deploy --dry-run --config wrangler.deploy.generated.jsonc --outdir "$RUNNER_TEMP/cyid-upgrade-bundle" > "$RUNNER_TEMP/cyid-private-bundle.log" 2>&1; then
            echo 'Preserved development bundle failed; no remote mutation performed.'
            exit 1
          fi

      - name: Upgrade original development provider without secret or authority writes
        if: (github.event_name == 'push' && github.ref == 'refs/heads/deploy/cycloudidentity-development') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'upgrade')
        shell: bash
        run: |
          set -euo pipefail
          if ! npx wrangler deploy --config wrangler.deploy.generated.jsonc > "$RUNNER_TEMP/cyid-private-deploy.log" 2>&1; then
            echo 'Development upgrade failed; inspect existing Worker and private checkpoint. Do not restore D1 or replay bootstrap automatically.'
            exit 1
          fi
          echo 'Development provider code upgraded with original runtime bindings and secrets retained.'

      - name: Verify provider version and authority continuity
        if: (github.event_name == 'push' && github.ref == 'refs/heads/deploy/cycloudidentity-development') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'upgrade')
        run: node scripts/deployment-preflight.mjs after "$RUNNER_TEMP/cyid-upgrade-audit.json"

      - name: Remove private generated config and checkpoint
        if: always()
        shell: bash
        run: |
          rm -f wrangler.deploy.generated.jsonc "$RUNNER_TEMP/cyid-upgrade-audit.json" "$RUNNER_TEMP/cyid-private-bundle.log" "$RUNNER_TEMP/cyid-private-deploy.log"
          rm -rf "$RUNNER_TEMP/cyid-upgrade-bundle"
