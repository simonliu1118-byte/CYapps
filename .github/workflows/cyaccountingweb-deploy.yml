          verify_asset "$base/adaptive-ui.css?rev=desktop-independent-scroll" 'font-size: 16px !important'
          verify_asset "$base/adaptive-ui.js?rev=device-preview-retirement" 'syncLedgerToolbarPlacement'
          verify_asset "$base/ledger-tools.js?rev=pending-create-rows" 'aria-label="編輯"'
          verify_asset "$base/excel-export-ui.js?rev=native-device-share" 'Boolean(document.documentElement.dataset.tabletLayout)'
          verify_asset "$base/excel-import-ui.js?rev=excel-import-template" 'button.dataset.excelImportBound'
