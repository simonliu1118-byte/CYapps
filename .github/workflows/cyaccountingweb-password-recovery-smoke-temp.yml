name: CYAccountingWeb Password Recovery Live Smoke (Temporary)

on:
  push:
    branches:
      - cyinvoice/cloud-onboarding-first-device
    paths:
      - ".github/workflows/cyaccountingweb-password-recovery-smoke-temp.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Accounting password-reset proxy without Email
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl --silent --show-error --output "$tmp" --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data '{"employeeNo":"0000"}' \
            'https://cyaccounting-web.simonliu1118.workers.dev/api/auth/password-reset/challenge')"
          body="$(cat "$tmp")"
          rm -f "$tmp"
          echo "HTTP $code"
          echo "$body"
          [[ "$code" == "400" ]]
          grep -q 'PASSWORD_RESET_UNAVAILABLE' <<<"$body"
          grep -q 'Email 重設密碼' <<<"$body"

      - name: Verify business API remains protected
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl --silent --show-error --output "$tmp" --write-out '%{http_code}' \
            'https://cyaccounting-web.simonliu1118.workers.dev/api/bootstrap')"
          body="$(cat "$tmp")"
          rm -f "$tmp"
          echo "HTTP $code"
          echo "$body"
          [[ "$code" == "401" ]]
          grep -q 'AUTH_REQUIRED' <<<"$body"
