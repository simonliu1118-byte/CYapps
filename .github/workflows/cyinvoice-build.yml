name: CYInvoice Windows Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "apps/CYInvoice/**/*.go"
      - "apps/CYInvoice/go.mod"
      - "apps/CYInvoice/go.sum"
      - "apps/CYInvoice/scripts/**"
      - "apps/CYInvoice/assets/**"
      - "apps/CYInvoice/VERSION"
      - "apps/CYInvoice/BUILD"
      - ".github/workflows/cyinvoice-build.yml"

permissions:
  contents: read

concurrency:
  group: cyinvoice-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: apps/CYInvoice

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Read VERSION and BUILD
        shell: pwsh
        run: |
          $version = (Get-Content ./VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid CYInvoice VERSION: $version" }
          $build = (Get-Content ./BUILD -Raw).Trim()
          if ($build -notmatch '^\d+$') { throw "Invalid CYInvoice BUILD: $build" }
          $buildNumber = [int]$build
          $artifactVersion = $version
          if ($buildNumber -gt 0) { $artifactVersion = "${version}_Build${buildNumber}" }
          "CYINVOICE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CYINVOICE_BUILD=$buildNumber" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CYINVOICE_ARTIFACT_VERSION=$artifactVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/CYInvoice/go.mod
          cache: false

      - name: Verify module files are reproducible
        shell: pwsh
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Scan tracked source for confidential runtime data
        shell: pwsh
        run: ./scripts/verify-source.ps1

      - name: Run tests
        shell: pwsh
        run: go test ./...

      - name: Run Go static analysis
        shell: pwsh
        run: go vet ./...

      - name: Build Windows x64 package
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Verify PE structure
        shell: pwsh
        run: ./scripts/verify-pe.ps1 -Path ./dist/CYInvoice/CYInvoice.exe

      - name: Verify release package layout
        shell: pwsh
        run: ./scripts/verify-package.ps1 -Path ("./dist/CYInvoice_V{0}.zip" -f $env:CYINVOICE_ARTIFACT_VERSION) -Version $env:CYINVOICE_VERSION -Build $env:CYINVOICE_BUILD

      - name: Prepare one-layer engineering artifact
        shell: pwsh
        run: |
          $artifactRoot = "./dist/engineering-artifact"
          New-Item -Path $artifactRoot -ItemType Directory -Force | Out-Null
          Copy-Item -Path "./dist/CYInvoice" -Destination $artifactRoot -Recurse

          if (!(Test-Path "$artifactRoot/CYInvoice/CYInvoice.exe" -PathType Leaf)) {
            throw "Engineering artifact is missing CYInvoice/CYInvoice.exe"
          }

          $nestedZip = @(Get-ChildItem -Path $artifactRoot -Filter "*.zip" -File -Recurse)
          if ($nestedZip.Count -ne 0) {
            throw "Engineering artifact must not contain a nested ZIP"
          }

      - name: Upload engineering artifact
        uses: actions/upload-artifact@v7
        with:
          name: CYInvoice-v${{ env.CYINVOICE_ARTIFACT_VERSION }}-windows-x64-run${{ github.run_number }}
          path: apps/CYInvoice/dist/engineering-artifact/
          if-no-files-found: error
          retention-days: 14
