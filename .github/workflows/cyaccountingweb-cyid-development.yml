name: CYAccountingWeb CYID Isolated Development

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/cyaccountingweb-cyid-development
    paths:
      - "apps/CYAccountingWeb/**"
      - ".github/workflows/cyaccountingweb-cyid-development.yml"

permissions:
  contents: read

concurrency:
  group: cyaccountingweb-cyid-development
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/CYAccountingWeb

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Scan public source
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/scan-public-package.py apps/CYAccountingWeb

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/CYAccountingWeb/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate CYID integration source
        run: |
          node --check src/identity-adapter.js
          node --check src/app.js
          node --check src/app-v17.js
          node --check src/app-v18.js
          node --check src/app-v19.js
          node --check public/auth.js
          node --check public/login.js
          node --check scripts/render-wrangler.mjs
          node --check scripts/smoke-cyid-development.mjs
          node scripts/validate-cyid-consumer-version.mjs
          node tests/cyid-integration.mjs
          node tests/cyid-provider-contract.mjs
          node tests/deploy-config.mjs

      - name: Prepare pinned browser SQLite runtime
        run: node scripts/prepare-sqljs.mjs

      - name: Render isolated CI config
        env:
          CF_WORKER_NAME: cyaccounting-cyid-preview-ci
          CF_D1_DATABASE_NAME: cyaccounting-cyid-preview-ci-db
          CF_D1_DATABASE_ID: 11111111-1111-4111-8111-111111111111
          CF_IDENTITY_SERVICE: cyidentity-ci-placeholder
          CF_CYID_APPLICATION_ID: CYACC_CI
          CF_CYID_WORKSPACE_ID: workspace-ci-placeholder
        run: node scripts/render-wrangler.mjs --template wrangler.cyid-development.template.jsonc --output wrangler.cyid-development.ci.jsonc

      - name: Validate isolated D1 migrations locally
        run: npx wrangler d1 migrations apply DB --local --persist-to /tmp/cyaccounting-cyid-preview-d1 --config wrangler.cyid-development.ci.jsonc

      - name: Validate isolated Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.cyid-development.ci.jsonc

      - name: Remove generated files
        if: always()
        run: |
          rm -f wrangler.cyid-development.ci.jsonc
          node scripts/prepare-sqljs.mjs --clean

  deploy-development:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    defaults:
      run:
        working-directory: apps/CYAccountingWeb

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_WORKER_NAME: ${{ vars.CYACC_CYID_DEV_WORKER_NAME }}
      CF_D1_DATABASE_NAME: ${{ vars.CYACC_CYID_DEV_D1_DATABASE_NAME }}
      CF_D1_DATABASE_ID: ${{ vars.CYACC_CYID_DEV_D1_DATABASE_ID }}
      CF_IDENTITY_SERVICE: ${{ vars.CYACC_CYID_DEV_IDENTITY_SERVICE }}
      CF_CYID_APPLICATION_ID: ${{ vars.CYACC_CYID_DEV_APPLICATION_ID }}
      CF_CYID_WORKSPACE_ID: ${{ vars.CYACC_CYID_DEV_WORKSPACE_ID }}
      CYACC_SMOKE_BASE_URL: ${{ vars.CYACC_CYID_DEV_BASE_URL }}
      CYACC_SMOKE_EXPECTED_ROLE: ${{ vars.CYACC_CYID_DEV_SMOKE_EXPECTED_ROLE }}
      CYACC_SMOKE_EMPLOYEE_NO: ${{ secrets.CYACC_CYID_DEV_SMOKE_EMPLOYEE_NO }}
      CYACC_SMOKE_PASSWORD: ${{ secrets.CYACC_CYID_DEV_SMOKE_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/CYAccountingWeb/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify isolated development settings
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
            CF_WORKER_NAME CF_D1_DATABASE_NAME CF_D1_DATABASE_ID
            CF_IDENTITY_SERVICE CF_CYID_APPLICATION_ID CF_CYID_WORKSPACE_ID
            CYACC_SMOKE_BASE_URL CYACC_SMOKE_EXPECTED_ROLE
            CYACC_SMOKE_EMPLOYEE_NO CYACC_SMOKE_PASSWORD
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required isolated development setting: ${name}" >&2
              exit 1
            fi
          done

      - name: Prepare pinned browser SQLite runtime
        run: node scripts/prepare-sqljs.mjs

      - name: Render isolated development config
        run: node scripts/render-wrangler.mjs --template wrangler.cyid-development.template.jsonc --output wrangler.cyid-development.generated.jsonc

      - name: Apply isolated D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.cyid-development.generated.jsonc

      - name: Deploy isolated Worker
        run: npx wrangler deploy --config wrangler.cyid-development.generated.jsonc

      - name: Run CYID development smoke
        run: node scripts/smoke-cyid-development.mjs

      - name: Remove generated files
        if: always()
        run: |
          rm -f wrangler.cyid-development.generated.jsonc
          node scripts/prepare-sqljs.mjs --clean
