name: SMARTCOPIConverter One-time Cleanup

on:
  create:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    if: github.event.ref_type == 'branch' && github.event.ref == 'maintenance/smartcopiconverter-cleanup-v1.0.1'
    runs-on: ubuntu-latest
    steps:
      - name: Delete superseded SMARTCOPIConverter refs and engineering artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          trigger_sha="$(gh api "repos/$REPO/git/ref/heads/maintenance/smartcopiconverter-cleanup-v1.0.1" --jq '.object.sha')"
          test "$main_sha" = "$trigger_sha" || { echo "Maintenance branch is not at main"; exit 1; }
          for branch in \
            'governance/add-smartcopiconverter' \
            'governance/add-smartcopiconverter-project-rules' \
            'smartcopiconverter/initial-import' \
            'smartcopiconverter/import-v1.0.0' \
            'release/smartcopiconverter-v1.0.1' \
            'smartcopiconverter/ci-release-branch-trigger'; do
            if gh api "repos/$REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
              echo "Deleted obsolete branch: $branch"
            fi
          done
          # Keep all formal Release assets, tags and the successful release run.
          # Remove only short-lived engineering artifacts with this exact app prefix.
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name | startswith("SMARTCOPIConverter-V1.0.1-win-x64")) | .id' | while read -r id; do
            test -n "$id" || continue
            gh api --method DELETE "repos/$REPO/actions/artifacts/$id"
            echo "Deleted obsolete test artifact ID $id"
          done
