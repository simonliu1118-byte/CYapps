name: CYAccountingWeb V0.16 Patch (Temporary)

on:
  push:
    branches:
      - cyaccountingweb/v0.16-google-drive-backup
    paths:
      - '.github/workflows/cyaccountingweb-v016-patch-temp.yml'

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cyaccountingweb/v0.16-google-drive-backup
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/CYAccountingWeb/package-lock.json
      - name: Wire V0.16 backup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          app = Path('apps/CYAccountingWeb/src/app.js')
          text = app.read_text(encoding='utf-8')
          import_anchor = "import { handleV15Api } from './v15-import.js';\n"
          import_line = "import { handleV16Api, handleV16OAuthCallback, runScheduledBackup } from './v16-backup.js';\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('V0.15 import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          auth_anchor = "    try {\n      if (url.pathname === '/api/auth/login' && request.method === 'POST') {\n"
          auth_insert = "    try {\n      const v16Callback = await handleV16OAuthCallback(request, env);\n      if (v16Callback) return v16Callback;\n\n      if (url.pathname === '/api/auth/login' && request.method === 'POST') {\n"
          if 'const v16Callback' not in text:
              if auth_anchor not in text:
                  raise SystemExit('auth route anchor not found')
              text = text.replace(auth_anchor, auth_insert, 1)

          route_anchor = "      const v15Response = await handleV15Api(request, env);\n"
          route_insert = "      const v16Response = await handleV16Api(request, env, session);\n      if (v16Response) return v16Response;\n\n"
          if 'const v16Response' not in text:
              if route_anchor not in text:
                  raise SystemExit('V0.15 route anchor not found')
              text = text.replace(route_anchor, route_insert + route_anchor, 1)

          scheduled_anchor = "    } catch (error) {\n      console.error('cyaccounting_identity_failed', error instanceof Error ? error.message : 'unknown_error');\n      return json({ ok: false, error: '中央帳號服務處理失敗。' }, 500);\n    }\n  }\n};\n\nasync function handleLogin"
          scheduled_replace = "    } catch (error) {\n      console.error('cyaccounting_request_failed', error instanceof Error ? error.message : 'unknown_error');\n      return json({ ok: false, error: '系統處理失敗，請稍後再試。' }, 500);\n    }\n  },\n\n  async scheduled(_controller, env, ctx) {\n    ctx.waitUntil(runScheduledBackup(env));\n  }\n};\n\nasync function handleLogin"
          if 'async scheduled(' not in text:
              if scheduled_anchor not in text:
                  raise SystemExit('worker scheduled anchor not found')
              text = text.replace(scheduled_anchor, scheduled_replace, 1)
          app.write_text(text, encoding='utf-8')

          index = Path('apps/CYAccountingWeb/public/index.html')
          text = index.read_text(encoding='utf-8')
          if '/v016.css' not in text:
              anchor = '  <link rel="stylesheet" href="/v015.css">\n'
              if anchor not in text:
                  raise SystemExit('V0.15 CSS anchor not found')
              text = text.replace(anchor, anchor + '  <link rel="stylesheet" href="/v016.css">\n', 1)
          text = text.replace('V0.15.0</span>', 'V0.16.0</span>', 1)
          if '/v016.js' not in text:
              anchor = '  <script src="/v015.js" defer></script>\n'
              if anchor not in text:
                  raise SystemExit('V0.15 JS anchor not found')
              text = text.replace(anchor, anchor + '  <script src="/v016.js" defer></script>\n', 1)
          index.write_text(text, encoding='utf-8')

          Path('apps/CYAccountingWeb/VERSION').write_text('0.16.0\n', encoding='utf-8')

          wrangler = Path('apps/CYAccountingWeb/wrangler.jsonc')
          data = json.loads(wrangler.read_text(encoding='utf-8'))
          data['triggers'] = {'crons': ['30 19 * * *']}
          wrangler.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          todo = Path('apps/CYAccountingWeb/TODO.md')
          text = todo.read_text(encoding='utf-8')
          text = text.replace(
              '- [ ] Cloudflare D1 為 CYAccountingWeb 唯一正式帳務資料來源；Google Drive 僅作為 Cloudflare 之外的異地／災難復原備份，不作 live database 或雙向同步資料庫。',
              '- [x] 備份架構：Cloudflare D1 為唯一正式帳務資料來源；Google Drive 僅作異地／災難復原備份，不作 live database 或雙向同步資料庫（V0.16.0）。', 1)
          text = text.replace(
              '- [ ] **備份必須自動執行**：由系統定期從 D1 產生可攜、可驗證且有版本資訊的帳務備份檔，再自動上傳到 Google Drive 專用 CYAccountingWeb 備份資料夾；日常安全不依賴使用者手動按備份。',
              '- [ ] **自動備份上線驗收**：V0.16.0 已完成每日 03:30（台灣時間）Cron、D1 可攜 JSON 封裝、Google Drive 上傳與回讀 SHA-256 驗證；待完成 Google OAuth／Cloudflare Secrets 與首次實機備份後勾選。', 1)
          text = text.replace(
              '- [ ] 定義自動備份頻率、失敗重試、保留策略、檔名、版本、建立時間、資料筆數／校驗資訊及完整性驗證；不得只宣稱上傳成功就視為有效備份。',
              '- [x] 自動備份規格：每日 03:30（台灣時間）、保留最近 30 份、版本化 JSON、資料筆數、data SHA-256、file SHA-256；上傳後必須由 Drive 回讀並比對 SHA-256 才記為成功（V0.16.0）。', 1)
          text = text.replace(
              '- [ ] Google Drive 連線憑證、refresh token、client secret 等不得進 Public repo；正式做法需放在受保護的執行環境／Secrets。',
              '- [ ] Google Drive Secrets 實機設定：程式已要求 OAuth client ID／client secret 使用 Cloudflare Secrets，refresh token 以 Secret 金鑰 AES-256-GCM 加密後才存 D1；待首次部署後完成人工設定與驗收。', 1)
          todo.write_text(text, encoding='utf-8')
          PY

          cd apps/CYAccountingWeb
          npm ci --no-audit --no-fund
          node --check src/app.js
          node --check src/v16-backup.js
          node --check public/v016.js
          node tests/v16-backup.mjs
          npx wrangler deploy --dry-run

      - name: Validate migration locally
        working-directory: apps/CYAccountingWeb
        run: npx wrangler d1 migrations apply DB --local --persist-to /tmp/cyaccounting-v016-d1

      - name: Commit V0.16 application files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/CYAccountingWeb/src/app.js \
                  apps/CYAccountingWeb/public/index.html \
                  apps/CYAccountingWeb/VERSION \
                  apps/CYAccountingWeb/wrangler.jsonc \
                  apps/CYAccountingWeb/TODO.md
          git commit -m 'feat(CYAccountingWeb): wire V0.16 automatic Drive backup'
          git push origin HEAD:cyaccountingweb/v0.16-google-drive-backup
