name: CYInvoice Stable Release

on:
  workflow_dispatch:
  # Formal release branches are created only on explicit user request.
  push:
    branches:
      - 'release/cyinvoice-v*'

permissions:
  contents: write

concurrency:
  group: cyinvoice-release
  cancel-in-progress: false

jobs:
  release-windows-x64:
    # Re-pushes to an existing branch never initiate another formal release.
    if: github.event_name != 'push' || github.event.created == true
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
        working-directory: apps/CYInvoice

    steps:
      - name: Checkout main source
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Validate formal release identity
        run: |
          # Always build the exact current main commit, not the release branch tree.
          $eventSha = $env:GITHUB_SHA.Trim()
          $checkoutSha = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $checkoutSha -cne $eventSha) {
            throw "Release event SHA must equal checked-out main commit; event=$eventSha main=$checkoutSha"
          }
          $remoteLine = (& git ls-remote origin 'refs/heads/main')
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($remoteLine)) {
            throw "Cannot confirm origin/main commit."
          }
          $remoteMainSha = ($remoteLine.Trim() -split '\s+')[0]
          if ($remoteMainSha -cne $eventSha) {
            throw "main advanced or release branch is not an exact main commit; release aborted."
          }
          $version = (Get-Content ./VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "A formal release requires a stable semantic VERSION; got $version" }
          $build = (Get-Content ./BUILD -Raw).Trim()
          if ($build -notmatch '^\d+$' -or [int]$build -ne 0) { throw "Formal release requires BUILD=0; got $build" }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            if ($env:GITHUB_REF_NAME -cne 'main') { throw "Manual release must start from main." }
          }
          elseif ($env:GITHUB_EVENT_NAME -eq 'push') {
            $expectedBranch = "release/cyinvoice-v$version"
            $retryPattern = '^release/cyinvoice-v' + [regex]::Escape($version) + '-retry[1-9][0-9]*$'
            if ($env:GITHUB_REF_NAME -cne $expectedBranch -and $env:GITHUB_REF_NAME -cnotmatch $retryPattern) {
              throw "Formal release branch must be $expectedBranch or an explicit failed-run retry; got $env:GITHUB_REF_NAME"
            }
          }
          else {
            throw "Unexpected release trigger: $env:GITHUB_EVENT_NAME"
          }
          "CYINVOICE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CYINVOICE_BUILD=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CYINVOICE_TAG=cyinvoice-v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check release does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:CYINVOICE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            "CYINVOICE_SHOULD_RELEASE=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Release $env:CYINVOICE_TAG already exists; nothing to publish."
            exit 0
          }
          $remoteTag = git ls-remote --tags origin "refs/tags/$env:CYINVOICE_TAG"
          if (![string]::IsNullOrWhiteSpace($remoteTag)) { throw "Tag $env:CYINVOICE_TAG exists without a matching Release; refusing to overwrite it" }
          "CYINVOICE_SHOULD_RELEASE=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up .NET
        if: env.CYINVOICE_SHOULD_RELEASE == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Set up Python for public artifact safety scan
        if: env.CYINVOICE_SHOULD_RELEASE == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Scan tracked source for confidential runtime data
        if: env.CYINVOICE_SHOULD_RELEASE == 'true'
        run: ./scripts/verify-source.ps1

      - name: Restore
        if: env.CYINVOICE_SHOULD_RELEASE == 'true'
        run: dotnet restore CYInvoice.sln

      - name: Build with warnings as errors
        if: env.CYINVOICE_SHOULD_RELEASE == 'true'
        run: dotnet build CYInvoice.sln -c Release -p:Platform=x64 -p:Version=$env:CYINVOICE_VERSION --no-restore

      - name: Run WinForms startup smoke test
        if: env.CYINVOICE_SHOULD_RELEASE == 'true'
        run: |
          dotnet run --project src/CYInvoice.WinForms/CYInvoice.WinForms.csproj -c Release -p:Platform=x64 --no-build -- --startup-smoke-test
          if ($LASTEXITCODE -ne 0) { throw "WinForms startup smoke test failed" }

      - name: Run core parity tests
        if: env.CYINVOICE_SHOULD_RELEASE == 'true'
        run: dotnet run --project tests/CYInvoice.Core.Tests/CYInvoice.Core.Tests.csproj -c Release --no-build

      - name: Run void core tests
        if: env.CYINVOICE_SHOULD_RELEASE == 'true'
        run: dotnet run --project tests/CYInvoice.Void.Tests/CYInvoice.Void.Tests.csproj -c Release --no-build

      - name: Run employee void workflow tests
        if: env.CYINVOICE_SHOULD_RELEASE == 'true'
        run: dotnet run --project tests/CYInvoice.VoidWorkflow.Tests/CYInvoice.VoidWorkflow.Tests.csproj -c Release --no-build

      - name: Run allowance PDF and void workflow tests
        if: env.CYINVOICE_SHOULD_RELEASE == 'true'
        run: dotnet run --project tests/CYInvoice.Allowance.Tests/CYInvoice.Allowance.Tests.csproj -c Release --no-build

      - name: Run SQLite migration tests
        if: env.CYINVOICE_SHOULD_RELEASE == 'true'
        run: dotnet run --project tests/CYInvoice.SqliteMigration.Tests/CYInvoice.SqliteMigration.Tests.csproj -c Release --no-build

      - name: Run invoice sync tests
        if: env.CYINVOICE_SHOULD_RELEASE == 'true'
        run: dotnet run --project tests/CYInvoice.Sync.Tests/CYInvoice.Sync.Tests.csproj -c Release --no-build

      - name: Run sync coordinator tests
        if: env.CYINVOICE_SHOULD_RELEASE == 'true'
        run: dotnet run --project tests/CYInvoice.SyncCoordinator.Tests/CYInvoice.SyncCoordinator.Tests.csproj -c Release --no-build

      - name: Run cloud client contract tests
        if: env.CYINVOICE_SHOULD_RELEASE == 'true'
        # Cloud.Tests is intentionally not part of CYInvoice.sln; compile it before running.
        run: dotnet run --project tests/CYInvoice.Cloud.Tests/CYInvoice.Cloud.Tests.csproj -c Release

      - name: Build and verify Windows x64 release
        if: env.CYINVOICE_SHOULD_RELEASE == 'true'
        run: |
          ./scripts/build.ps1 -Version $env:CYINVOICE_VERSION -Build 0
          ./scripts/verify-pe.ps1 -Path ./dist/CYInvoice/CYInvoice.exe
          ./scripts/verify-package.ps1 -Path ("./dist/CYInvoice_V{0}.zip" -f $env:CYINVOICE_VERSION) -Version $env:CYINVOICE_VERSION -Build 0

      - name: Smoke test packaged portable folder
        if: env.CYINVOICE_SHOULD_RELEASE == 'true'
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP ("cyinvoice-package-smoke-" + [guid]::NewGuid().ToString("N"))
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = (Resolve-Path ("./dist/CYInvoice_V{0}.zip" -f $env:CYINVOICE_VERSION)).Path
          [System.IO.Compression.ZipFile]::ExtractToDirectory($zipPath, $smokeRoot)
          try {
            $process = Start-Process `
              -FilePath (Join-Path $smokeRoot "CYInvoice/CYInvoice.exe") `
              -ArgumentList "--startup-smoke-test" `
              -Wait `
              -PassThru
            if ($process.ExitCode -ne 0) {
              $startupLog = Join-Path $smokeRoot "CYInvoice/Logs/startup-error.log"
              if (Test-Path -LiteralPath $startupLog -PathType Leaf) { Get-Content -LiteralPath $startupLog | Write-Error }
              throw "Packaged CYInvoice startup smoke test failed with exit code $($process.ExitCode)"
            }
          }
          finally { Remove-Item $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue }

      - name: Scan formal release package for secrets and production bindings
        if: env.CYINVOICE_SHOULD_RELEASE == 'true'
        run: python "$env:GITHUB_WORKSPACE/.github/scripts/scan-public-package.py" ("./dist/CYInvoice_V{0}.zip" -f $env:CYINVOICE_VERSION)

      - name: Create checksum and release notes
        if: env.CYINVOICE_SHOULD_RELEASE == 'true'
        run: |
          $zipName = "CYInvoice_V$env:CYINVOICE_VERSION.zip"
          $zipPath = Join-Path ./dist $zipName
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content -Path "$zipPath.sha256" -Encoding ascii
          $year = (Get-Date).Year
          $summaryPath = "./release-notes/V$env:CYINVOICE_VERSION.txt"
          if (!(Test-Path -LiteralPath $summaryPath -PathType Leaf)) { throw "Version-specific release summary is required." }
          $summary = (Get-Content -LiteralPath $summaryPath -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($summary)) { throw "Release summary cannot be empty." }
          @"
          CYInvoice V$env:CYINVOICE_VERSION

          Windows 10/11 x64 正式版。

          Copyright © $year C.C. Liu, Chihyuan Co. All Rights Reserved.

          - 本版由使用者明確要求正式發布後，從 main 重新建置。
          - 完整版本內容請參閱發行包內的 V$env:CYINVOICE_VERSION.txt 與專案 CHANGELOG。
          - 下載 $zipName 後解壓縮，直接執行 CYInvoice.exe。
          - 發行包與 SHA-256 由本次正式 Release workflow 重新建置與驗證。
          - 既有 V2.6.19 與歷史 Go／Win32 V1.1.0 Release 保留，不覆寫。

          $summary
          "@ | Set-Content -Path ./dist/release-notes.md -Encoding utf8

      - name: Publish GitHub Release
        if: env.CYINVOICE_SHOULD_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:CYINVOICE_TAG `
            ("./dist/CYInvoice_V{0}.zip" -f $env:CYINVOICE_VERSION) `
            ("./dist/CYInvoice_V{0}.zip.sha256" -f $env:CYINVOICE_VERSION) `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "CYInvoice V$env:CYINVOICE_VERSION" `
            --notes-file ./dist/release-notes.md `
            --latest

      # Explicit one-time user instruction for V3.1.0 only. Never remove the
      # previous download until this run published AND verified the new assets.
      # Deliberately retain the historical cyinvoice-v3.0.0 Git tag.
      - name: Retire V3.0.0 release after verifying V3.1.0 assets
        if: env.CYINVOICE_SHOULD_RELEASE == 'true' && env.CYINVOICE_VERSION == '3.1.0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $newTag = 'cyinvoice-v3.1.0'
          $oldTag = 'cyinvoice-v3.0.0'
          $expectedZip = 'CYInvoice_V3.1.0.zip'
          $expectedChecksum = 'CYInvoice_V3.1.0.zip.sha256'
          $assets = @(gh release view $newTag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0 -or $assets -notcontains $expectedZip -or $assets -notcontains $expectedChecksum) {
            throw "New formal release assets not yet verified; do NOT retire V3.0.0."
          }
          gh release view $oldTag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "V3.0.0 Release already absent; preserving the historic Git tag."
            exit 0
          }
          gh release delete $oldTag --repo $env:GITHUB_REPOSITORY --yes
          if ($LASTEXITCODE -ne 0) { throw "Could not retire V3.0.0 release." }
          $historicTag = (& git ls-remote --tags origin 'refs/tags/cyinvoice-v3.0.0')
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($historicTag)) {
            throw "Historical V3.0.0 Git tag must remain after deleting its Release."
          }
          Write-Host "V3.1.0 assets verified. Retired V3.0.0 Release; kept historical tag."
