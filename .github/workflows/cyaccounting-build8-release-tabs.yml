name: CYAccounting Build 8 Release Tabs (one-time)

on:
  push:
    branches:
      - cyaccounting/v1.2.0-visual-phase1
    paths:
      - .github/workflows/cyaccounting-build8-release-tabs.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cyaccounting/v1.2.0-visual-phase1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Apply Build 8 corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('apps/CYAccounting')

          # 1) Stop fighting the Windows title bar. Production already sets the
          # QApplication icon from app/resources/app.ico (ACC), and QDialogs
          # inherit that icon. Remove the Build 6/7 no-icon/fixed-dialog hacks.
          main_path = root / 'app/main.py'
          main = main_path.read_text(encoding='utf-8')
          icon_helpers = re.compile(
              r"    @staticmethod\n"
              r"    def _apply_secondary_dialog_no_icon\(dialog: QDialog\) -> None:\n"
              r".*?"
              r"(?=    def eventFilter\(self, watched, event\):)",
              re.S,
          )
          main, count = icon_helpers.subn('', main, count=1)
          if count != 1:
              raise SystemExit(f'icon-helper removal count={count}')

          old_dialog_branch = '''            elif isinstance(watched, QDialog) and not isinstance(watched, QFileDialog):
              if event.type() == QEvent.Type.Polish:
                  self._prepare_secondary_dialog_chrome(watched)
              QTimer.singleShot(0, lambda dlg=watched: self._clear_secondary_dialog_icon(dlg))
          '''
          if old_dialog_branch not in main:
              raise SystemExit('secondary-dialog event-filter branch not found')
          main = main.replace(old_dialog_branch, '', 1)
          main_path.write_text(main, encoding='utf-8')

          # 2) Use the exact V1.1.0 Release QTabWidget construction for the
          # income/expense category manager: no object name, no forced tab-bar
          # expansion policy, and no custom scroll-button policy.
          dialogs_path = root / 'app/dialogs.py'
          dialogs = dialogs_path.read_text(encoding='utf-8')
          old_tabs = '''        tabs = QTabWidget()
          tabs.setObjectName("categoryManagerTabs")
          tabs.tabBar().setExpanding(False)
          tabs.tabBar().setUsesScrollButtons(False)
          tabs.addTab(CategoryPage(db, "income"), "收入科目")
          tabs.addTab(CategoryPage(db, "expense"), "支出科目")
          '''
          new_tabs = '''        tabs = QTabWidget()
          tabs.addTab(CategoryPage(db, "income"), "收入科目")
          tabs.addTab(CategoryPage(db, "expense"), "支出科目")
          '''
          if old_tabs not in dialogs:
              raise SystemExit('current category-tab construction block not found')
          dialogs = dialogs.replace(old_tabs, new_tabs, 1)
          dialogs_path.write_text(dialogs, encoding='utf-8')

          # 3) Remove every project-specific category-manager tab QSS rule.
          # This lets Qt/Windows draw the same native QTabWidget structure used
          # by the V1.1.0 Release instead of trying to imitate it with QSS.
          theme_path = root / 'app/theme.py'
          theme = theme_path.read_text(encoding='utf-8')
          tab_qss = re.compile(
              r"/\* Category manager: V1\.1\.0 conventional geometry, enlarged to current guide\..*?"
              r"(?=QLineEdit, QComboBox, QSpinBox, QDateEdit \{\{)",
              re.S,
          )
          theme, count = tab_qss.subn('', theme, count=1)
          if count != 1:
              raise SystemExit(f'category-manager QSS removal count={count}')
          theme_path.write_text(theme, encoding='utf-8')

          # 4) Regression tests now enforce native Release behavior rather than
          # the Build 7 custom tab/chrome implementation.
          tests_path = root / 'tests/test_app.py'
          tests = tests_path.read_text(encoding='utf-8')
          old_test = '''    category_tabs = category_dlg.findChild(QTabWidget, 'categoryManagerTabs')
              assert category_tabs is not None
              assert category_tabs.count() == 2
              assert category_tabs.tabBar().expanding() is False
              assert 'QTabWidget#categoryManagerTabs QTabBar::tab {' in main_module.APP_STYLE
              assert 'border-top-left-radius: 5px' in main_module.APP_STYLE
              assert 'top: 6px;' in main_module.APP_STYLE
              assert 'border-bottom: 0;' in main_module.APP_STYLE
          
              # Secondary dialogs use Qt's Windows fixed-dialog family while keeping X.
              chrome_flags_before = dlg.windowFlags()
              main_module.ChineseStandardButtonFilter._prepare_secondary_dialog_chrome(dlg)
              chrome_flags_after = dlg.windowFlags()
              if sys.platform == 'win32':
                  assert chrome_flags_after & Qt.WindowType.MSWindowsFixedSizeDialogHint
                  assert chrome_flags_after & Qt.WindowType.WindowCloseButtonHint
              assert (chrome_flags_after & Qt.WindowType.WindowType_Mask) == (chrome_flags_before & Qt.WindowType.WindowType_Mask)
          '''
          new_test = '''    category_tabs = category_dlg.findChild(QTabWidget)
              assert category_tabs is not None
              assert category_tabs.count() == 2
              # Match the V1.1.0 Release implementation: a plain native QTabWidget.
              assert category_tabs.objectName() == ''
              assert 'categoryManagerTabs' not in main_module.APP_STYLE
              # The no-icon/fixed-dialog workaround is intentionally gone; production
              # QDialogs inherit QApplication's ACC icon and keep native window flags.
              assert not hasattr(main_module.ChineseStandardButtonFilter, '_prepare_secondary_dialog_chrome')
          '''
          if old_test not in tests:
              raise SystemExit('Build 7 category/chrome regression block not found')
          tests = tests.replace(old_test, new_test, 1)
          tests_path.write_text(tests, encoding='utf-8')

          # 5) Delivered revision identity.
          build_path = root / 'BUILD'
          if build_path.read_text(encoding='utf-8').strip() != '7':
              raise SystemExit('expected BUILD 7 before Build 8 migration')
          build_path.write_text('8\n', encoding='utf-8')

          notes_path = root / 'V1.2.0.txt'
          notes = notes_path.read_text(encoding='utf-8')
          if 'Build: 7' not in notes:
              raise SystemExit('Build 7 note header missing')
          notes = notes.replace('Build: 7', 'Build: 8', 1)
          marker = 'Current source on Phase 1 visual-alignment branch; test artifact, not a formal Release:\n'
          build8 = (
              '- Build 8 restores the income/expense category-manager tabs to the V1.1.0 Release implementation itself: a plain native QTabWidget with no CYAccounting-specific tab QSS, no forced expansion, and no custom tab-bar geometry.\n'
              '- Build 8 abandons secondary-dialog title-bar icon suppression. Dialogs again inherit the QApplication ACC icon from app/resources/app.ico; the Build 6/7 Win32 fixed-dialog/no-icon workaround is removed.\n'
          )
          if marker not in notes:
              raise SystemExit('version-note marker missing')
          notes = notes.replace(marker, marker + build8, 1)
          notes_path.write_text(notes, encoding='utf-8')
          PY

      - name: Validate transformed source
        shell: bash
        run: |
          python -m py_compile \
            apps/CYAccounting/app/main.py \
            apps/CYAccounting/app/dialogs.py \
            apps/CYAccounting/app/theme.py \
            apps/CYAccounting/tests/test_app.py
          test "$(tr -d '\r\n ' < apps/CYAccounting/BUILD)" = "8"
          ! grep -q 'categoryManagerTabs' apps/CYAccounting/app/dialogs.py
          ! grep -q 'categoryManagerTabs' apps/CYAccounting/app/theme.py
          ! grep -q 'MSWindowsFixedSizeDialogHint' apps/CYAccounting/app/main.py
          ! grep -q '_apply_secondary_dialog_no_icon' apps/CYAccounting/app/main.py
          grep -q 'app.setWindowIcon(QIcon(str(icon_path)))' apps/CYAccounting/app/main.py

      - name: Commit Build 8
        shell: bash
        run: |
          git config user.name "simonliu1118-byte"
          git config user.email "286269326+simonliu1118-byte@users.noreply.github.com"
          git add \
            apps/CYAccounting/BUILD \
            apps/CYAccounting/V1.2.0.txt \
            apps/CYAccounting/app/main.py \
            apps/CYAccounting/app/dialogs.py \
            apps/CYAccounting/app/theme.py \
            apps/CYAccounting/tests/test_app.py
          git commit -m "ui(CYAccounting): restore release tabs and ACC dialog icon"
          git push origin HEAD:cyaccounting/v1.2.0-visual-phase1
