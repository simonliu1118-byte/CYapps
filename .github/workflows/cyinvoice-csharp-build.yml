name: CYInvoice CSharp remake build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "apps/CYInvoice/CYInvoice.CSharp.sln"
      - "apps/CYInvoice/Directory.Build.props"
      - "apps/CYInvoice/VERSION-CS"
      - "apps/CYInvoice/src/CYInvoice.Core/**"
      - "apps/CYInvoice/src/CYInvoice.WinForms/**"
      - "apps/CYInvoice/tests/CYInvoice.Core.Tests/**"

permissions:
  contents: read

concurrency:
  group: cyinvoice-csharp-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: apps/CYInvoice
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Verify remake identity
        run: |
          $version = (Get-Content VERSION-CS -Raw).Trim()
          if ($version -notmatch '^1\.1\.0-cs\.[1-9][0-9]*$') { throw "Invalid C# remake version: $version" }
          $goVersion = (Get-Content VERSION -Raw).Trim()
          if ($goVersion -ne '1.1.0') { throw "Go stable VERSION changed on C# remake branch: $goVersion" }
          "CYINVOICE_CS_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore CYInvoice.CSharp.sln

      - name: Build with warnings as errors
        run: dotnet build CYInvoice.CSharp.sln -c Release -p:Platform=x64 --no-restore

      - name: Run core parity tests
        run: dotnet run --project tests/CYInvoice.Core.Tests/CYInvoice.Core.Tests.csproj -c Release --no-build

      - name: Verify no generated output or obvious secrets are tracked
        run: |
          $tracked = git ls-files -- .
          if ($tracked | Select-String '(^|/)(bin|obj)/') { throw 'bin/obj must not be tracked' }
          $textFiles = $tracked | Where-Object { $_ -match '\.(cs|csproj|sln|props|md|txt|yml|yaml|json|xml|manifest)$' }
          if ($textFiles) {
            $matches = Select-String -Path $textFiles -Pattern '(?i)(app[_ -]?key|password)\s*[:=]\s*["''][^"'']{8,}' |
              Where-Object {
                -not ($_.Path -like '*AmegoContracts.cs' -and $_.Line -match 'public const string TestAppKey = "sHeq7t8G1wiQvhAuIM27"')
              }
            if ($matches) { $matches | Out-String | Write-Error; throw 'Possible plaintext secret found' }
          }

      - name: Publish engineering preview
        run: dotnet publish src/CYInvoice.WinForms/CYInvoice.WinForms.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o out

      - uses: actions/upload-artifact@v7
        with:
          name: CYInvoice_V${{ env.CYINVOICE_CS_VERSION }}_engineering-preview-run${{ github.run_number }}
          path: apps/CYInvoice/out/
          if-no-files-found: error
          retention-days: 14
