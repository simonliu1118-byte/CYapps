name: CYEnvelope Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/CYEnvelope
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: apps/CYEnvelope/go.sum
      - name: Test
        run: go test ./...
      - name: Build portable package
        shell: pwsh
        run: ./build.ps1
      - name: Upload CYEnvelope only
        uses: actions/upload-artifact@v4
        with:
          name: CYEnvelope-windows-x64
          path: apps/CYEnvelope/dist/CYEnvelope_V*.zip
          if-no-files-found: error
