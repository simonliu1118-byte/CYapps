        if (!Win32Automation.PrepareForeground(lookup, _log))
            throw new InvalidOperationException("F2 批號查詢視窗無法取得前景。");

        var selection = await _batchCellLocator.FindFirstPositiveStockAsync(lookup, cancellationToken);
