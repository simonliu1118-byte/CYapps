name: CYAccounting Stable Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cyaccounting-release
  cancel-in-progress: false

jobs:
  release-windows-x64:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
        working-directory: apps/CYAccounting

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Validate formal release identity
        run: |
          if ($env:GITHUB_REF_NAME -ne "main") { throw "Formal CYAccounting releases must run from main; got $env:GITHUB_REF_NAME" }
          $version = (Get-Content ./VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "A formal release requires a stable semantic VERSION; got $version" }
          $build = (Get-Content ./BUILD -Raw).Trim()
          if ($build -notmatch '^\d+$' -or [int]$build -ne 0) { throw "Formal release requires BUILD=0; got $build" }
          if (!(Test-Path "./V$version.txt" -PathType Leaf)) { throw "Missing formal version marker V$version.txt" }
          "CYACCOUNTING_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CYACCOUNTING_TAG=cyaccounting-v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check release does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:CYACCOUNTING_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            "CYACCOUNTING_SHOULD_RELEASE=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Release $env:CYACCOUNTING_TAG already exists; nothing to publish."
            exit 0
          }
          $remoteTag = git ls-remote --tags origin "refs/tags/$env:CYACCOUNTING_TAG"
          if (![string]::IsNullOrWhiteSpace($remoteTag)) { throw "Tag $env:CYACCOUNTING_TAG exists without a matching Release; refusing to overwrite it" }
          "CYACCOUNTING_SHOULD_RELEASE=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python
        if: env.CYACCOUNTING_SHOULD_RELEASE == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        if: env.CYACCOUNTING_SHOULD_RELEASE == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Compile Python sources
        if: env.CYACCOUNTING_SHOULD_RELEASE == 'true'
        run: python -m compileall -q app tests

      - name: Run application tests
        if: env.CYACCOUNTING_SHOULD_RELEASE == 'true'
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python tests/test_app.py
          if ($LASTEXITCODE -ne 0) { throw "CYAccounting application tests failed" }

      - name: Run safety and integration tests
        if: env.CYACCOUNTING_SHOULD_RELEASE == 'true'
        run: python -m unittest discover -s tests -p "test_*_unittest.py" -v

      - name: Set up Go
        if: env.CYACCOUNTING_SHOULD_RELEASE == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"

      - name: Test Windows GUI launcher lifecycle
        if: env.CYACCOUNTING_SHOULD_RELEASE == 'true'
        run: go test ./launcher_go -v

      - name: Build Windows x64 portable release
        if: env.CYACCOUNTING_SHOULD_RELEASE == 'true'
        run: ./tools/build_portable.ps1

      - name: Verify clean package, embedded startup, and icon resource
        if: env.CYACCOUNTING_SHOULD_RELEASE == 'true'
        run: |
          $package = "out/portable-dist/CYAccounting_V${env:CYACCOUNTING_VERSION}_Windows_x64.zip"
          ./tools/verify_portable.ps1 -Package $package

      - name: Build reproducible source archive
        if: env.CYACCOUNTING_SHOULD_RELEASE == 'true'
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          python tools/create_source_archive.py --output "out/cyaccounting-v$env:CYACCOUNTING_VERSION-source.tar.gz"

      - name: Scan formal release payloads for secrets and production bindings
        if: env.CYACCOUNTING_SHOULD_RELEASE == 'true'
        run: |
          $portable = "out/portable-dist/CYAccounting_V${env:CYACCOUNTING_VERSION}_Windows_x64.zip"
          $source = "out/cyaccounting-v$env:CYACCOUNTING_VERSION-source.tar.gz"
          python "$env:GITHUB_WORKSPACE/.github/scripts/scan-public-package.py" $portable $source

      - name: Create release notes
        if: env.CYACCOUNTING_SHOULD_RELEASE == 'true'
        run: |
          $year = (Get-Date).Year
          @"
          CYAccounting V$env:CYACCOUNTING_VERSION

          Windows 10/11 x64 正式版。

          Copyright © $year C.C. Liu, Chihyuan Co. All Rights Reserved.

          - 本版由使用者明確要求正式發布後，從 main 重新建置並完成驗證。
          - 完整版本內容請參閱發行包內的 V$env:CYACCOUNTING_VERSION.txt 與 README.txt。
          - 下載 CYAccounting_V${env:CYACCOUNTING_VERSION}_Windows_x64.zip 後解壓縮，直接執行 CYAccounting.exe。
          - 發行包、SHA-256 與 source verification archive 均由本次正式 Release workflow 重新建置與驗證。
          "@ | Set-Content -Path ./out/release-notes.md -Encoding utf8

      - name: Publish GitHub Release
        if: env.CYACCOUNTING_SHOULD_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $portable = "./out/portable-dist/CYAccounting_V${env:CYACCOUNTING_VERSION}_Windows_x64.zip"
          $portableSha = "$portable.sha256"
          $source = "./out/cyaccounting-v$env:CYACCOUNTING_VERSION-source.tar.gz"
          $sourceSha = "$source.sha256"
          gh release create $env:CYACCOUNTING_TAG `
            $portable `
            $portableSha `
            $source `
            $sourceSha `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "CYAccounting V$env:CYACCOUNTING_VERSION" `
            --notes-file ./out/release-notes.md `
            --latest
