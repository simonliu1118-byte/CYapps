<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f5e73"><meta name="robots" content="noindex,nofollow">
  <title>登入 · 價格觀測室</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f5e73'/%3E%3Cpath d='M17 43V31M32 43V21M47 43V13' stroke='white' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root{--bg:#f6f6f9;--surface:#fff;--border:#e3e3ec;--border-input:#8e91a6;--text:#282a3a;--muted:#676b7e;--accent:#0f5e73;--accent-hover:#0b4b5c;--focus:rgba(15, 94, 115,.32);--danger:#b42318;--danger-soft:#fdecea;--info-soft:#e6f1f8;
      font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--text)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);font-size:14px;line-height:1.55}
    .card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:24px 24px 20px;box-shadow:0 1px 2px rgba(40,42,58,.05)}
    .brand{display:flex;align-items:center;gap:10px;padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--border)}
    .brand-mark{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;letter-spacing:.03em}
    h1{margin:0;font-size:18px;font-weight:700;line-height:1.3}
    label{display:grid;gap:4px;margin-bottom:12px;font-size:13px;font-weight:500;color:var(--muted)}
    input{width:100%;min-height:36px;padding:4px 10px;border:1px solid var(--border-input);border-radius:8px;font:inherit;font-size:16px;color:var(--text);background:#fff}
    input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}
    button{width:100%;min-height:40px;margin-top:4px;border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
    button:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
    .message{margin:0 0 8px;padding:0;font-size:13px;color:var(--danger)}
    .message:empty{display:none}
    .portal{display:none;margin-top:12px;padding:8px 12px;border-radius:8px;background:var(--info-soft);font-size:13px}
    .portal a{font-weight:600}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="brand-mark">CY</span><h1>價格觀測室</h1></div>
    <form action="/api/auth/login" method="post" autocomplete="on">
      <label>員工編號<input name="employeeNo" type="text" inputmode="numeric" maxlength="4" pattern="\d{4}" autocomplete="username" required></label>
      <label>密碼<input name="password" type="password" minlength="8" maxlength="16" autocomplete="current-password" required></label>
      <p class="message" id="message" role="alert" aria-live="polite"></p>
      <button type="submit">登入</button>
    </form>
    <div class="portal" id="portal">首次使用或尚未完成 Email 驗證與密碼設定，請先到 <a id="portal-link" href="#" target="_blank" rel="noopener noreferrer">CY Web</a> 完成設定再回來登入。</div>
  </main>
  <script>
    const messages={
      invalid:'請輸入 4 碼員工編號與 8 到 16 字元的密碼。',
      failed:'員工編號或密碼不正確。',
      access:'此員工帳號沒有價格觀測室的使用權限。',
      rate:'登入嘗試次數過多，請稍後再試。',
      service:'中央帳號服務目前無法使用，請稍後再試。',
      'first-login':'請先到 CY Web 完成 Email 驗證與密碼設定。'
    };
    const key=new URLSearchParams(location.search).get('error');
    if(key){
      document.getElementById('message').textContent=messages[key]||messages.failed;
      if(key==='first-login'){
        fetch('/api/auth/portal').then(r=>r.ok?r.json():null).then(data=>{
          if(!data)return;
          document.getElementById('portal-link').href=data.url;
          document.getElementById('portal').style.display='block';
        }).catch(()=>{});
      }
    }
  </script>
</body>
</html>
