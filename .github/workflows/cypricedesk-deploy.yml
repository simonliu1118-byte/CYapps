name: CYPriceDesk Deploy

# An authorized dispatch or release-branch update publishes the current main.
on:
  workflow_dispatch:
  push:
    branches: [deploy/cypricedesk-production]

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/deploy/cypricedesk-production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cypricedesk-production
    concurrency:
      group: cypricedesk-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/CYPriceDesk
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # 公開主機名稱（原始碼已公開）；其餘部署識別碼不經 GitHub variables，改由下方步驟從 Cloudflare 解析並先遮蔽。
      CF_CYPRICEDESK_CUSTOM_DOMAIN: price.chihyuancm.com
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Verify deployed commit is the current remote main
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ] || [ "$remote" != "$GITHUB_SHA" ]; then
            echo "The deployment commit and checkout must both match current main." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/CYPriceDesk/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Resolve deployment identifiers from Cloudflare (masked)
        working-directory: .
        run: node .github/scripts/resolve-deploy-runtime.mjs --app cypricedesk --hostname "$CF_CYPRICEDESK_CUSTOM_DOMAIN"

      - name: Render production Cloudflare config
        run: node scripts/render-wrangler.mjs --output wrangler.deploy.jsonc

      - name: Write public release metadata
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from 'node:fs';
          const version = readFileSync('VERSION', 'utf8').trim();
          const build = Number(readFileSync('BUILD', 'utf8').trim());
          writeFileSync('public/release.json', JSON.stringify({version, build, commit: process.env.GITHUB_SHA}) + '\n', {flag: 'wx'});
          NODE

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.deploy.jsonc

      - name: Deploy Worker and static assets
        run: npx wrangler deploy --config wrangler.deploy.jsonc

      - name: Set fetcher signing secret
        env:
          CYPD_FETCHER_SECRET: ${{ secrets.CYPD_FETCHER_SECRET }}
        run: |
          if [ -z "$CYPD_FETCHER_SECRET" ]; then echo "CYPD_FETCHER_SECRET not set; auto query stays disabled."; exit 0; fi
          printf '%s' "$CYPD_FETCHER_SECRET" | npx wrangler secret put CYPD_FETCHER_SECRET --config wrangler.deploy.jsonc
      - name: Set optional Grok secrets
        env:
          GROK_WEBHOOK_URL: ${{ secrets.GROK_WEBHOOK_URL }}
          GROK_WEBHOOK_TOKEN: ${{ secrets.GROK_WEBHOOK_TOKEN }}
          GROK_API_TOKEN: ${{ secrets.GROK_API_TOKEN }}
        run: |
          for name in GROK_WEBHOOK_URL GROK_WEBHOOK_TOKEN GROK_API_TOKEN; do
            if [ -z "${!name}" ]; then echo "$name not set; skipping."; continue; fi
            printf '%s' "${!name}" | npx wrangler secret put "$name" --config wrangler.deploy.jsonc
          done

      - name: Verify live PriceDesk version
        shell: bash
        run: |
          set -euo pipefail
          release_file="$(mktemp)"
          trap 'rm -f "$release_file"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --silent --show-error --fail --max-time 10 \
              "https://$CF_CYPRICEDESK_CUSTOM_DOMAIN/release.json?commit=$GITHUB_SHA" -o "$release_file" \
              && cmp -s public/release.json "$release_file"; then
              cat "$release_file"
              exit 0
            fi
            if [ "$attempt" != 5 ]; then sleep 3; fi
          done
          echo "The public release manifest did not match the deployed commit." >&2
          exit 1

      - name: Remove production generated files
        if: always()
        run: rm -f wrangler.deploy.jsonc public/release.json
