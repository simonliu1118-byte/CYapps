name: SMARTCOPIConverter Stable Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smartcopiconverter-stable-release
  cancel-in-progress: false

jobs:
  release-windows-x64:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: apps/SMARTCOPIConverter
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache-dependency-path: apps/SMARTCOPIConverter/go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Validate official main and release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF_NAME -cne 'main') { throw 'Formal release must run from main.' }
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA) { throw 'Checkout SHA mismatch.' }
          $remote = & git ls-remote origin refs/heads/main
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($remote)) { throw 'Cannot verify origin/main.' }
          if (($remote.Trim() -split '\s+')[0] -cne $env:GITHUB_SHA) { throw 'main advanced; refusing stale release.' }
          $version = (Get-Content VERSION -Raw).Trim()
          $build = (Get-Content BUILD -Raw).Trim()
          if ($version -cnotmatch '^\d+\.\d+\.\d+$') { throw "Invalid VERSION: $version" }
          if ($build -cne '0') { throw "Formal Release requires BUILD=0, got $build" }
          if (-not (Test-Path "./V$version.txt")) { throw 'Missing matching release notes.' }
          $tag = "smartcopiconverter-v$version"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $api = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY"
          try {
            $null = Invoke-RestMethod -Headers $headers -Uri "$api/releases/tags/$tag"
            throw "Release already exists: $tag"
          } catch {
            if ($_.Exception.Message -like "Release already exists:*") { throw }
            if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
          }
          $tagRefs = @(Invoke-RestMethod -Headers $headers -Uri "$api/git/matching-refs/tags/$tag")
          if (@($tagRefs | Where-Object { $_.ref -ceq "refs/tags/$tag" }).Count -gt 0) { throw "Tag already exists: $tag" }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          ("RELEASE_ZIP=SMARTCOPIConverter_V" + $version + "_Windows_x64.zip") >> $env:GITHUB_ENV

      - name: Rebuild and test Windows x64 GUI
        run: |
          ./build.ps1
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path ./SMARTCOPIConverter.exe)) { throw 'Build or Go tests failed.' }

      - name: Assemble portable ZIP
        run: |
          $folder = Join-Path $PWD 'dist/SMARTCOPIConverter'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item ./SMARTCOPIConverter.exe, ./VERSION, ./BUILD, ./README.md, ./CHANGELOG.md $folder
          Copy-Item "./V$env:RELEASE_VERSION.txt" $folder
          Copy-Item "$env:GITHUB_WORKSPACE/LICENSE" $folder
          $zip = Join-Path $PWD "dist/$env:RELEASE_ZIP"
          Compress-Archive -Path $folder -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip)) { throw 'Missing ZIP.' }
          $entries = tar -tf $zip
          if ($LASTEXITCODE -ne 0 -or -not ($entries -match 'SMARTCOPIConverter.exe')) { throw 'ZIP contents invalid.' }

      - name: Scan public release package for secrets and production bindings
        run: |
          python "$env:GITHUB_WORKSPACE/.github/scripts/scan-public-package.py" ./SMARTCOPIConverter.exe "dist/$env:RELEASE_ZIP"
          if ($LASTEXITCODE -ne 0) { throw 'Public package scan failed.' }

      - name: Generate SHA-256 checksums
        run: |
          $zipHash = (Get-FileHash "dist/$env:RELEASE_ZIP" -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeHash = (Get-FileHash ./SMARTCOPIConverter.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @("$zipHash  $env:RELEASE_ZIP", "$exeHash  SMARTCOPIConverter.exe") | Set-Content -Encoding ascii ./dist/SHA256SUMS.txt
          if ($zipHash -cne (Get-FileHash "dist/$env:RELEASE_ZIP" -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'ZIP hash mismatch.' }
          if ($exeHash -cne (Get-FileHash ./SMARTCOPIConverter.exe -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'EXE hash mismatch.' }

      - name: Publish formal GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notesFile = Join-Path $env:RUNNER_TEMP 'SMARTCOPIConverter-release-notes.md'
          Get-Content "./V$env:RELEASE_VERSION.txt" -Raw | Set-Content -Encoding utf8 $notesFile
          gh release create $env:RELEASE_TAG "dist/$env:RELEASE_ZIP" ./SMARTCOPIConverter.exe ./dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "SMARTCOPIConverter V$env:RELEASE_VERSION｜SMART 銷貨單格式轉換工具" --notes-file $notesFile --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed.' }
