name: CYInvoice Go V1.1.0 Historical Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cyinvoice-go-v1.1.0-archive.yml"

permissions:
  contents: write

concurrency:
  group: cyinvoice-go-v1.1.0-archive
  cancel-in-progress: false

jobs:
  release-go-rollback:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
        working-directory: apps/CYInvoice

    steps:
      - name: Checkout fixed pre-V2 Go source
        uses: actions/checkout@v7
        with:
          ref: 4c2335e00173368540fe10a641fccffcb251f999

      - name: Validate historical identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content ./VERSION -Raw).Trim()
          $build = (Get-Content ./BUILD -Raw).Trim()
          if ($version -ne '1.1.0' -or $build -ne '0') { throw "Historical source identity is not V1.1.0 / BUILD 0" }
          gh release view cyinvoice-v1.1.0 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            "CYINVOICE_SHOULD_ARCHIVE=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Historical Release already exists; nothing to publish."
          } else {
            $remoteTag = git ls-remote --tags origin refs/tags/cyinvoice-v1.1.0
            if (![string]::IsNullOrWhiteSpace($remoteTag)) { throw "Tag cyinvoice-v1.1.0 exists without a matching Release" }
            "CYINVOICE_SHOULD_ARCHIVE=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Set up Go
        if: env.CYINVOICE_SHOULD_ARCHIVE == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/CYInvoice/go.mod
          cache: false

      - name: Verify source and module files
        if: env.CYINVOICE_SHOULD_ARCHIVE == 'true'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          ./scripts/verify-source.ps1

      - name: Run tests and static analysis
        if: env.CYINVOICE_SHOULD_ARCHIVE == 'true'
        run: |
          go test ./...
          go vet ./...

      - name: Build and verify rollback package
        if: env.CYINVOICE_SHOULD_ARCHIVE == 'true'
        run: |
          ./scripts/build.ps1 -Version 1.1.0 -Build 0 -Commit 4c2335e00173
          ./scripts/verify-pe.ps1 -Path ./dist/CYInvoice/CYInvoice.exe
          ./scripts/verify-package.ps1 -Path ./dist/CYInvoice_V1.1.0.zip -Version 1.1.0 -Build 0

      - name: Create checksum and historical notes
        if: env.CYINVOICE_SHOULD_ARCHIVE == 'true'
        run: |
          $zipName = 'CYInvoice_V1.1.0.zip'
          $zipPath = Join-Path ./dist $zipName
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content -Path "$zipPath.sha256" -Encoding ascii
          @"
          CYInvoice V1.1.0

          Windows 10/11 x64 Go／Win32 歷史回退版。

          Copyright © 2026 C.C. Liu, Chihyuan Co. All Rights Reserved.

          - 從 V2 合併前固定 main commit 4c2335e00173368540fe10a641fccffcb251f999 重建。
          - 僅供需要回退時使用；最新正式版為 C#／WinForms V2.0.0。
          - 發行包已重新執行 Go tests、go vet、機密掃描、PE／Icon／manifest 與 ZIP 結構驗證。
          "@ | Set-Content -Path ./dist/release-notes.md -Encoding utf8

      - name: Publish historical GitHub Release
        if: env.CYINVOICE_SHOULD_ARCHIVE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create cyinvoice-v1.1.0 `
            ./dist/CYInvoice_V1.1.0.zip `
            ./dist/CYInvoice_V1.1.0.zip.sha256 `
            --repo $env:GITHUB_REPOSITORY `
            --target 4c2335e00173368540fe10a641fccffcb251f999 `
            --title "CYInvoice V1.1.0 (Go rollback)" `
            --notes-file ./dist/release-notes.md `
            --latest=false
