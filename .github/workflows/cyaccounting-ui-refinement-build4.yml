name: CYAccounting UI Refinement Build 4 (one-time)

on:
  push:
    branches:
      - cyaccounting/v1.2.0-visual-phase1
    paths:
      - .github/workflows/cyaccounting-ui-refinement-build4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cyaccounting/v1.2.0-visual-phase1
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Apply guarded Build 4 refinement
        working-directory: apps/CYAccounting
        shell: pwsh
        run: |
          python tools/refine_ui_build4.py
          if ($LASTEXITCODE -ne 0) { throw "Build 4 refinement failed" }

      - name: Validate transformed source
        shell: pwsh
        run: |
          python -m compileall -q apps/CYAccounting/app apps/CYAccounting/tests
          if ((Get-Content apps/CYAccounting/BUILD -Raw).Trim() -ne "4") { throw "BUILD is not 4" }
          $theme = Get-Content apps/CYAccounting/app/theme.py -Raw
          if ($theme -notmatch 'QDialog#importDialog QGroupBox QWidget') { throw "Import child-font reset missing" }
          if ($theme -match 'QDialog#importDialog QGroupBox::title \{[^}]*background:') { throw "Import title still has explicit background" }
          $main = Get-Content apps/CYAccounting/app/main.py -Raw
          if ($main -notmatch 'WindowSystemMenuHint') { throw "True no-icon window flags missing" }
          if ($main -notmatch 'WM_SETICON, ICON_SMALL, 0') { throw "Native no-icon cleanup missing" }

      - name: Commit Build 4 source
        shell: pwsh
        run: |
          git config user.name "simonliu1118-byte"
          git config user.email "286269326+simonliu1118-byte@users.noreply.github.com"
          git add apps/CYAccounting/app/main.py apps/CYAccounting/app/theme.py apps/CYAccounting/tests/test_app.py apps/CYAccounting/BUILD apps/CYAccounting/V1.2.0.txt
          git rm apps/CYAccounting/tools/refine_ui_build4.py
          git diff --cached --check
          if (git diff --cached --quiet) { throw "No Build 4 changes staged" }
          git commit -m "ui(CYAccounting): fix effective legend bold and dialog title alignment"
          git push origin HEAD:cyaccounting/v1.2.0-visual-phase1
