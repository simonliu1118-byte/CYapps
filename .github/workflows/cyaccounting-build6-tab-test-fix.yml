name: CYAccounting Build 6 Tab Test Fix (one-time)

on:
  push:
    branches:
      - cyaccounting/v1.2.0-visual-phase1
    paths:
      - .github/workflows/cyaccounting-build6-tab-test-fix.yml
      - apps/CYAccounting/tools/fix_build6_tab_test.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cyaccounting/v1.2.0-visual-phase1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Apply guarded test fix
        working-directory: apps/CYAccounting
        shell: pwsh
        run: |
          python tools/fix_build6_tab_test.py
          if ($LASTEXITCODE -ne 0) { throw "Build 6 tab-test fix failed" }
      - name: Validate tests compile
        shell: pwsh
        run: python -m compileall -q apps/CYAccounting/tests
      - name: Commit test fix
        shell: pwsh
        run: |
          git config user.name "simonliu1118-byte"
          git config user.email "286269326+simonliu1118-byte@users.noreply.github.com"
          git add apps/CYAccounting/tests/test_app.py
          git rm apps/CYAccounting/tools/fix_build6_tab_test.py
          git diff --cached --check
          if (git diff --cached --quiet) { throw "No Build 6 test fix staged" }
          git commit -m "test(CYAccounting): scope category-tab visual regression"
          git push origin HEAD:cyaccounting/v1.2.0-visual-phase1
