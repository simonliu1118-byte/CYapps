name: One-time CYapps migration import

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_migration-import.yml"

permissions:
  contents: write

jobs:
  import-public-source:
    runs-on: ubuntu-latest
    env:
      MIGRATION_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-a140-81f5-9300-24b90f68252d/raw?se=2026-09-12T14%3A09%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=5c311300-0248-59d4-8cdf-f5a266e07158&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-12T01%3A58%3A00Z&ske=2026-09-13T01%3A58%3A00Z&sks=b&skv=2026-02-06&sig=qPWQxeUq4c3qh2jt%2BfnEZN/%2BNUW9Hel0ZsRqnV7lV90%3D"
    steps:
      - name: Checkout clean public repository
        uses: actions/checkout@v4

      - name: Download and verify migration package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$MIGRATION_URL" -o /tmp/migration.zip
          rm -rf /tmp/migration-artifact /tmp/migration-source
          mkdir -p /tmp/migration-artifact /tmp/migration-source
          unzip -q /tmp/migration.zip -d /tmp/migration-artifact
          cd /tmp/migration-artifact
          sha256sum -c CYapps-public-source.tar.gz.sha256
          tar -xzf CYapps-public-source.tar.gz -C /tmp/migration-source
          cd /tmp/migration-source
          sha256sum -c /tmp/migration-artifact/SHA256SUMS.txt

      - name: Import three public applications
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/CYAccounting apps/CYEnvelope apps/CYInvoice
          mkdir -p apps
          cp -a /tmp/migration-source/apps/CYAccounting apps/
          cp -a /tmp/migration-source/apps/CYEnvelope apps/
          cp -a /tmp/migration-source/apps/CYInvoice apps/

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps
          git status --short
          git commit -m "chore: import public CY applications source"
          git push origin HEAD:main
