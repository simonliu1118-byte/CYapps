name: CYInvoice Password Reset PBKDF2 Fix (Temporary)

on:
  push:
    branches:
      - cyinvoice/cloud-onboarding-first-device
    paths:
      - '.github/workflows/cyinvoice-password-reset-pbkdf2-fix-temp.yml'

permissions:
  contents: write

jobs:
  fix-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cyinvoice/cloud-onboarding-first-device
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Patch Cloud credential iteration count
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('apps/CYInvoice/cloud/src/web-password-recovery.ts'): (
                  'const PASSWORD_ITERATIONS = 210_000;',
                  'const PASSWORD_ITERATIONS = 100_000;'
              ),
              Path('apps/CYInvoice/src/CYInvoice.Core/CloudEmployeeCredentialVerifier.cs'): (
                  'private const int PasswordIterations = 210_000;',
                  'private const int PasswordIterations = 100_000;'
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one match in {path}: {old}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          # The two diagnostic workflows were intentionally temporary.
          for path in (
              Path('.github/workflows/cyinvoice-password-reset-diagnose-temp.yml'),
              Path('.github/workflows/cyinvoice-pbkdf2-probe-temp.yml'),
          ):
              if path.exists():
                  path.unlink()
          PY

          grep -n 'PASSWORD_ITERATIONS = 100_000' apps/CYInvoice/cloud/src/web-password-recovery.ts
          grep -n 'PasswordIterations = 100_000' apps/CYInvoice/src/CYInvoice.Core/CloudEmployeeCredentialVerifier.cs

      - name: Validate Cloud source
        working-directory: apps/CYInvoice/cloud
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm test
          npm run deploy:dry-run

      - name: Run Cloud client contract tests
        working-directory: apps/CYInvoice
        run: dotnet run --project tests/CYInvoice.Cloud.Tests/CYInvoice.Cloud.Tests.csproj -c Release

      - name: Probe 100k PBKDF2 on remote Workers runtime
        working-directory: apps/CYInvoice/cloud
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pbkdf2-100k-probe.js <<'JS'
          export default {
            async fetch() {
              try {
                const salt = new Uint8Array(16);
                crypto.getRandomValues(salt);
                const key = await crypto.subtle.importKey('raw', new TextEncoder().encode('ProbePassword123'), 'PBKDF2', false, ['deriveBits']);
                const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: 100000 }, key, 256);
                return Response.json({ ok: bits.byteLength === 32 });
              } catch (error) {
                return Response.json({ ok: false, error: error instanceof Error ? error.message : String(error) }, { status: 500 });
              }
            }
          };
          JS
          npx wrangler dev /tmp/pbkdf2-100k-probe.js --remote --port 8799 > /tmp/pbkdf2-100k.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          success=0
          for i in $(seq 1 45); do
            if curl --silent --show-error --output /tmp/pbkdf2-100k-result.json http://127.0.0.1:8799; then
              if grep -q '"ok":true' /tmp/pbkdf2-100k-result.json; then success=1; break; fi
            fi
            sleep 1
          done
          cat /tmp/pbkdf2-100k-result.json 2>/dev/null || true
          if [ "$success" != 1 ]; then
            tail -n 100 /tmp/pbkdf2-100k.log || true
            exit 1
          fi
          kill $pid 2>/dev/null || true
          trap - EXIT

      - name: Commit source fix and clean temporary diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/CYInvoice/cloud/src/web-password-recovery.ts \
                  apps/CYInvoice/src/CYInvoice.Core/CloudEmployeeCredentialVerifier.cs \
                  .github/workflows/cyinvoice-password-reset-diagnose-temp.yml \
                  .github/workflows/cyinvoice-pbkdf2-probe-temp.yml
          git commit -m 'fix(CYInvoice Cloud): cap PBKDF2 at Workers limit'
          git push origin HEAD:cyinvoice/cloud-onboarding-first-device

      - name: Deploy fixed development Worker
        working-directory: apps/CYInvoice/cloud
        run: npx wrangler deploy
