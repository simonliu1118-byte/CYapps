name: CYSmartERP Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "apps/CYSmartERP/**"
      - ".github/workflows/cysmart-erp-build.yml"

permissions:
  contents: read

concurrency:
  group: cysmart-erp-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/CYSmartERP
    steps:
      - uses: actions/checkout@v7

      - name: Read VERSION
        shell: pwsh
        run: |
          $version = (Get-Content ./VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid CYSmartERP VERSION: $version" }
          "CYSMARTERP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: false

      - name: Test
        run: go test ./...

      - name: Build Windows x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags "-H=windowsgui" -o "dist/CYSmartERP.exe" .
          if (-not (Test-Path "dist/CYSmartERP.exe")) { throw "CYSmartERP.exe was not produced" }
          Get-FileHash "dist/CYSmartERP.exe" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  CYSmartERP.exe" } | Set-Content "dist/SHA256.txt"

      - name: Upload engineering package
        uses: actions/upload-artifact@v7
        with:
          name: CYSmartERP-v${{ env.CYSMARTERP_VERSION }}-windows-x64-run${{ github.run_number }}
          path: |
            apps/CYSmartERP/dist/CYSmartERP.exe
            apps/CYSmartERP/dist/SHA256.txt
            apps/CYSmartERP/README.md
            apps/CYSmartERP/settings.example.json
          if-no-files-found: error
          retention-days: 14
