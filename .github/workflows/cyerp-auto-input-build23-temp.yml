          def read(path):
              return Path(path).read_text(encoding='utf-8').replace('\r\n', '\n')

          def write(path, text):
              with open(path, 'w', encoding='utf-8', newline='\n') as f:
                  f.write(text)

          def rep(path, old, new, count=1):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'Expected source block not found in {path}: {old[:180]!r}')
              write(path, text.replace(old, new, count))

          def replace_between(path, start_marker, end_marker, new_block):
              text = read(path)
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f'Start marker not found in {path}: {start_marker}')
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'End marker not found in {path}: {end_marker}')
              write(path, text[:start] + new_block + text[end:])

          write('BUILD', '23\n')
