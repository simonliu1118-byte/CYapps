      - name: Create or confirm distinct CYID production Worker resource
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          code="$(curl -sS -o /tmp/cyid-prod-worker-check.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$CYID_WORKER_NAME/settings")"

          if [[ "$code" == "404" ]]; then
            printf '%s\n' 'export default { async fetch() { return new Response("CYID production bootstrap"); } };' > /tmp/cyid-production-bootstrap.mjs
            if ! npx wrangler deploy /tmp/cyid-production-bootstrap.mjs \
              --name "$CYID_WORKER_NAME" \
              --compatibility-date 2026-09-25 \
              > /tmp/cyid-production-bootstrap.log 2>&1; then
              node -e '
                const fs=require("node:fs");
                const p="/tmp/cyid-production-bootstrap.log";
                const text=fs.existsSync(p)?fs.readFileSync(p,"utf8"):"";
                const low=text.toLowerCase();
                const cats=[];
                if(low.includes("access")||low.includes("permission")||low.includes("forbidden")||low.includes("unauthorized"))cats.push("PERMISSION");
                if(low.includes("limit")||low.includes("quota"))cats.push("QUOTA");
                if(low.includes("name")&&(low.includes("invalid")||low.includes("already")))cats.push("NAME");
                console.error("CYID production Worker creation failed category="+(cats.join(",")||"unclassified"));
              '
              exit 1
            fi
          elif [[ "$code" != "200" ]]; then
            echo "Unable to confirm the CYID production Worker target." >&2
            exit 1
          fi

          if [[ "$CYID_WORKER_NAME" == "$CYID_DEV_WORKER_NAME" ]]; then
            echo "Production Worker must be distinct from development." >&2
            exit 1
          fi
          echo "Distinct CYID production Worker resource is available."

      - name: Create or confirm distinct CYID production D1
        shell: bash
        run: |
          set -euo pipefail
          list_file="$(mktemp)"
          cleanup_list() { rm -f "$list_file" /tmp/cyid-prod-d1-create.log; }
          trap cleanup_list EXIT

          list_d1() {
            npx wrangler d1 list --json > "$list_file" 2>/dev/null
          }
          find_id() {
            DB_NAME="$CYID_D1_DATABASE_NAME" node -e '
              const fs=require("node:fs");
              const data=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              const rows=Array.isArray(data)?data:(Array.isArray(data?.result)?data.result:[]);
              const hit=rows.find(x=>String(x?.name||"")===process.env.DB_NAME);
              if(hit) process.stdout.write(String(hit.uuid||hit.id||""));
            ' "$list_file"
          }

          list_d1
          CYID_D1_DATABASE_ID="$(find_id)"
          if [[ -z "$CYID_D1_DATABASE_ID" ]]; then
            if ! npx wrangler d1 create "$CYID_D1_DATABASE_NAME" --location apac > /tmp/cyid-prod-d1-create.log 2>&1; then
              echo "Unable to create CYID production D1." >&2
              exit 1
            fi
            list_d1
            CYID_D1_DATABASE_ID="$(find_id)"
          fi
          if [[ ! "$CYID_D1_DATABASE_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "CYID production D1 identifier failed validation." >&2
            exit 1
          fi
          if [[ "$CYID_D1_DATABASE_ID" == "$CYID_DEV_D1_DATABASE_ID" ]]; then
            echo "Production D1 must be distinct from development." >&2
            exit 1
          fi
          echo "::add-mask::$CYID_D1_DATABASE_ID"
          echo "CYID_D1_DATABASE_ID=$CYID_D1_DATABASE_ID" >> "$GITHUB_ENV"
          echo "Distinct CYID production D1 is available."

