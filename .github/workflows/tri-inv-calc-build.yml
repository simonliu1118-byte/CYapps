name: TriINVCalc Build and Test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/TriINVCalc/**'
      - '.github/workflows/tri-inv-calc-build.yml'
      - '.github/scripts/scan-public-package.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: triinvcalc-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: '1.22.x'
          cache-dependency-path: apps/TriINVCalc/go.mod

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build and test portable package
        shell: pwsh
        working-directory: apps/TriINVCalc
        run: ./build.ps1

      - name: Scan engineering artifact for secrets and production bindings
        shell: pwsh
        working-directory: apps/TriINVCalc
        run: |
          $package = Get-ChildItem ./dist/*.zip | Select-Object -First 1
          if (-not $package) { throw "TriINVCalc package not found for safety scan" }
          python "$env:GITHUB_WORKSPACE/.github/scripts/scan-public-package.py" $package.FullName

      - name: Upload engineering artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriINVCalc-${{ github.sha }}
          path: apps/TriINVCalc/dist/*.zip
          retention-days: 3
          if-no-files-found: error
