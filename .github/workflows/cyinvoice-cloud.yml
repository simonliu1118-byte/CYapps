name: CYInvoice Cloud Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/CYInvoice/cloud/**'
      - 'apps/CYInvoice/src/CYInvoice.Core/**'
      - 'apps/CYInvoice/src/CYInvoice.WinForms/**'
      - 'apps/CYInvoice/tests/CYInvoice.Cloud.Tests/**'
      - '.github/workflows/cyinvoice-cloud.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/CYInvoice/cloud/**'
      - 'apps/CYInvoice/src/CYInvoice.Core/**'
      - 'apps/CYInvoice/src/CYInvoice.WinForms/**'
      - 'apps/CYInvoice/tests/CYInvoice.Cloud.Tests/**'
      - '.github/workflows/cyinvoice-cloud.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/CYInvoice/cloud

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run check

      - name: Test bootstrap SQL
        run: npm test

      - name: Validate Worker bundle
        run: npm run deploy:dry-run

      - name: Validate D1 migrations with SQLite
        shell: bash
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path

          db = sqlite3.connect(':memory:')
          migrations = sorted(Path('migrations').glob('*.sql'))
          if not migrations:
              raise SystemExit('no D1 migrations found')

          for migration in migrations:
              print(f'applying {migration.name}')
              db.executescript(migration.read_text(encoding='utf-8'))

          tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required_tables = {
              'workspaces', 'devices', 'device_pairing_codes', 'email_otp_challenges',
              'cloud_employees', 'device_employee_links', 'employee_link_candidates',
              'device_invitations', 'security_audit_events'
          }
          missing_tables = required_tables - tables
          if missing_tables:
              raise SystemExit(f'missing tables: {sorted(missing_tables)}')

          device_columns = {row[1] for row in db.execute('PRAGMA table_info(devices)')}
          required_device_columns = {
              'token_hash', 'token_created_at', 'pairing_id', 'revoked_at',
              'employee_onboarding_closed_at', 'employee_authority_state',
              'employee_transition_started_at', 'employee_transition_completed_at',
              'invitation_id'
          }
          missing_columns = required_device_columns - device_columns
          if missing_columns:
              raise SystemExit(f'missing device columns: {sorted(missing_columns)}')

          workspace_columns = {row[1] for row in db.execute('PRAGMA table_info(workspaces)')}
          required_workspace_columns = {
              'recovery_email', 'recovery_email_verified_at', 'employee_revision'
          }
          missing_workspace_columns = required_workspace_columns - workspace_columns
          if missing_workspace_columns:
              raise SystemExit(f'missing workspace columns: {sorted(missing_workspace_columns)}')

          otp_columns = {row[1] for row in db.execute('PRAGMA table_info(email_otp_challenges)')}
          required_otp_columns = {
              'challenge_id', 'purpose', 'scope_key', 'email_normalized', 'otp_digest',
              'delivery_state', 'attempt_count', 'max_attempts', 'expires_at',
              'resend_after', 'sent_at', 'consumed_at', 'created_at', 'updated_at'
          }
          missing_otp_columns = required_otp_columns - otp_columns
          if missing_otp_columns:
              raise SystemExit(f'missing OTP columns: {sorted(missing_otp_columns)}')

          employee_columns = {row[1] for row in db.execute('PRAGMA table_info(cloud_employees)')}
          required_employee_columns = {
              'employee_id', 'workspace_id', 'employee_no', 'name', 'email_normalized',
              'email_verified_at', 'role', 'enabled', 'source_device_id',
              'credential_verifier', 'credential_algorithm', 'credential_version',
              'credential_updated_at', 'revision', 'created_at', 'updated_at'
          }
          missing_employee_columns = required_employee_columns - employee_columns
          if missing_employee_columns:
              raise SystemExit(f'missing central employee columns: {sorted(missing_employee_columns)}')

          device_indexes = {row[1] for row in db.execute("PRAGMA index_list('devices')")}
          required_device_indexes = {
              'idx_devices_token_hash', 'idx_devices_pairing_id', 'idx_devices_invitation_id',
              'idx_devices_employee_authority_state'
          }
          missing_indexes = required_device_indexes - device_indexes
          if missing_indexes:
              raise SystemExit(f'missing device indexes: {sorted(missing_indexes)}')

          otp_indexes = {row[1] for row in db.execute("PRAGMA index_list('email_otp_challenges')")}
          required_otp_indexes = {
              'idx_email_otp_email_purpose_created', 'idx_email_otp_expiry',
              'idx_email_otp_purpose_scope_created'
          }
          missing_otp_indexes = required_otp_indexes - otp_indexes
          if missing_otp_indexes:
              raise SystemExit(f'missing OTP indexes: {sorted(missing_otp_indexes)}')

          employee_indexes = {row[1] for row in db.execute("PRAGMA index_list('cloud_employees')")}
          required_employee_indexes = {
              'idx_cloud_employees_workspace_employee_no',
              'idx_cloud_employees_workspace_email',
              'idx_cloud_employees_single_super_admin',
              'idx_cloud_employees_workspace_role',
              'idx_cloud_employees_workspace_revision'
          }
          missing_employee_indexes = required_employee_indexes - employee_indexes
          if missing_employee_indexes:
              raise SystemExit(f'missing central employee indexes: {sorted(missing_employee_indexes)}')

          workspace_indexes = {row[1] for row in db.execute("PRAGMA index_list('workspaces')")}
          if 'idx_single_workspace' not in workspace_indexes:
              raise SystemExit('missing single-workspace bootstrap invariant index')

          db.execute("INSERT INTO workspaces (workspace_id, display_name) VALUES ('ws_one', 'One')")
          try:
              db.execute("INSERT INTO workspaces (workspace_id, display_name) VALUES ('ws_two', 'Two')")
          except sqlite3.IntegrityError:
              pass
          else:
              raise SystemExit('single-workspace invariant did not reject a second workspace')

          db.execute("INSERT INTO devices (device_id, workspace_id, display_name, status, created_at, updated_at) VALUES ('dev_a', 'ws_one', 'A', 'active', '2026-09-21T00:00:00Z', '2026-09-21T00:00:00Z')")
          state = db.execute("SELECT employee_authority_state FROM devices WHERE device_id='dev_a'").fetchone()[0]
          if state != 'transitioning':
              raise SystemExit(f'new Device must default to transitioning employee authority, got {state!r}')

          db.execute("INSERT INTO cloud_employees (employee_id, workspace_id, employee_no, name, email_normalized, role, enabled, source_device_id) VALUES ('emp_x', 'ws_one', '0001', 'X', 'x@example.test', 'SUPER_ADMIN', 1, 'dev_a')")
          try:
              db.execute("INSERT INTO cloud_employees (employee_id, workspace_id, employee_no, name, email_normalized, role, enabled, source_device_id) VALUES ('emp_y', 'ws_one', '0002', 'Y', 'y@example.test', 'SUPER_ADMIN', 1, 'dev_a')")
          except sqlite3.IntegrityError:
              pass
          else:
              raise SystemExit('single-SUPER_ADMIN invariant did not reject a second SUPER_ADMIN')

          # Regression: schema 3 rejected the scoped purpose already used by
          # the pairing Worker. Schema 5 must accept it without weakening the
          # one-time OTP table contract.
          db.execute("""
              INSERT INTO email_otp_challenges (
                  challenge_id, purpose, scope_key, email_normalized, otp_digest,
                  delivery_state, expires_at, resend_after
              ) VALUES (
                  'otp_pairing_regression',
                  'device_pairing_authorization:ws_one:dev_a',
                  'ws_one:dev_a',
                  'owner@example.test',
                  ?, 'sent', '2026-09-21T00:10:00Z', '2026-09-21T00:01:00Z'
              )
          """, ('a' * 64,))

          # Workspace bootstrap is intentionally unscoped. Its scope_key must
          # remain NULL; the Schema 7 CHECK constraint correctly rejects an
          # empty string.
          db.execute("""
              INSERT INTO email_otp_challenges (
                  challenge_id, purpose, scope_key, email_normalized, otp_digest,
                  delivery_state, expires_at, resend_after
              ) VALUES (
                  'otp_bootstrap_regression',
                  'workspace_bootstrap',
                  NULL,
                  'owner@example.test',
                  ?, 'sent', '2026-09-21T00:10:00Z', '2026-09-21T00:01:00Z'
              )
          """, ('b' * 64,))

          # Password recovery uses its own purpose and cannot be confused with
          # Employee Email change or Workspace recovery challenges.
          db.execute("""
              INSERT INTO email_otp_challenges (
                  challenge_id, purpose, scope_key, email_normalized, otp_digest,
                  delivery_state, expires_at, resend_after
              ) VALUES (
                  'otp_password_recovery_regression',
                  'employee_password_recovery',
                  'employee_password_recovery:ws_one:emp_x:1',
                  'x@example.test',
                  ?, 'sent', '2026-09-21T00:10:00Z', '2026-09-21T00:01:00Z'
              )
          """, ('c' * 64,))

          print('D1 migrations syntax/shape/invariant check passed')
          PY

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Windows-client cloud contract tests
        working-directory: apps/CYInvoice
        run: dotnet run --project tests/CYInvoice.Cloud.Tests/CYInvoice.Cloud.Tests.csproj -c Release

  windows-client:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
        working-directory: apps/CYInvoice

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore Windows solution
        run: dotnet restore CYInvoice.sln

      - name: Build Windows client
        run: dotnet build CYInvoice.sln -c Release -p:Platform=x64 --no-restore

      - name: Run WinForms startup smoke test
        run: |
          dotnet run --project src/CYInvoice.WinForms/CYInvoice.WinForms.csproj -c Release -p:Platform=x64 --no-build -- --startup-smoke-test
          if ($LASTEXITCODE -ne 0) { throw "WinForms startup smoke test failed" }

      - name: Run cloud client contract tests on Windows
        run: dotnet run --project tests/CYInvoice.Cloud.Tests/CYInvoice.Cloud.Tests.csproj -c Release

      - name: Build engineering package
        run: |
          $version = (Get-Content ./VERSION -Raw).Trim()
          $build = [int]((Get-Content ./BUILD -Raw).Trim())
          ./scripts/build.ps1 -Version $version -Build $build -Engineering
          $artifactRoot = "./dist/cloud-foundation-artifact"
          New-Item -Path $artifactRoot -ItemType Directory -Force | Out-Null
          Copy-Item -Path "./dist/CYInvoice" -Destination $artifactRoot -Recurse
          if (!(Test-Path "$artifactRoot/CYInvoice/CYInvoice.exe" -PathType Leaf)) {
            throw "Cloud foundation engineering artifact is missing CYInvoice.exe"
          }

      - name: Upload cloud foundation engineering package
        uses: actions/upload-artifact@v7
        with:
          name: CYInvoice_cloud-foundation_engineering-run${{ github.run_number }}
          path: apps/CYInvoice/dist/cloud-foundation-artifact/
          if-no-files-found: error
          retention-days: 14
