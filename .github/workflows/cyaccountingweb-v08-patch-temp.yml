name: CYAccountingWeb V0.8 Patch (Temporary)

on:
  push:
    branches:
      - cyaccountingweb/v0.8-desktop-ux
    paths:
      - '.github/workflows/cyaccountingweb-v08-patch-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cyaccountingweb/v0.8-desktop-ux
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Patch V0.8 app files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          auth = Path('apps/CYAccountingWeb/public/auth.js')
          text = auth.read_text(encoding='utf-8')
          old = "  const version = document.querySelector('.version');\n  if (version) version.textContent = 'V0.5.0';\n"
          if old not in text:
              raise SystemExit('legacy auth version override not found')
          auth.write_text(text.replace(old, '', 1), encoding='utf-8')

          index = Path('apps/CYAccountingWeb/public/index.html')
          text = index.read_text(encoding='utf-8')
          if '/v08.css' not in text:
              text = text.replace('  <link rel="stylesheet" href="/v07.css">\n', '  <link rel="stylesheet" href="/v07.css">\n  <link rel="stylesheet" href="/v08.css">\n', 1)
          text = text.replace('V0.7.0</span>', 'V0.8.0</span>', 1)
          if '/v08.js' not in text:
              text = text.replace('  <script src="/v07.js" defer></script>\n', '  <script src="/v07.js" defer></script>\n  <script src="/v08.js" defer></script>\n', 1)
          index.write_text(text, encoding='utf-8')

          Path('apps/CYAccountingWeb/VERSION').write_text('0.8.0\n', encoding='utf-8')

          todo = Path('apps/CYAccountingWeb/TODO.md')
          text = todo.read_text(encoding='utf-8')
          marker = '## UI／UX 與多裝置支援\n\n'
          addition = ('- [x] Desktop UI/UX Phase 1：輸入確認改為右側可收合 drawer、修正版本顯示單一來源、提高記帳資料表桌面資訊密度（V0.8.0）。\n')
          if addition not in text:
              if marker not in text:
                  raise SystemExit('UI/UX TODO marker not found')
              text = text.replace(marker, marker + addition, 1)
          todo.write_text(text, encoding='utf-8')
          PY

          node --check apps/CYAccountingWeb/public/auth.js
          node --check apps/CYAccountingWeb/public/v08.js
          grep -q 'V0.8.0' apps/CYAccountingWeb/public/index.html
          grep -q '/v08.css' apps/CYAccountingWeb/public/index.html
          grep -q '/v08.js' apps/CYAccountingWeb/public/index.html
          ! grep -q "version.textContent = 'V0.5.0'" apps/CYAccountingWeb/public/auth.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/CYAccountingWeb/public/auth.js \
                  apps/CYAccountingWeb/public/index.html \
                  apps/CYAccountingWeb/VERSION \
                  apps/CYAccountingWeb/TODO.md
          git commit -m 'feat(CYAccountingWeb): start V0.8 desktop UX pass'
          git push origin HEAD:cyaccountingweb/v0.8-desktop-ux
