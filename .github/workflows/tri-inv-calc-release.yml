name: TriINVCalc Release

on:
  workflow_dispatch:
  # An explicitly approved version request triggers one release from main.
  # Normal source pushes and PRs do not publish.
  push:
    branches: [main]
    paths:
      - 'apps/TriINVCalc/RELEASE_REQUEST'

permissions:
  contents: write

concurrency:
  group: triinvcalc-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/TriINVCalc
    steps:
      - name: Checkout official main
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22.x'
          cache: true
          cache-dependency-path: apps/TriINVCalc/go.mod

      - name: Set up Python for public safety scanning
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Validate version and release identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content ./VERSION -Raw).Trim()
          $build = [int]((Get-Content ./BUILD -Raw).Trim())
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid VERSION: $version" }
          if ($build -ne 0) { throw "Non-zero BUILD must be approved separately before formal Release." }
          $tag = "TriINVCalc-v$version"
          $zipName = "TriINVCalc_V$version.zip"
          if (-not (Test-Path "./V$version.txt")) { throw "Missing release notes for V$version" }
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $request = (Get-Content ./RELEASE_REQUEST -Raw).Trim()
            if ($request -ne $version) { throw "Release request $request does not match VERSION $version." }
          }

          # A missing release (404) is expected for a new version.
          # Do not use a failing native CLI call for existence detection:
          # PowerShell may terminate before the exit code can be inspected.
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $api = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY"
          $existingRelease = $null
          try {
            $existingRelease = Invoke-RestMethod -Method Get -Headers $headers -Uri "$api/releases/tags/$tag"
          } catch {
            $status = [int]$_.Exception.Response.StatusCode
            if ($status -ne 404) { throw }
          }
          if ($null -ne $existingRelease) { throw "Release already exists: $tag" }

          $matchingTags = @(Invoke-RestMethod -Method Get -Headers $headers -Uri "$api/git/matching-refs/tags/$tag")
          if (@($matchingTags | Where-Object { $_.ref -eq "refs/tags/$tag" }).Count -gt 0) {
            throw "Tag already exists: $tag"
          }
          Write-Host "Validated version $version; no matching release or tag exists."
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "RELEASE_ZIP=$zipName" >> $env:GITHUB_ENV

      - name: Build and test formal Windows portable package
        shell: pwsh
        run: ./build.ps1

      - name: Scan final public release package
        shell: pwsh
        run: python "$env:GITHUB_WORKSPACE/.github/scripts/scan-public-package.py" ./dist

      - name: Generate and verify SHA-256 checksums
        shell: pwsh
        run: |
          $zip = Join-Path $PWD "dist/$env:RELEASE_ZIP"
          $exe = Join-Path $PWD 'dist/TriINVCalc/TriINVCalc.exe'
          if (-not (Test-Path $zip)) { throw "Missing release ZIP: $zip" }
          if (-not (Test-Path $exe)) { throw "Missing release EXE: $exe" }
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$zipHash  $env:RELEASE_ZIP"
            "$exeHash  TriINVCalc.exe"
          ) | Set-Content -Encoding ascii ./dist/SHA256SUMS.txt

      - name: Publish approved GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:RELEASE_VERSION
          $tag = $env:RELEASE_TAG
          $zipName = $env:RELEASE_ZIP
          $notes = @"
          ## TriINVCalc V$version

          **三聯式發票開立計算機**（Windows x64 portable）

          - 改採 AITeam CY App Icon Family 正式 CAL Icon（原生七尺寸 Windows ICO）。
          - 視覺配色依 CY Desktop Visual Guide 採中性色與柔和 Coral，發票格線低彩度、文字可讀性優先。
          - 金額計算、折扣、尾差分配及 Enter／Tab 工作流程維持不變。
          - 通過 Windows Build/Test 及公開發行檔案安全掃描。

          原始碼與完整變更紀錄請參閱本版 commit 及 V$version.txt。

          Copyright © 2026 C.C. Liu, Chihyuan Co. All Rights Reserved.
          "@
          $notesFile = Join-Path $env:RUNNER_TEMP 'TriINVCalc-release-notes.md'
          $notes | Set-Content -Encoding utf8 $notesFile
          gh release create $tag `
            "dist/$zipName#TriINVCalc V$version Portable ZIP" `
            'dist/TriINVCalc/TriINVCalc.exe#TriINVCalc.exe' `
            'dist/SHA256SUMS.txt#SHA-256 checksums' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "TriINVCalc V$version｜三聯式發票開立計算機" `
            --notes-file $notesFile `
            --latest

      - name: Remove superseded TriINVCalc V1.5.5 release after verified publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $api = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY"
          $release = Invoke-RestMethod -Method Get -Headers $headers -Uri "$api/releases/tags/$env:RELEASE_TAG"
          if ($release.draft -or $release.prerelease) { throw "New formal release is not public/stable." }
          $actualAssets = @($release.assets | ForEach-Object { $_.name })
          $requiredAssets = @($env:RELEASE_ZIP, 'TriINVCalc.exe', 'SHA256SUMS.txt')
          foreach ($name in $requiredAssets) {
            if ($name -notin $actualAssets) { throw "Missing new release asset: $name" }
          }
          $oldTag = 'TriINVCalc-v1.5.5'
          if ($env:RELEASE_TAG -eq $oldTag) { throw "Refusing to delete the active release." }
          gh release delete $oldTag --repo $env:GITHUB_REPOSITORY --yes
          if ($LASTEXITCODE -ne 0) { throw "Failed to remove previous TriINVCalc release $oldTag." }
          Write-Host "Removed only the superseded $oldTag GitHub Release; git tag and history retained."
