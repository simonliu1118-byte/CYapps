name: CYInvoice Cloud Development Deploy (Temporary)

on:
  push:
    branches:
      - cyinvoice/cloud-onboarding-first-device
    paths:
      - ".github/workflows/cyinvoice-cloud-deploy-dev-temp.yml"
      - "apps/CYInvoice/cloud/**"

permissions:
  contents: read

concurrency:
  group: cyinvoice-cloud-development-deploy
  cancel-in-progress: false

jobs:
  deploy-development:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    defaults:
      run:
        working-directory: apps/CYInvoice/cloud

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run check

      - name: Deploy existing development Worker
        run: npx wrangler deploy
