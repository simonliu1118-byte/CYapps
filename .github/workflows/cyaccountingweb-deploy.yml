name: CYAccountingWeb Cloudflare Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - cyaccountingweb/feature-initial-web
    paths:
      - "apps/CYAccountingWeb/**"
      - ".github/workflows/cyaccountingweb-deploy.yml"

permissions:
  contents: read

concurrency:
  group: cyaccountingweb-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    defaults:
      run:
        working-directory: apps/CYAccountingWeb

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript syntax
        run: |
          node --check src/index.js
          node --check public/app.js

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy Worker and static assets
        run: npx wrangler deploy
