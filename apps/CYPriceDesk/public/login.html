<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f5e73"><meta name="robots" content="noindex,nofollow">
  <title>登入 · 價格觀測室</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon-256.png">
  <style>
    /* Same layout and values as the CY Web sign-in card (chihyuan-web src/auth/auth.css); accent is the price desk petrol blue. */
    :root{--bg:#f6f6f9;--surface:#fff;--border:#e3e3ec;--border-input:#8e91a6;--text:#282a3a;--muted:#676b7e;
      --accent:#0f5e73;--accent-hover:#0b4b5c;--focus:rgba(15,94,115,.32);--danger:#b42318;--danger-soft:#fdecea;
      --radius-lg:10px;--radius-md:8px;
      font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--text)}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-size:14px;line-height:1.5}
    .screen{position:relative;min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
    .card{width:min(400px,100%);padding:32px;border:1px solid var(--border);border-radius:14px;background:var(--surface)}
    .heading{display:flex;align-items:center;gap:12px;margin-bottom:20px}
    .heading img{width:40px;height:40px;display:block}
    h1{margin:0;font-size:22px;font-weight:400}
    form{display:grid;gap:14px}
    .field{display:grid;gap:6px}
    .field label{color:var(--muted);font-size:14px}
    .req{color:var(--danger);margin-left:4px}
    input[type=text],input[type=password]{width:100%;min-height:40px;padding:6px 12px;border:1px solid var(--border-input);border-radius:var(--radius-md);background:var(--surface);color:var(--text);font:inherit;font-size:15px}
    input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}
    .options{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .check{display:inline-flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;cursor:pointer;padding-left:4px}
    .check input{width:16px;height:16px;margin:0;accent-color:var(--accent)}
    .link{border:0;padding:4px 0;background:transparent;color:var(--accent);font:inherit;font-size:14px;font-weight:500;text-decoration:none;cursor:pointer}
    .link:hover{text-decoration:underline;text-underline-offset:3px}
    .primary{width:100%;min-height:42px;padding:8px 16px;border:0;border-radius:var(--radius-md);background:var(--accent);color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
    .primary:hover{background:var(--accent-hover)}
    .error{margin:0;padding:8px 10px;border-radius:var(--radius-md);background:var(--danger-soft);color:var(--danger);font-weight:600}
    .error[hidden]{display:none}
    .error a{color:inherit}
    @media (max-width:420px){.card{padding:24px 20px;border:0;background:transparent}.screen{place-items:start center;padding-top:72px}}
  </style>
</head>
<body>
  <main class="screen">
    <section class="card" aria-labelledby="title">
      <div class="heading"><img src="/icon.svg" alt=""><h1 id="title">價格觀測室</h1></div>
      <form action="/api/auth/login" method="post" autocomplete="on" id="login-form">
        <div class="field"><label for="employeeNo">員工編號<span class="req" aria-hidden="true">*</span></label>
          <input id="employeeNo" name="employeeNo" type="text" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" autocomplete="username" required autofocus></div>
        <div class="field"><label for="password">密碼<span class="req" aria-hidden="true">*</span></label>
          <input id="password" name="password" type="password" maxlength="16" autocomplete="current-password" required></div>
        <div class="options">
          <label class="check"><input type="checkbox" id="remember">記住我</label>
          <a class="link" id="forgot" href="#" target="_blank" rel="noopener noreferrer">忘記密碼？</a>
        </div>
        <p class="error" id="message" role="alert" hidden></p>
        <button class="primary" type="submit">登入</button>
      </form>
    </section>
  </main>
  <script>
    // 「記住我」只記住員工編號，存在本機瀏覽器（同 CY Web 做法）；密碼一律不保存。
    const KEY='cypd:remembered-employee';
    const no=document.getElementById('employeeNo'),remember=document.getElementById('remember');
    try{const saved=localStorage.getItem(KEY);if(saved){no.value=saved;remember.checked=true;document.getElementById('password').focus();}}catch{}
    no.addEventListener('input',()=>{no.value=no.value.replace(/\D/g,'').slice(0,4)});
    remember.addEventListener('change',()=>{if(!remember.checked){try{localStorage.removeItem(KEY)}catch{}}});
    document.getElementById('login-form').addEventListener('submit',()=>{try{remember.checked?localStorage.setItem(KEY,no.value):localStorage.removeItem(KEY)}catch{}});
    // 忘記密碼與首次登入由 CY Web 處理（價格觀測室是 CYID non-core consumer）。
    let portal='';
    const portalReady=fetch('/api/auth/portal').then(r=>r.ok?r.json():null).then(d=>{if(d&&d.url){portal=d.url;document.getElementById('forgot').href=d.url;}}).catch(()=>{});
    document.getElementById('forgot').addEventListener('click',e=>{if(!portal){e.preventDefault();}});
    const messages={
      invalid:'請輸入 4 碼員工編號與 8 到 16 字元的密碼。',
      failed:'員工編號或密碼不正確。',
      access:'此員工帳號沒有價格觀測室的使用權限。',
      rate:'登入嘗試次數過多，請稍後再試。',
      service:'中央帳號服務目前無法使用，請稍後再試。'
    };
    const key=new URLSearchParams(location.search).get('error'),box=document.getElementById('message');
    if(key==='first-login'){
      box.textContent='請先到 CY Web 完成 Email 驗證與密碼設定。';box.hidden=false;
      portalReady.then(()=>{if(!portal)return;const a=document.createElement('a');a.href=portal;a.target='_blank';a.rel='noopener noreferrer';a.textContent='前往 CY Web';box.append(' ',a);});
    }else if(key){box.textContent=messages[key]||messages.failed;box.hidden=false;}
  </script>
</body>
</html>
