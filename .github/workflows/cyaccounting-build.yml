name: CYAccounting Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "apps/CYAccounting/**"
      - ".github/workflows/cyaccounting-build.yml"

permissions:
  contents: read

concurrency:
  group: cyaccounting-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/CYAccounting
    steps:
      - uses: actions/checkout@v7

      - name: Read VERSION
        shell: pwsh
        run: |
          $version = (Get-Content ./VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid CYAccounting VERSION: $version" }
          "CYACCOUNTING_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q app tests

      - name: Run application tests
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python tests/test_app.py
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            Write-Host "CYAccounting tests failed with exit code $testExit"
            if (Test-Path "Data/startup_trace.log") {
              Write-Host "--- Data/startup_trace.log ---"
              Get-Content "Data/startup_trace.log"
              Write-Host "--- end startup_trace.log ---"
            }
            if (Test-Path "Data/Logs") {
              Get-ChildItem "Data/Logs" -Filter "*.log" | ForEach-Object {
                Write-Host "--- $($_.FullName) ---"
                Get-Content $_.FullName
              }
            }
            exit $testExit
          }

      - name: Run safety and integration tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*_unittest.py" -v

      - uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"

      - name: Compile Windows GUI launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          go build -trimpath -ldflags="-H windowsgui" -o out/CYAccountingLauncher.exe launcher_go/main.go
          if (-not (Test-Path out/CYAccountingLauncher.exe)) { throw "launcher build failed" }

      - name: Test Windows GUI launcher lifecycle
        shell: pwsh
        run: go test ./launcher_go -v

      - name: Build reproducible source archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $output = "out/cyaccounting-v$env:CYACCOUNTING_VERSION-source.tar.gz"
          python tools/create_source_archive.py --output $output

      - name: Upload source verification archive
        uses: actions/upload-artifact@v7
        with:
          name: cyaccounting-v${{ env.CYACCOUNTING_VERSION }}-source-run${{ github.run_number }}
          path: |
            apps/CYAccounting/out/cyaccounting-v${{ env.CYACCOUNTING_VERSION }}-source.tar.gz
            apps/CYAccounting/out/cyaccounting-v${{ env.CYACCOUNTING_VERSION }}-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3
