name: CYAccounting UI Refinement Pass 5 (one-time)

on:
  push:
    branches:
      - cyaccounting/v1.2.0-visual-phase1
    paths:
      - .github/workflows/cyaccounting-ui-refinement-pass5.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cyaccounting/v1.2.0-visual-phase1
          fetch-depth: 0

      - name: Apply guarded Build 2 refinement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('apps/CYAccounting')

          def replace_exact(path: Path, old: str, new: str, expected: int = 1):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          main = root / 'app/main.py'
          text = main.read_text(encoding='utf-8')

          old_icon = '''    @staticmethod
    def _clear_secondary_dialog_icon(dialog: QDialog) -> None:
        # CY Desktop visual rule: only the main application window carries the
        # canonical family icon. Keep native dialog chrome/behavior.
        dialog.setWindowIcon(QIcon())
        if sys.platform == "win32":
            try:
                import ctypes
                hwnd = int(dialog.winId())
                user32 = ctypes.windll.user32
                wm_seticon = 0x0080
                user32.SendMessageW(hwnd, wm_seticon, 0, 0)  # ICON_SMALL
                user32.SendMessageW(hwnd, wm_seticon, 1, 0)  # ICON_BIG
            except Exception:
                pass
'''
          new_icon = '''    @staticmethod
    def _clear_secondary_dialog_icon(dialog: QDialog) -> None:
        # CY Desktop visual rule: the main window owns the product icon.
        # Secondary dialogs must have no title-bar icon at all; an empty Qt icon
        # alone lets Windows fall back to the generic application icon.
        dialog.setWindowIcon(QIcon())
        if sys.platform == "win32":
            try:
                import ctypes
                hwnd = int(dialog.winId())
                user32 = ctypes.windll.user32
                GWL_EXSTYLE = -20
                WS_EX_DLGMODALFRAME = 0x00000001
                WM_SETICON = 0x0080
                ICON_SMALL = 0
                ICON_BIG = 1
                SWP_NOSIZE = 0x0001
                SWP_NOMOVE = 0x0002
                SWP_NOZORDER = 0x0004
                SWP_NOACTIVATE = 0x0010
                SWP_FRAMECHANGED = 0x0020

                ex_style = user32.GetWindowLongW(hwnd, GWL_EXSTYLE)
                user32.SetWindowLongW(hwnd, GWL_EXSTYLE, ex_style | WS_EX_DLGMODALFRAME)
                user32.SendMessageW(hwnd, WM_SETICON, ICON_SMALL, 0)
                user32.SendMessageW(hwnd, WM_SETICON, ICON_BIG, 0)
                user32.SetWindowPos(
                    hwnd,
                    0,
                    0,
                    0,
                    0,
                    0,
                    SWP_NOSIZE | SWP_NOMOVE | SWP_NOZORDER | SWP_NOACTIVATE | SWP_FRAMECHANGED,
                )
            except Exception:
                pass
'''
          if text.count(old_icon) != 1:
              raise SystemExit(f'main.py icon helper: expected 1 occurrence, found {text.count(old_icon)}')
          text = text.replace(old_icon, new_icon, 1)
          for old, new, label in [
              ('        outer.setContentsMargins(12, 6, 12, 8)\n', '        outer.setContentsMargins(12, 8, 12, 8)\n', 'input top margin'),
              ('        confirm.setFixedHeight(244)\n', '        confirm.setFixedHeight(224)\n', 'confirmation height'),
              ('        self.setMinimumSize(1120, 760)\n        self.resize(1120, 760)\n', '        self.setMinimumSize(1120, 740)\n        self.resize(1120, 740)\n', 'main window size'),
          ]:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'main.py {label}: expected 1 occurrence, found {count}')
              text = text.replace(old, new, 1)
          main.write_text(text, encoding='utf-8')

          theme = root / 'app/theme.py'
          text = theme.read_text(encoding='utf-8')
          old_titles = '''QGroupBox#confirmationCard::title, QGroupBox#inputSection::title, QGroupBox#incomeSection::title, QGroupBox#expenseSection::title {{
    subcontrol-origin: margin;
    subcontrol-position: top left;
    left: 10px;
    padding: 0 5px;
    background: {NEUTRAL_WHITE};
    color: {TEXT_PRIMARY};
    font-size: 11.5pt;
    font-weight: 600;
}}
'''
          new_titles = '''QGroupBox#confirmationCard::title, QGroupBox#inputSection::title, QGroupBox#incomeSection::title, QGroupBox#expenseSection::title {{
    subcontrol-origin: margin;
    subcontrol-position: top left;
    left: 10px;
    padding: 0 2px;
    background: {NEUTRAL_WHITE};
    color: {TEXT_PRIMARY};
    font-size: 11.5pt;
    font-weight: 600;
}}
QDialog#settingsDialog QGroupBox {{
    border: 1px solid {NEUTRAL_BORDER};
    border-radius: 6px;
    margin-top: 10px;
    padding: 0;
    background: {NEUTRAL_WHITE};
    font-weight: normal;
}}
QDialog#settingsDialog QGroupBox::title {{
    subcontrol-origin: margin;
    subcontrol-position: top left;
    left: 10px;
    padding: 0 2px;
    background: {NEUTRAL_WHITE};
    color: {TEXT_PRIMARY};
    font-size: 11.5pt;
    font-weight: 600;
}}
'''
          count = text.count(old_titles)
          if count != 1:
              raise SystemExit(f'theme.py standard GroupBox legend block: expected 1 occurrence, found {count}')
          text = text.replace(old_titles, new_titles, 1)
          theme.write_text(text, encoding='utf-8')

          dialogs = root / 'app/dialogs.py'
          text = dialogs.read_text(encoding='utf-8')
          settings_header_old = '''        self.setModal(True)
        self.resize(760, 700)
        outer = QVBoxLayout(self)
        outer.setContentsMargins(16, 12, 16, 12)
        outer.setSpacing(10)
'''
          settings_header_new = '''        self.setModal(True)
        self.resize(760, 660)
        outer = QVBoxLayout(self)
        outer.setContentsMargins(12, 8, 12, 8)
        outer.setSpacing(6)
'''
          if text.count(settings_header_old) != 1:
              raise SystemExit(f'dialogs.py settings header: expected 1 occurrence, found {text.count(settings_header_old)}')
          text = text.replace(settings_header_old, settings_header_new, 1)

          db_old = '        db_layout = QGridLayout(db_box)\n'
          db_new = '''        db_layout = QGridLayout(db_box)
        db_layout.setContentsMargins(12, 8, 12, 8)
        db_layout.setHorizontalSpacing(8)
        db_layout.setVerticalSpacing(6)
'''
          if text.count(db_old) != 1:
              raise SystemExit(f'dialogs.py db layout: expected 1 occurrence, found {text.count(db_old)}')
          text = text.replace(db_old, db_new, 1)

          for old, new, label in [
              ('        lock_layout.setContentsMargins(12, 10, 12, 10)\n', '        lock_layout.setContentsMargins(12, 7, 12, 7)\n', 'lock margins'),
              ('        backup_layout.setContentsMargins(12, 10, 12, 10)\n        backup_layout.setSpacing(16)\n', '        backup_layout.setContentsMargins(12, 8, 12, 8)\n        backup_layout.setSpacing(8)\n', 'backup spacing'),
              ('        info_layout = QGridLayout(info_box)\n', '        info_layout = QGridLayout(info_box)\n        info_layout.setContentsMargins(12, 8, 12, 8)\n        info_layout.setHorizontalSpacing(8)\n        info_layout.setVerticalSpacing(4)\n', 'info layout'),
              ('        outer.addWidget(info_box)\n        outer.addStretch()\n', '        outer.addWidget(info_box)\n        outer.addSpacing(2)\n', 'settings bottom stretch'),
          ]:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'dialogs.py {label}: expected 1 occurrence, found {count}')
              text = text.replace(old, new, 1)
          dialogs.write_text(text, encoding='utf-8')

          build = root / 'BUILD'
          if build.read_text(encoding='utf-8').strip() != '1':
              raise SystemExit('BUILD must be 1 before Build 2 refinement')
          build.write_text('2\n', encoding='utf-8')

          notes = root / 'V1.2.0.txt'
          text = notes.read_text(encoding='utf-8')
          if 'Build: 1\n' not in text:
              raise SystemExit('V1.2.0 notes are not at Build 1')
          text = text.replace('Build: 1\n', 'Build: 2\n', 1)
          text = text.replace(
              'MainWindow minimum size and initial size are both 1120x760',
              'MainWindow minimum size and initial size are both 1120x740',
              1,
          )
          text = text.replace(
              'Secondary dialogs / management / settings windows suppress the app icon while native MessageBox and native QFileDialog keep OS-native shell behavior.',
              'Secondary dialogs / management / settings windows show no title-bar icon at all (including no Windows generic fallback icon), while native MessageBox and native QFileDialog keep OS-native shell behavior.',
              1,
          )
          marker = '- Settings and Import dialogs receive canonical spacing/density treatment while preserving their existing behavior and workflow.\n'
          replacement = '- Settings uses compact framed GroupBox sections for database location, lock, ledger, common summary, backup/restore, Google Drive and program information; excess inter-section whitespace is removed while behavior is unchanged. Import keeps its existing canonical spacing/density treatment.\n'
          if marker not in text:
              raise SystemExit('V1.2.0 settings note marker missing')
          text = text.replace(marker, replacement, 1)
          notes.write_text(text, encoding='utf-8')
          PY

      - name: Validate transformed source
        shell: bash
        run: |
          python -m compileall -q apps/CYAccounting/app apps/CYAccounting/tests
          test "$(cat apps/CYAccounting/BUILD | tr -d '\r\n')" = "2"
          grep -q 'self.setMinimumSize(1120, 740)' apps/CYAccounting/app/main.py
          grep -q 'WS_EX_DLGMODALFRAME' apps/CYAccounting/app/main.py
          grep -q 'QDialog#settingsDialog QGroupBox' apps/CYAccounting/app/theme.py

      - name: Commit final Build 2 source only
        shell: bash
        run: |
          rm .github/workflows/cyaccounting-ui-refinement-pass5.yml
          git config user.name "simonliu1118-byte"
          git config user.email "286269326+simonliu1118-byte@users.noreply.github.com"
          git add apps/CYAccounting/app/main.py apps/CYAccounting/app/theme.py apps/CYAccounting/app/dialogs.py apps/CYAccounting/BUILD apps/CYAccounting/V1.2.0.txt .github/workflows/cyaccounting-ui-refinement-pass5.yml
          git diff --cached --check
          git commit -m "ui(CYAccounting): refine Build 2 dialogs and compact layout"
          git push origin HEAD:cyaccounting/v1.2.0-visual-phase1
