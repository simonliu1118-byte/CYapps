name: CYERPAutoQuery Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "apps/CYERPAutoQuery/**"
      - ".github/workflows/cyerp-auto-query-build.yml"
      - ".github/scripts/scan-public-package.py"

permissions:
  contents: read

concurrency:
  group: cyerp-auto-query-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/CYERPAutoQuery
    steps:
      - uses: actions/checkout@v7

      - name: Read VERSION and BUILD
        shell: pwsh
        run: |
          $version = (Get-Content ./VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid CYERPAutoQuery VERSION: $version" }
          $build = (Get-Content ./BUILD -Raw).Trim()
          if ($build -notmatch '^\d+$') { throw "Invalid CYERPAutoQuery BUILD: $build" }
          $suffix = ""
          if ([int]$build -gt 0) { $suffix = "-build$build" }
          "CYERPAUTOQUERY_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CYERPAUTOQUERY_ARTIFACT_SUFFIX=$suffix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Fetch canonical CYERPAutoQuery icon
        shell: pwsh
        run: ./tools/fetch-canonical-icon.ps1

      - name: Fetch pinned PaddleOCR models
        shell: pwsh
        run: ./tools/fetch-ocr-models.ps1

      - name: Unit tests
        shell: pwsh
        run: dotnet test tests/CYERPAutoQuery.Tests/CYERPAutoQuery.Tests.csproj -c Release

      - name: Restore
        shell: pwsh
        run: dotnet restore CYERPAutoQuery.csproj -r win-x64

      - name: Build
        shell: pwsh
        run: dotnet build CYERPAutoQuery.csproj -c Release -r win-x64 --no-restore -p:Version=$env:CYERPAUTOQUERY_VERSION -p:ContinuousIntegrationBuild=true

      - name: Publish Windows x64 portable package
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force package,publish-staging -ErrorAction SilentlyContinue
          $staging = "publish-staging"
          $outDir = Join-Path "package" "CYERPAutoQuery"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          dotnet publish CYERPAutoQuery.csproj -c Release -r win-x64 --no-restore --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -p:Version=$env:CYERPAUTOQUERY_VERSION -o $staging
          if (-not (Test-Path "$staging/CYERPAutoQuery.exe")) { throw "CYERPAutoQuery.exe was not produced" }

          Copy-Item "$staging/CYERPAutoQuery.exe" "$outDir/CYERPAutoQuery.exe"
          Copy-Item VERSION "$outDir/VERSION"
          Copy-Item BUILD "$outDir/BUILD"
          Copy-Item README.md "$outDir/README.md"
          Copy-Item THIRD_PARTY_NOTICES.md "$outDir/THIRD_PARTY_NOTICES.md"

          New-Item -ItemType Directory -Path "$outDir/runtime/ocr" -Force | Out-Null
          Copy-Item "$staging/runtime/ocr/*.onnx" "$outDir/runtime/ocr/"

      - name: Verify packaged executable and structure
        shell: pwsh
        run: |
          $root = "package/CYERPAutoQuery"
          $required = @(
            "$root/CYERPAutoQuery.exe",
            "$root/BUILD",
            "$root/VERSION",
            "$root/README.md",
            "$root/THIRD_PARTY_NOTICES.md",
            "$root/runtime/ocr/ch_PP-OCRv5_det_mobile.onnx",
            "$root/runtime/ocr/ch_PP-OCRv5_rec_mobile.onnx",
            "$root/runtime/ocr/ch_PP-LCNet_x0_25_textline_ori_cls_mobile.onnx"
          )
          foreach ($path in $required) {
            if (!(Test-Path $path)) { throw "Missing packaged file: $path" }
          }

          $unexpected = @(Get-ChildItem -LiteralPath $root -Recurse -File | Where-Object { $_.Extension -in @('.pdb','.lib','.dll') -or $_.Name -match 'SHA256' })
          if ($unexpected.Count -gt 0) {
            throw "Unexpected engineering files in user package: $($unexpected.FullName -join ', ')"
          }

          $roots = @(Get-ChildItem -LiteralPath package -Force)
          if ($roots.Count -ne 1 -or $roots[0].Name -ne "CYERPAutoQuery" -or -not $roots[0].PSIsContainer) {
            throw "Download artifact must contain only the CYERPAutoQuery/ folder"
          }

      - name: Scan engineering package for secrets and production bindings
        shell: pwsh
        run: python "$env:GITHUB_WORKSPACE/.github/scripts/scan-public-package.py" ./package

      - name: Upload engineering package
        uses: actions/upload-artifact@v7
        with:
          name: CYERPAutoQuery-v${{ env.CYERPAUTOQUERY_VERSION }}${{ env.CYERPAUTOQUERY_ARTIFACT_SUFFIX }}-windows-x64-run${{ github.run_number }}
          path: apps/CYERPAutoQuery/package/*
          if-no-files-found: error
          retention-days: 3
