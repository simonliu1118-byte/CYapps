name: CYAccountingWeb V0.9.1 Patch (Temporary)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cyaccountingweb-v091-patch-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Patch V0.9.1 sidebar polish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          index = Path('apps/CYAccountingWeb/public/index.html')
          text = index.read_text(encoding='utf-8')
          if '/v091.css' not in text:
              text = text.replace('  <link rel="stylesheet" href="/v09.css">\n', '  <link rel="stylesheet" href="/v09.css">\n  <link rel="stylesheet" href="/v091.css">\n', 1)
          text = text.replace('V0.9.0</span>', 'V0.9.1</span>', 1)
          if '/v091.js' not in text:
              text = text.replace('  <script src="/v09.js" defer></script>\n', '  <script src="/v09.js" defer></script>\n  <script src="/v091.js" defer></script>\n', 1)
          index.write_text(text, encoding='utf-8')

          Path('apps/CYAccountingWeb/VERSION').write_text('0.9.1\n', encoding='utf-8')
          PY

          node --check apps/CYAccountingWeb/public/v091.js
          grep -q 'V0.9.1' apps/CYAccountingWeb/public/index.html
          grep -q '/v091.css' apps/CYAccountingWeb/public/index.html
          grep -q '/v091.js' apps/CYAccountingWeb/public/index.html

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/CYAccountingWeb/public/index.html apps/CYAccountingWeb/VERSION
          git commit -m 'fix(CYAccountingWeb): polish confirmation sidebar controls'
          git push origin HEAD:main
