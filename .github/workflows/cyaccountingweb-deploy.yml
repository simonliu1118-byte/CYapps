name: CYAccountingWeb Validate and Deploy

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "apps/CYAccountingWeb/**"
      - ".github/workflows/cyaccountingweb-deploy.yml"
  push:
    branches:
      - main
    paths:
      - "apps/CYAccountingWeb/**"
      - ".github/workflows/cyaccountingweb-deploy.yml"

permissions:
  contents: read

concurrency:
  group: cyaccountingweb-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/CYAccountingWeb

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/CYAccountingWeb/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate JavaScript syntax
        run: |
          node --check src/index.js
          node --check src/app.js
          node --check src/app-v17.js
          node --check src/app-v18.js
          node --check src/backup-storage-provider.js
          node --check src/gcs-backup-provider.js
          node --check src/r2-backup-provider.js
          node --check src/v11-tools.js
          node --check src/v12-tools.js
          node --check src/v13-export.js
          node --check src/v15-import.js
          node --check src/v16-backup.js
          node --check src/v17-backup.js
          node --check src/v18-backup.js
          node --check scripts/render-wrangler.mjs
          node --check public/auth.js
          node --check public/app.js
          node --check public/v03.js
          node --check public/v06.js
          node --check public/v07.js
          node --check public/v08.js
          node --check public/v09.js
          node --check public/v091.js
          node --check public/v011.js
          node --check public/v012.js
          node --check public/v013.js
          node --check public/v014.js
          node --check public/v015.js
          node --check public/v016.js

      - name: Run application tests
        run: |
          node tests/v15-import.mjs
          node tests/v16-backup.mjs
          node tests/v17-backup.mjs
          node tests/v17-phase-b.mjs
          node tests/v18-tiered-backup.mjs
          node tests/v18-backup-ui.mjs
          node tests/deploy-config.mjs

      - name: Render CI-only Cloudflare config
        env:
          CF_WORKER_NAME: cyaccounting-web-ci
          CF_D1_DATABASE_NAME: cyaccounting-web-ci-db
          CF_D1_DATABASE_ID: 11111111-1111-4111-8111-111111111111
          CF_IDENTITY_SERVICE: cyidentity-ci-placeholder
          CF_R2_BACKUP_BUCKET: cyaccounting-backup-ci
          CF_BACKUP_TOPOLOGY: legacy_gcs
        run: node scripts/render-wrangler.mjs --output wrangler.ci.generated.jsonc

      - name: Validate D1 migrations locally
        run: npx wrangler d1 migrations apply DB --local --persist-to /tmp/cyaccounting-ci-d1 --config wrangler.ci.generated.jsonc

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.ci.generated.jsonc

      - name: Remove CI-only Cloudflare config
        if: always()
        run: rm -f wrangler.ci.generated.jsonc

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    defaults:
      run:
        working-directory: apps/CYAccountingWeb

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
      CF_D1_DATABASE_NAME: ${{ vars.CF_D1_DATABASE_NAME }}
      CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
      CF_IDENTITY_SERVICE: ${{ vars.CF_IDENTITY_SERVICE }}
      CF_R2_BACKUP_BUCKET: ${{ vars.CF_R2_BACKUP_BUCKET }}
      CF_BACKUP_TOPOLOGY: ${{ vars.CF_BACKUP_TOPOLOGY }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/CYAccountingWeb/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Render production Cloudflare config
        run: node scripts/render-wrangler.mjs --output wrangler.deploy.jsonc

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.deploy.jsonc

      - name: Deploy Worker and static assets
        run: npx wrangler deploy --config wrangler.deploy.jsonc

      - name: Remove production Cloudflare config
        if: always()
        run: rm -f wrangler.deploy.jsonc
