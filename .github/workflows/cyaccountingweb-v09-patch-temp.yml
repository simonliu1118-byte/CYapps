name: CYAccountingWeb V0.9 Patch (Temporary)

on:
  push:
    branches:
      - cyaccountingweb/v0.9-desktop-ux
    paths:
      - '.github/workflows/cyaccountingweb-v09-patch-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cyaccountingweb/v0.9-desktop-ux
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Finalize V0.9 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('apps/CYAccountingWeb')

          app = root / 'public/app.js'
          text = app.read_text(encoding='utf-8')
          needle = "async function loadOpeningBalances() {\n  const month = els.openingMonth.value;\n  if (!month) return;\n"
          replacement = needle + "  setDialogMessage(els.openingMessage, '');\n"
          if replacement not in text:
              if needle not in text:
                  raise SystemExit('loadOpeningBalances marker not found')
              text = text.replace(needle, replacement, 1)
          app.write_text(text, encoding='utf-8')

          css = root / 'public/v09.css'
          text = css.read_text(encoding='utf-8')
          addition = '''\n#monthSummary {\n  display: flex;\n  align-items: center;\n  flex-wrap: wrap;\n  gap: 4px 12px;\n}\n\n.ledger-summary-item {\n  color: #61707d;\n  white-space: nowrap;\n}\n\n.ledger-summary-item strong {\n  color: #2d3944;\n  font-weight: 600;\n  font-variant-numeric: tabular-nums;\n}\n\n.ledger-summary-item.income strong {\n  color: #2d7142;\n}\n\n.ledger-summary-item.expense strong {\n  color: #98443c;\n}\n\n.ledger-summary-item.ending {\n  padding-left: 10px;\n  border-left: 1px solid #d7dee5;\n}\n\n.ledger-summary-search {\n  color: #2f6489;\n  white-space: nowrap;\n}\n\n.opening-dialog-heading {\n  margin-top: 16px;\n  align-items: end;\n}\n\n.opening-dialog-heading .hint {\n  margin-bottom: 0;\n}\n\n@media (max-width: 720px) {\n  .settings-nav {\n    grid-template-columns: repeat(3, 1fr);\n  }\n}\n'''
          if '.ledger-summary-item {' not in text:
              text += addition
          css.write_text(text, encoding='utf-8')
          PY

          node --check apps/CYAccountingWeb/public/app.js
          node --check apps/CYAccountingWeb/public/v09.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/CYAccountingWeb/public/app.js apps/CYAccountingWeb/public/v09.css
          git commit -m 'fix(CYAccountingWeb): finalize V0.9 desktop UX details'
          git push origin HEAD:cyaccountingweb/v0.9-desktop-ux
