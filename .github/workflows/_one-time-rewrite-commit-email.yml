name: One-time verify public commit email

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_one-time-rewrite-commit-email.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch public branches, tags and pull request refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          while read -r sha ref; do
            case "$ref" in
              refs/pull/*/head)
                n="${ref#refs/pull/}"; n="${n%/head}"
                git fetch --force origin "$ref:refs/remotes/pull/$n" || true
                ;;
            esac
          done < <(git ls-remote origin 'refs/pull/*/head')

      - name: Verify no public ref exposes a non-noreply commit email
        shell: bash
        run: |
          set -euo pipefail
          refs=()
          while read -r ref; do refs+=("$ref"); done < <(git for-each-ref --format='%(refname)' refs/remotes/origin refs/remotes/pull refs/tags)
          bad=0
          if [ "${#refs[@]}" -gt 0 ]; then
            while read -r email; do
              case "$email" in
                *@users.noreply.github.com|noreply@github.com|"") ;;
                *)
                  domain="${email##*@}"
                  echo "Non-private commit email remains on a public ref (domain=$domain)"
                  bad=1
                  ;;
              esac
            done < <(git log "${refs[@]}" --format='%ae%n%ce' | sort -u)
          fi
          exit "$bad"
