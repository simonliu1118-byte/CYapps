name: CYAccountingWeb One-time GitHub Cleanup

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cyaccountingweb-maintenance-cleanup.yml'
      - '.github/scripts/cyacc-github-cleanup.py'
      - '.github/cyacc-cleanup-manifest.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cyaccountingweb-maintenance-cleanup.yml'

permissions:
  contents: read

concurrency:
  group: cyacc-github-maintenance-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Read-only cleanup inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/cyacc-github-cleanup.py plan

  cleanup:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Apply reviewed CYACCweb cleanup and verify remaining objects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/cyacc-github-cleanup.py apply
