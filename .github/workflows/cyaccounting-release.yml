name: CYAccounting Private Release

on:
  push:
    branches:
      - "cyaccounting-release/**"

permissions:
  contents: write

concurrency:
  group: cyaccounting-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-windows-x64:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: apps/CYAccounting

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Validate release branch and version
        shell: pwsh
        run: |
          $version = (python -c "import sys; sys.path.insert(0, 'app'); import util; print(util.APP_VERSION.removeprefix('V'))").Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "A formal release requires a stable version; got $version"
          }
          $expectedBranch = "cyaccounting-release/v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedBranch) {
            throw "Release branch $env:GITHUB_REF_NAME does not match $expectedBranch"
          }
          if (!(Test-Path "V$version.txt" -PathType Leaf)) {
            throw "Version marker V$version.txt is missing"
          }
          "CYACCOUNTING_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CYACCOUNTING_TAG=cyaccounting-v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile and test Python sources
        shell: pwsh
        run: |
          python -m compileall -q app tests tools
          $env:QT_QPA_PLATFORM = "offscreen"
          python tests/test_app.py
          python -m unittest discover -s tests -p "test_*_unittest.py" -v

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Test Windows launcher
        shell: pwsh
        run: go test ./launcher_go -v

      - name: Build and verify Windows portable release
        shell: pwsh
        run: |
          ./tools/build_portable.ps1 -Version $env:CYACCOUNTING_VERSION
          ./tools/verify_portable.ps1 `
            -Package ("./dist/CYAccounting_V{0}_Windows.zip" -f $env:CYACCOUNTING_VERSION) `
            -Version $env:CYACCOUNTING_VERSION

      - name: Create release notes
        shell: pwsh
        run: |
          $zipName = "CYAccounting_V$env:CYACCOUNTING_VERSION`_Windows.zip"
          @"
          志遠記帳系統 V$env:CYACCOUNTING_VERSION

          Windows 10/11 x64 可攜版。

          - 下載 $zipName 後解壓縮。
          - 開啟 CYAccounting 資料夾，執行 CYAccounting.exe。
          - 不需要安裝 Python 或其他程式。
          - 更新舊版本時，請先保留原本的 Data 資料夾；不要直接刪除帳本資料。
          - 發行包已在全新 Windows 暫存資料夾完成啟動測試，並附 SHA-256 核對檔。
          "@ | Set-Content -Path ./dist/release-notes.md -Encoding utf8

      - name: Publish private GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:CYACCOUNTING_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $env:CYACCOUNTING_TAG already exists; refusing to overwrite it"
          }
          gh release create $env:CYACCOUNTING_TAG `
            ("./dist/CYAccounting_V{0}_Windows.zip" -f $env:CYACCOUNTING_VERSION) `
            ("./dist/CYAccounting_V{0}_Windows.zip.sha256" -f $env:CYACCOUNTING_VERSION) `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "CYAccounting V$env:CYACCOUNTING_VERSION" `
            --notes-file ./dist/release-notes.md `
            --latest=false
