          verify_asset "$base/ledger-tools.js?rev=pending-create-rows" 'function syncLedgerMonthDisplay'
          verify_asset "$base/adaptive-ui.css?rev=desktop-independent-scroll" 'Tablet landscape picker convergence: reuse the same touch controls as phone'
          verify_asset "$base/adaptive-ui.css?rev=desktop-independent-scroll" '.cy-mobile-main-nav'
