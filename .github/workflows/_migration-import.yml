name: One-time CYapps migration import

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_migration-import.yml"

permissions:
  contents: write

jobs:
  import-public-source:
    runs-on: ubuntu-latest
    env:
      MIGRATION_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-59f8-8206-9730-14d8e3ebf05d/raw?se=2026-09-12T14%3A08%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=39ffeb1b-6e56-569e-a9bd-51a554b28b05&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-12T12%3A46%3A02Z&ske=2026-09-13T12%3A46%3A02Z&sks=b&skv=2026-02-06&sig=iPBjzIueTajINqMi0A9es7DaoJi2ejKMRbo%2Bk1qFAgA%3D"
    steps:
      - name: Checkout clean public repository
        uses: actions/checkout@v4

      - name: Download and verify migration package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$MIGRATION_URL" -o /tmp/migration.zip
          rm -rf /tmp/migration-artifact /tmp/migration-source
          mkdir -p /tmp/migration-artifact /tmp/migration-source
          unzip -q /tmp/migration.zip -d /tmp/migration-artifact
          cd /tmp/migration-artifact
          sha256sum -c CYapps-public-source.tar.gz.sha256
          tar -xzf CYapps-public-source.tar.gz -C /tmp/migration-source
          cd /tmp/migration-source
          sha256sum -c /tmp/migration-artifact/SHA256SUMS.txt

      - name: Import three public applications
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/CYAccounting apps/CYEnvelope apps/CYInvoice
          mkdir -p apps .github/workflows
          cp -a /tmp/migration-source/apps/CYAccounting apps/
          cp -a /tmp/migration-source/apps/CYEnvelope apps/
          cp -a /tmp/migration-source/apps/CYInvoice apps/
          cp /tmp/migration-source/.github/workflows/cyaccounting-build.yml .github/workflows/
          cp /tmp/migration-source/.github/workflows/cyenvelope-build.yml .github/workflows/
          cp /tmp/migration-source/.github/workflows/cyinvoice-build.yml .github/workflows/

      - name: Convert build workflows to manual-only execution
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            .github/workflows/cyaccounting-build.yml \
            .github/workflows/cyenvelope-build.yml \
            .github/workflows/cyinvoice-build.yml
          do
            name="$(sed -n 's/^name: //p' "$f" | head -1)"
            tmp="${f}.tmp"
            {
              printf 'name: %s\n\n' "$name"
              printf 'on:\n  workflow_dispatch:\n\n'
              awk 'keep || /^permissions:/{keep=1; print}' "$f"
            } > "$tmp"
            mv "$tmp" "$f"
          done

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps
          git add .github/workflows/cyaccounting-build.yml
          git add .github/workflows/cyenvelope-build.yml
          git add .github/workflows/cyinvoice-build.yml
          git status --short
          git commit -m "chore: import public CY applications source"
          git push origin HEAD:main
