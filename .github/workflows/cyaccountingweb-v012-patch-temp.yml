name: CYAccountingWeb V0.12 Patch (Temporary)

on:
  push:
    branches:
      - cyaccountingweb/v0.12-settings-workflow
    paths:
      - '.github/workflows/cyaccountingweb-v012-patch-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cyaccountingweb/v0.12-settings-workflow
          fetch-depth: 0
      - name: Wire V0.12 modules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app = Path('apps/CYAccountingWeb/src/app.js')
          text = app.read_text(encoding='utf-8')
          import_line = "import { handleV12Api } from './v12-tools.js';\n"
          if import_line not in text:
              text = text.replace("import { handleV11Api } from './v11-tools.js';\n", "import { handleV11Api } from './v11-tools.js';\n" + import_line, 1)
          old = "      const v11Response = await handleV11Api(request, env);\n      if (v11Response) return v11Response;\n\n      return coreWorker.fetch(request, env);"
          new = "      const v12Response = await handleV12Api(request, env);\n      if (v12Response) return v12Response;\n\n      const v11Response = await handleV11Api(request, env);\n      if (v11Response) return v11Response;\n\n      return coreWorker.fetch(request, env);"
          if old not in text:
              raise SystemExit('app.js V0.11 routing anchor not found')
          app.write_text(text.replace(old, new, 1), encoding='utf-8')

          index = Path('apps/CYAccountingWeb/public/index.html')
          text = index.read_text(encoding='utf-8')
          if '/v012.css' not in text:
              text = text.replace('  <link rel="stylesheet" href="/v011.css">\n', '  <link rel="stylesheet" href="/v011.css">\n  <link rel="stylesheet" href="/v012.css">\n', 1)
          text = text.replace('V0.11.0</span>', 'V0.12.0</span>', 1)
          if '/v012.js' not in text:
              text = text.replace('  <script src="/v011.js" defer></script>\n', '  <script src="/v011.js" defer></script>\n  <script src="/v012.js" defer></script>\n', 1)
          index.write_text(text, encoding='utf-8')

          Path('apps/CYAccountingWeb/VERSION').write_text('0.12.0\n', encoding='utf-8')

          todo = Path('apps/CYAccountingWeb/TODO.md')
          text = todo.read_text(encoding='utf-8')
          text = text.replace('- [ ] 切換到資料表時定位「最新的一筆／最舊的一筆」設定。\n', '')
          text = text.replace('- [ ] 科目跨大分類移動。', '- [x] 科目跨大分類移動（V0.12.0；限同一收支類型）。')
          text = text.replace('- [ ] 逐月鎖帳操作流程；設定頁仍保留管理者直接向前／向後調整鎖帳月份。', '- [x] 逐月鎖帳操作流程（V0.12.0）；設定頁仍保留管理者直接指定鎖帳月份的繞過流程。')
          todo.write_text(text, encoding='utf-8')
          PY

          node --check apps/CYAccountingWeb/src/app.js
          node --check apps/CYAccountingWeb/src/v12-tools.js
          node --check apps/CYAccountingWeb/public/v012.js
          grep -q 'V0.12.0' apps/CYAccountingWeb/public/index.html
          grep -q '/v012.css' apps/CYAccountingWeb/public/index.html
          grep -q '/v012.js' apps/CYAccountingWeb/public/index.html

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/CYAccountingWeb/src/app.js \
                  apps/CYAccountingWeb/public/index.html \
                  apps/CYAccountingWeb/VERSION \
                  apps/CYAccountingWeb/TODO.md
          git commit -m 'feat(CYAccountingWeb): wire V0.12 settings workflows'
          git push origin HEAD:cyaccountingweb/v0.12-settings-workflow
