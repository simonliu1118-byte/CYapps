name: CYCloud Identity Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/CYCloudIdentity/**'
      - '.github/workflows/cycloudidentity-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cycloudidentity-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate D1 identity foundation
        run: python3 apps/CYCloudIdentity/scripts/validate_schema.py

      - name: Validate bootstrap and email budget migrations
        run: python3 apps/CYCloudIdentity/scripts/validate_bootstrap_schema.py

      - name: Validate configurable security policy migration
        run: python3 apps/CYCloudIdentity/scripts/validate_security_policy.py

      - name: Validate application role mapping migration
        run: python3 apps/CYCloudIdentity/scripts/validate_application_role_mapping.py

      - name: Scan CYCloud Identity public source
        run: python3 .github/scripts/scan-public-package.py apps/CYCloudIdentity

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install CYCloud Identity development dependencies
        working-directory: apps/CYCloudIdentity
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Type-check CYCloud Identity Worker
        working-directory: apps/CYCloudIdentity
        run: npm run check

      - name: Run CYCloud Identity auth-core tests
        working-directory: apps/CYCloudIdentity
        run: npm test

      - name: Render CI-only Cloudflare config
        working-directory: apps/CYCloudIdentity
        env:
          CYID_WORKER_NAME: cycloud-identity-ci
          CYID_D1_DATABASE_NAME: cycloud_identity_ci
          CYID_D1_DATABASE_ID: 11111111-1111-4111-8111-111111111111
          CYID_LOGIN_RATE_LIMIT_NAMESPACE_ID: "900101"
          CYID_SESSION_TTL_SECONDS: "3600"
          CYID_EMAIL_PROVIDER: brevo
          CYID_EMAIL_FROM: Identity Test <identity@example.test>
          CYID_EMAIL_DAILY_BUDGET: "50"
          CYID_CORE_ACCOUNT_APPLICATION_ID: APP_TEST_LOGIN
          CYID_ACCOUNT_PORTAL_URL: https://portal.example.test/
        run: node scripts/render-deploy-config.mjs --output wrangler.ci.generated.jsonc

      - name: Validate migrations locally
        working-directory: apps/CYCloudIdentity
        run: npx wrangler d1 migrations apply DB --local --persist-to /tmp/cycloudidentity-ci-d1 --config wrangler.ci.generated.jsonc

      - name: Validate Worker bundle
        working-directory: apps/CYCloudIdentity
        run: npx wrangler deploy --dry-run --config wrangler.ci.generated.jsonc

      - name: Remove generated config
        if: always()
        working-directory: apps/CYCloudIdentity
        run: rm -f wrangler.ci.generated.jsonc

      - name: Accept CYCloud Identity local D1 login roundtrip
        run: bash apps/CYCloudIdentity/scripts/accept_auth_local.sh

      - name: Accept CYCloud Identity first-login password roundtrip
        run: bash apps/CYCloudIdentity/scripts/accept_first_login_local.sh
