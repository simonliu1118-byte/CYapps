name: One-time identify public commit email refs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_one-time-rewrite-commit-email.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch public branches, tags and pull request refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          while read -r sha ref; do
            case "$ref" in
              refs/pull/*/head)
                n="${ref#refs/pull/}"; n="${n%/head}"
                git fetch --force origin "$ref:refs/remotes/pull/$n" || true
                ;;
            esac
          done < <(git ls-remote origin 'refs/pull/*/head')

      - name: Identify refs that still expose a non-noreply email
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while read -r ref; do
            has_bad=0
            while read -r email; do
              case "$email" in
                *@users.noreply.github.com|noreply@github.com|"") ;;
                *) has_bad=1 ;;
              esac
            done < <(git log "$ref" --format='%ae%n%ce' | sort -u)
            if [ "$has_bad" -ne 0 ]; then
              echo "REF_WITH_NON_PRIVATE_EMAIL=$ref"
              bad=1
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin refs/remotes/pull refs/tags)
          exit "$bad"
