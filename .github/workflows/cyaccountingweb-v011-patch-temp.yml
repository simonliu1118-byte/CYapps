name: CYAccountingWeb V0.11 Patch (Temporary)

on:
  push:
    branches:
      - cyaccountingweb/v0.11-desktop-efficiency
    paths:
      - '.github/workflows/cyaccountingweb-v011-patch-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cyaccountingweb/v0.11-desktop-efficiency
          fetch-depth: 0
      - name: Wire V0.11 modules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app = Path('apps/CYAccountingWeb/src/app.js')
          text = app.read_text(encoding='utf-8')
          import_line = "import { handleV11Api } from './v11-tools.js';\n"
          if import_line not in text:
              text = text.replace("import coreWorker from './index.js';\n", "import coreWorker from './index.js';\n" + import_line, 1)
          old = "      const session = await sessionFromRequest(request, env.DB);\n      if (!session) return json({ ok: false, error: '尚未登入。', code: 'AUTH_REQUIRED' }, 401);\n\n      return coreWorker.fetch(request, env);"
          new = "      const session = await sessionFromRequest(request, env.DB);\n      if (!session) return json({ ok: false, error: '尚未登入。', code: 'AUTH_REQUIRED' }, 401);\n\n      const v11Response = await handleV11Api(request, env);\n      if (v11Response) return v11Response;\n\n      return coreWorker.fetch(request, env);"
          if old not in text:
              raise SystemExit('app.js auth routing anchor not found')
          app.write_text(text.replace(old, new, 1), encoding='utf-8')

          index = Path('apps/CYAccountingWeb/public/index.html')
          text = index.read_text(encoding='utf-8')
          if '/v011.css' not in text:
              text = text.replace('  <link rel="stylesheet" href="/v010.css">\n', '  <link rel="stylesheet" href="/v010.css">\n  <link rel="stylesheet" href="/v011.css">\n', 1)
          text = text.replace('V0.10.0</span>', 'V0.11.0</span>', 1)
          if '/v011.js' not in text:
              text = text.replace('  <script src="/v091.js" defer></script>\n', '  <script src="/v091.js" defer></script>\n  <script src="/v011.js" defer></script>\n', 1)
          index.write_text(text, encoding='utf-8')

          Path('apps/CYAccountingWeb/VERSION').write_text('0.11.0\n', encoding='utf-8')

          todo = Path('apps/CYAccountingWeb/TODO.md')
          text = todo.read_text(encoding='utf-8')
          text = text.replace('- [ ] 常用摘要設定：統計依據（帳務日期／近期輸入）、最近 N 筆、最低出現次數。', '- [x] 常用摘要設定：統計依據（帳務日期／近期輸入）、最近 N 筆、最低出現次數（V0.11.0）。')
          text = text.replace('- [ ] 帳戶、大分類、科目的 ↑／↓ 自訂排序；科目跨大分類移動。', '- [x] 帳戶、大分類、科目的 ↑／↓ 自訂排序（V0.11.0）。\n- [ ] 科目跨大分類移動。')
          text = text.replace('- [ ] 日期輸入桌面快速操作：YYYYMMDD、MM/DD 四碼重填、Ctrl+↑／↓ 日期步進；日期 picker 細節後續再評估是否保留原生 Web 控制或自訂。', '- [x] 日期輸入桌面快速操作：YYYYMMDD、MMDD 四碼重填、Ctrl+↑／↓ 日期步進（V0.11.0）；日期 picker 目前保留原生 Web 控制。')
          todo.write_text(text, encoding='utf-8')
          PY

          node --check apps/CYAccountingWeb/src/app.js
          node --check apps/CYAccountingWeb/src/v11-tools.js
          node --check apps/CYAccountingWeb/public/v011.js
          grep -q 'V0.11.0' apps/CYAccountingWeb/public/index.html
          grep -q '/v011.css' apps/CYAccountingWeb/public/index.html
          grep -q '/v011.js' apps/CYAccountingWeb/public/index.html

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/CYAccountingWeb/src/app.js \
                  apps/CYAccountingWeb/public/index.html \
                  apps/CYAccountingWeb/VERSION \
                  apps/CYAccountingWeb/TODO.md
          git commit -m 'feat(CYAccountingWeb): wire V0.11 desktop efficiency tools'
          git push origin HEAD:cyaccountingweb/v0.11-desktop-efficiency
