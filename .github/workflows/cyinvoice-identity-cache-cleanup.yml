name: CYInvoice Identity Cache Cleanup

on:
  pull_request:
    branches:
      - cyinvoice/feat-cloud-security-audit

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'cyinvoice/identity-foundation-refactor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Restore baseline formatting and apply only canonical role change
        shell: bash
        run: |
          set -euo pipefail
          path='apps/CYInvoice/src/CYInvoice.Core/CloudEmployeeCacheStore.cs'
          git show 1dd412e9cbc7ad50bb7a472fa96d50c40b6d2f7f:"$path" > "$path"
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/CYInvoice/src/CYInvoice.Core/CloudEmployeeCacheStore.cs')
          text = path.read_text(encoding='utf-8')
          old = "CHECK (role IN ('SUPER_ADMIN', 'ADMIN', 'EMPLOYEE'))"
          new = "CHECK (role IN ('SUPER_ADMIN', 'ADMIN', 'USER'))"
          if text.count(old) != 1:
              raise SystemExit(f'expected one cache role constraint, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/cyinvoice-identity-cache-cleanup.yml').unlink()
          PY
          git diff --check
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/CYInvoice/src/CYInvoice.Core/CloudEmployeeCacheStore.cs .github/workflows/cyinvoice-identity-cache-cleanup.yml
          git commit -m 'refactor(CYInvoice): minimize Cloud cache role diff'
          git push origin HEAD:${{ github.head_ref }}
