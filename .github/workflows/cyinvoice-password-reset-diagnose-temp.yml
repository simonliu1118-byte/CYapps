name: CYInvoice Password Reset Diagnose (Temporary)

on:
  push:
    branches:
      - cyinvoice/cloud-onboarding-first-device
    paths:
      - '.github/workflows/cyinvoice-password-reset-diagnose-temp.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: development
    defaults:
      run:
        working-directory: apps/CYInvoice/cloud
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Inspect password reset metadata only
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute DB --remote --command "
            SELECT
              ce.employee_no,
              ce.enabled,
              ce.role,
              ce.credential_version,
              ce.revision,
              substr(o.challenge_id, 1, 12) || '...' AS challenge_prefix,
              o.delivery_state,
              o.attempt_count,
              o.max_attempts,
              o.created_at,
              o.sent_at,
              o.expires_at,
              o.consumed_at,
              o.updated_at
            FROM cloud_employees ce
            LEFT JOIN email_otp_challenges o
              ON o.scope_key = ('CYAccountingWeb:' || ce.workspace_id || ':' || ce.employee_id)
             AND o.purpose = 'employee_password_reset'
            WHERE ce.employee_no = '3001'
            ORDER BY o.created_at DESC
            LIMIT 5;
          "
