          verify_asset "$base/excel-export-ui.js?rev=native-device-share" 'nativeShare'
          verify_asset "$base/adaptive-ui.css?rev=desktop-independent-scroll" 'Tablet portrait ledger polish'
          verify_asset "$base/adaptive-ui.css?rev=desktop-independent-scroll" 'Tablet summary/header cleanup'
          verify_asset "$base/adaptive-ui.css?rev=desktop-independent-scroll" 'V0.22.26 portrait tab handle hotfix'
          verify_asset "$base/adaptive-ui.css?rev=desktop-independent-scroll" '#settingsDialog.settings-modal'
          verify_asset "$base/adaptive-ui.css?rev=desktop-independent-scroll" 'grid-template-columns: repeat(5, minmax(0, 1fr))'
          verify_asset "$base/adaptive-ui.css?rev=desktop-independent-scroll" 'writing-mode: vertical-rl'
          verify_asset "$base/excel-export-ui.js?rev=native-device-share" 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
          verify_asset "$base/adaptive-ui.css?rev=desktop-independent-scroll" 'border-radius: 11px 11px 0 0'
          verify_asset "$base/adaptive-ui.css?rev=desktop-independent-scroll" 'grid-row: 3 !important'
