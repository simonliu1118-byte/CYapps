name: CYInvoice Password Recovery Live Smoke (Temporary)

on:
  push:
    branches:
      - cyinvoice/cloud-onboarding-first-device
    paths:
      - ".github/workflows/cyinvoice-password-recovery-smoke-temp.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe challenge route without sending Email
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl --silent --show-error --output "$tmp" --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data '{"application":"CYAccountingWeb","employeeNo":"0000"}' \
            'https://cyinvoice-cloud-dev.simonliu1118.workers.dev/v1/web-auth/password-reset/challenge')"
          body="$(cat "$tmp")"
          rm -f "$tmp"
          echo "HTTP $code"
          echo "$body"
          [[ "$code" == "400" ]]
          grep -q 'PASSWORD_RESET_UNAVAILABLE' <<<"$body"

      - name: Probe confirm validation route
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl --silent --show-error --output "$tmp" --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data '{"application":"CYAccountingWeb","employeeNo":"0000","challengeId":"bad","otp":"000000","newPassword":"Password123"}' \
            'https://cyinvoice-cloud-dev.simonliu1118.workers.dev/v1/web-auth/password-reset/confirm')"
          body="$(cat "$tmp")"
          rm -f "$tmp"
          echo "HTTP $code"
          echo "$body"
          [[ "$code" == "400" ]]
          grep -q 'INVALID_PASSWORD_RESET_CONFIRMATION' <<<"$body"
