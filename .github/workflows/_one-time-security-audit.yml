name: One-time public secret audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_one-time-security-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch all public refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          while read -r sha ref; do
            case "$ref" in
              refs/pull/*/head)
                n="${ref#refs/pull/}"; n="${n%/head}"
                git fetch --force origin "$ref:refs/remotes/pull/$n" || true
                ;;
            esac
          done < <(git ls-remote origin 'refs/pull/*/head')

      - name: Scan secret-named literal assignments without printing values
        shell: bash
        run: |
          cat > /tmp/targeted_audit.py <<'PY'
          import re, subprocess

          def git(*args, binary=False):
              p = subprocess.run(["git", *args], stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=True)
              return p.stdout if binary else p.stdout.decode("utf-8", "replace")

          # Catch names such as CLEAR_PASSWORD, ProdAppKey, CLIENT_SECRET,
          # RefreshToken, API_KEY, etc.  Values are never printed.
          rx = re.compile(
              r'''(?ix)\b([A-Za-z_][A-Za-z0-9_]*(?:password|passwd|secret|token|api[_-]?key|app[_-]?key)[A-Za-z0-9_]*)\s*(?::=|=|:)\s*["']([^"'\r\n]{4,})["']'''
          )
          provider = {
              'github_token': re.compile(rb'\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{30,}\b|\bgithub_pat_[A-Za-z0-9_]{50,}\b'),
              'google_api_key': re.compile(rb'\bAIza[0-9A-Za-z_-]{35}\b'),
              'aws_access_key': re.compile(rb'\b(?:AKIA|ASIA)[A-Z0-9]{16}\b'),
          }
          allow_values = {
              'sHeq7t8G1wiQvhAuIM27', # public AMEGO test credential
              'password', 'secret', 'test-secret', 'example-secret', 'dummy-secret'
          }
          placeholder = re.compile(r'(?i)^(?:test|demo|example|dummy|placeholder|changeme|your[-_ ]|xxx|000000)')

          objects = {}
          for line in git('rev-list','--objects','--all').splitlines():
              parts = line.split(' ',1)
              objects.setdefault(parts[0], parts[1] if len(parts)>1 else '')

          findings=[]
          scanned=0
          for sha,path in objects.items():
              try:
                  if git('cat-file','-t',sha).strip() != 'blob': continue
                  size=int(git('cat-file','-s',sha).strip())
                  if size > 2_000_000: continue
                  data=git('cat-file','blob',sha,binary=True)
              except Exception:
                  continue
              scanned += 1
              for cat,pat in provider.items():
                  if pat.search(data): findings.append((cat,path,sha))
              if b'\x00' in data: continue
              text=data.decode('utf-8','replace')
              for m in rx.finditer(text):
                  name=m.group(1)
                  value=m.group(2).strip()
                  # Ignore hash format identifiers, documented test values and placeholders.
                  if value.startswith('pbkdf2-') or value in allow_values or placeholder.search(value):
                      continue
                  # Ignore format/interpolation/template expressions.
                  if any(x in value for x in ('$'+'{{', '$env:', '%s', '{}', '<', '>')):
                      continue
                  findings.append(('secret_named_literal',path,sha))
                  break

          uniq=sorted(set(findings))
          print(f'TARGETED_SCANNED_BLOBS={scanned}')
          print(f'TARGETED_FINDINGS={len(uniq)}')
          for cat,path,sha in uniq:
              print(f'FINDING category={cat} path={path or "<unknown>"} blob={sha[:12]}')
          PY
          python3 /tmp/targeted_audit.py
