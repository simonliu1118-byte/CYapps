name: CYAccountingWeb V0.13 Cleanup (Temporary)

on:
  push:
    branches:
      - cyaccountingweb/v0.13-excel-export
    paths:
      - '.github/workflows/cyaccountingweb-v013-cleanup-temp.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cyaccountingweb/v0.13-excel-export
          fetch-depth: 0
      - name: Remove duplicate CSS links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/CYAccountingWeb/public/index.html')
          text = path.read_text(encoding='utf-8')
          duplicate = '  <link rel="stylesheet" href="/v013.css">\n  <link rel="stylesheet" href="/v011.css">\n  <link rel="stylesheet" href="/v012.css">\n'
          if duplicate not in text:
              raise SystemExit('expected duplicate CSS sequence not found')
          text = text.replace(duplicate, '  <link rel="stylesheet" href="/v013.css">\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
          test "$(grep -c '/v011.css' apps/CYAccountingWeb/public/index.html)" -eq 1
          test "$(grep -c '/v012.css' apps/CYAccountingWeb/public/index.html)" -eq 1
          test "$(grep -c '/v013.css' apps/CYAccountingWeb/public/index.html)" -eq 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/CYAccountingWeb/public/index.html
          git commit -m 'fix(CYAccountingWeb): remove duplicate style references'
          git push origin HEAD:cyaccountingweb/v0.13-excel-export
