name: One-time rewrite public commit email

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_one-time-rewrite-commit-email.yml"

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Rewrite non-private commit email metadata
        shell: bash
        env:
          CY_NOREPLY_EMAIL: 286269326+simonliu1118-byte@users.noreply.github.com
        run: |
          set -euo pipefail
          git fetch --force origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          current_branch="$(git branch --show-current)"
          while read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            [ "$branch" = "HEAD" ] && continue
            [ "$branch" = "$current_branch" ] && continue
            git branch -f "$branch" "$ref"
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/)

          export FILTER_BRANCH_SQUELCH_WARNING=1
          export CY_NOREPLY_EMAIL
          git filter-branch -f --env-filter '
            case "$GIT_AUTHOR_EMAIL" in
              *@users.noreply.github.com|noreply@github.com) ;;
              *) GIT_AUTHOR_EMAIL="$CY_NOREPLY_EMAIL"; export GIT_AUTHOR_EMAIL ;;
            esac
            case "$GIT_COMMITTER_EMAIL" in
              *@users.noreply.github.com|noreply@github.com) ;;
              *) GIT_COMMITTER_EMAIL="$CY_NOREPLY_EMAIL"; export GIT_COMMITTER_EMAIL ;;
            esac
          ' --tag-name-filter cat -- --branches --tags

          git push --force origin --all
          git push --force origin --tags

      - name: Verify rewritten branch history
        shell: bash
        env:
          CY_NOREPLY_EMAIL: 286269326+simonliu1118-byte@users.noreply.github.com
        run: |
          set -euo pipefail
          bad=0
          while read -r email; do
            case "$email" in
              *@users.noreply.github.com|noreply@github.com|"") ;;
              *) echo "Non-private commit email remains in rewritten local refs"; bad=1 ;;
            esac
          done < <(git log --all --format='%ae%n%ce' | sort -u)
          exit "$bad"
