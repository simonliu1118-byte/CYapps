name: CYAccountingWeb Validate and Deploy

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "apps/CYAccountingWeb/**"
      - ".github/workflows/cyaccountingweb-deploy.yml"
  push:
    branches:
      - main
    paths:
      - "apps/CYAccountingWeb/**"
      - ".github/workflows/cyaccountingweb-deploy.yml"

permissions:
  contents: read

concurrency:
  group: cyaccountingweb-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/CYAccountingWeb

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/CYAccountingWeb/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate JavaScript syntax
        run: |
          node --check src/index.js
          node --check src/app.js
          node --check src/v11-tools.js
          node --check src/v12-tools.js
          node --check src/v13-export.js
          node --check src/v15-import.js
          node --check src/v16-backup.js
          node --check public/auth.js
          node --check public/app.js
          node --check public/v03.js
          node --check public/v06.js
          node --check public/v07.js
          node --check public/v08.js
          node --check public/v09.js
          node --check public/v091.js
          node --check public/v011.js
          node --check public/v012.js
          node --check public/v013.js
          node --check public/v014.js
          node --check public/v015.js
          node --check public/v016.js

      - name: Run application tests
        run: |
          node tests/v15-import.mjs
          node tests/v16-backup.mjs

      - name: Validate D1 migrations locally
        run: npx wrangler d1 migrations apply DB --local --persist-to /tmp/cyaccounting-ci-d1

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    defaults:
      run:
        working-directory: apps/CYAccountingWeb

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/CYAccountingWeb/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy Worker and static assets
        run: npx wrangler deploy
