name: CYAccounting UI Refinement Build 6 (one-time)

on:
  push:
    branches:
      - cyaccounting/v1.2.0-visual-phase1
    paths:
      - .github/workflows/cyaccounting-ui-refinement-build6.yml
      - apps/CYAccounting/tools/refine_ui_build6.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cyaccounting/v1.2.0-visual-phase1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Apply guarded Build 6 refinement
        working-directory: apps/CYAccounting
        shell: pwsh
        run: |
          python tools/refine_ui_build6.py
          if ($LASTEXITCODE -ne 0) { throw "Build 6 refinement failed" }
      - name: Validate transformed source
        shell: pwsh
        run: |
          python -m compileall -q apps/CYAccounting/app apps/CYAccounting/tests
          if ((Get-Content apps/CYAccounting/BUILD -Raw).Trim() -ne "6") { throw "BUILD is not 6" }
          $main = Get-Content apps/CYAccounting/app/main.py -Raw
          if ($main -match 'def _prepare_secondary_dialog_chrome[\s\S]{0,1000}setWindowFlags\(') { throw "Secondary helper still mutates Qt flags" }
          if ($main -match 'def _prepare_secondary_dialog_chrome[\s\S]{0,1000}setWindowIcon\(') { throw "Secondary helper still uses a Qt icon workaround" }
          if ($main -notmatch 'Copyright © \{APP_RELEASE_DATE\[:4\]\} C\.C\. Liu, Chihyuan Co\. All Rights Reserved\.') { throw "Footer copyright missing" }
          $dialogs = Get-Content apps/CYAccounting/app/dialogs.py -Raw
          if ($dialogs -match 'QGroupBox\("程式資訊"\)') { throw "Settings still contains Program Information group" }
          if ($dialogs -notmatch 'QGroupBox\("帳本重置"\)') { throw "Account reset group missing" }
          $theme = Get-Content apps/CYAccounting/app/theme.py -Raw
          if ($theme -match 'QTabWidget#categoryManagerTabs QTabBar::tab:selected \{\{[\s\S]{0,300}border-bottom: 2px solid') { throw "Category tabs still use underline navigation" }
          if ($theme -notmatch 'QLabel#appFooter') { throw "Footer style missing" }
      - name: Commit Build 6 source
        shell: pwsh
        run: |
          git config user.name "simonliu1118-byte"
          git config user.email "286269326+simonliu1118-byte@users.noreply.github.com"
          git add apps/CYAccounting/app/main.py apps/CYAccounting/app/dialogs.py apps/CYAccounting/app/theme.py apps/CYAccounting/tests/test_app.py apps/CYAccounting/BUILD apps/CYAccounting/V1.2.0.txt
          git rm apps/CYAccounting/tools/refine_ui_build6.py
          git diff --cached --check
          if (git diff --cached --quiet) { throw "No Build 6 changes staged" }
          git commit -m "ui(CYAccounting): refine tabs footer and secondary dialog chrome"
          git push origin HEAD:cyaccounting/v1.2.0-visual-phase1
