name: CYInvoice Password Recovery Development Deploy (Temporary)

on:
  push:
    branches:
      - cyinvoice/cloud-onboarding-first-device
    paths:
      - ".github/workflows/cyinvoice-password-recovery-deploy-temp.yml"

permissions:
  contents: read

concurrency:
  group: cyinvoice-cloud-development-deploy
  cancel-in-progress: false

jobs:
  deploy-development:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    defaults:
      run:
        working-directory: apps/CYInvoice/cloud
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run check
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy existing development Worker
        run: npx wrangler deploy
