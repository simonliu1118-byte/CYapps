      - name: Build runner-only production continuity import
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const dir='/tmp/cyid-dev-continuity';
          const tableOrder=[
            'workspaces',
            'employees',
            'employee_credentials',
            'employee_initial_credentials',
