name: CYERPAutoInput Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "apps/CYERPAutoInput/**"
      - ".github/workflows/cyerp-auto-input-build.yml"

permissions:
  contents: read

concurrency:
  group: cyerp-auto-input-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/CYERPAutoInput
    steps:
      - uses: actions/checkout@v7

      - name: Read VERSION and BUILD
        shell: pwsh
        run: |
          $version = (Get-Content ./VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid CYERPAutoInput VERSION: $version" }
          $build = (Get-Content ./BUILD -Raw).Trim()
          if ($build -notmatch '^\d+$') { throw "Invalid CYERPAutoInput BUILD: $build" }
          $suffix = ""
          if ([int]$build -gt 0) { $suffix = "-build$build" }
          "CYERPAUTOINPUT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CYERPAUTOINPUT_BUILD=$build" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CYERPAUTOINPUT_ARTIFACT_SUFFIX=$suffix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: false

      - name: Test
        run: go test ./...

      - name: Build Windows x64 flat package
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force package -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path package | Out-Null
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags "-H=windowsgui" -o "package/CYERPAutoInput.exe" .
          if (-not (Test-Path "package/CYERPAutoInput.exe")) { throw "CYERPAutoInput.exe was not produced" }
          Get-FileHash "package/CYERPAutoInput.exe" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  CYERPAutoInput.exe" } | Set-Content "package/SHA256.txt"
          Copy-Item README.md "package/README.md"
          Copy-Item settings.example.json "package/settings.example.json"

      - name: Upload engineering package
        uses: actions/upload-artifact@v7
        with:
          name: CYERPAutoInput-v${{ env.CYERPAUTOINPUT_VERSION }}${{ env.CYERPAUTOINPUT_ARTIFACT_SUFFIX }}-windows-x64-run${{ github.run_number }}
          path: apps/CYERPAutoInput/package/*
          if-no-files-found: error
          retention-days: 14
