name: CYAccounting Input Refinement Pass 3 (one-time)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: cyaccounting-input-refine-pass3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'cyaccounting/v1.2.0-visual-phase1'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply guarded refinement
        working-directory: apps/CYAccounting
        shell: pwsh
        run: |
          python ./tools/refine_input_layout_pass3.py
          if ($LASTEXITCODE -ne 0) { throw "Input refinement pass 3 failed" }
      - name: Commit final source only
        shell: pwsh
        run: |
          git config user.name "simonliu1118-byte"
          git config user.email "286269326+simonliu1118-byte@users.noreply.github.com"
          git add apps/CYAccounting/app/main.py apps/CYAccounting/app/theme.py apps/CYAccounting/V1.2.0.txt
          git rm apps/CYAccounting/tools/refine_input_layout_pass3.py
          git rm .github/workflows/cyaccounting-input-refine-pass3.yml
          if (git diff --cached --quiet) { throw "Input refinement pass 3 produced no source changes" }
          git commit -m "style(CYAccounting): refine input sections and dialog chrome"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
