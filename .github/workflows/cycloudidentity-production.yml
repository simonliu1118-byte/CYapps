name: CYCloud Identity Production Provisioning

on:
  push:
    branches:
      - deploy/cycloudidentity-production

permissions:
  contents: read

concurrency:
  group: cycloudidentity-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/CYCloudIdentity
    steps:
      - uses: actions/checkout@v7
      - name: Scan public source
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/scan-public-package.py apps/CYCloudIdentity
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Validate provider source
        run: |
          npm run check
          npm test

  provision-resources:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: apps/CYCloudIdentity
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEV_CYID_WORKER_NAME: ${{ vars.CYID_WORKER_NAME }}
      DEV_CYID_D1_DATABASE_NAME: ${{ vars.CYID_D1_DATABASE_NAME }}
      DEV_CYID_D1_DATABASE_ID: ${{ vars.CYID_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Derive isolated production resource targets
        shell: bash
        run: |
          set -euo pipefail
          required=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DEV_CYID_WORKER_NAME DEV_CYID_D1_DATABASE_NAME DEV_CYID_D1_DATABASE_ID)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing protected production provisioning prerequisite." >&2
              exit 1
            fi
          done

          if [[ "$DEV_CYID_WORKER_NAME" == *-development ]]; then
            PROD_CYID_WORKER_NAME="${DEV_CYID_WORKER_NAME%-development}-production"
          elif [[ "$DEV_CYID_WORKER_NAME" == *-dev ]]; then
            PROD_CYID_WORKER_NAME="${DEV_CYID_WORKER_NAME%-dev}-prod"
          else
            PROD_CYID_WORKER_NAME="${DEV_CYID_WORKER_NAME}-prod"
          fi

          if [[ "$DEV_CYID_D1_DATABASE_NAME" == *-dev-db ]]; then
            PROD_CYID_D1_DATABASE_NAME="${DEV_CYID_D1_DATABASE_NAME%-dev-db}-prod-db"
          elif [[ "$DEV_CYID_D1_DATABASE_NAME" == *_dev_db ]]; then
            PROD_CYID_D1_DATABASE_NAME="${DEV_CYID_D1_DATABASE_NAME%_dev_db}_prod_db"
          else
            PROD_CYID_D1_DATABASE_NAME="${DEV_CYID_D1_DATABASE_NAME}-prod"
          fi

          if [[ "$PROD_CYID_WORKER_NAME" == "$DEV_CYID_WORKER_NAME" || "$PROD_CYID_D1_DATABASE_NAME" == "$DEV_CYID_D1_DATABASE_NAME" ]]; then
            echo "Production resources must be distinct from development." >&2
            exit 1
          fi

          for value in "$DEV_CYID_WORKER_NAME" "$DEV_CYID_D1_DATABASE_NAME" "$DEV_CYID_D1_DATABASE_ID" "$PROD_CYID_WORKER_NAME" "$PROD_CYID_D1_DATABASE_NAME"; do
            echo "::add-mask::$value"
          done
          {
            echo "PROD_CYID_WORKER_NAME=$PROD_CYID_WORKER_NAME"
            echo "PROD_CYID_D1_DATABASE_NAME=$PROD_CYID_D1_DATABASE_NAME"
          } >> "$GITHUB_ENV"

      - name: Create or confirm production Worker
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          code="$(curl -sS -o /tmp/cyid-prod-worker-check.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PROD_CYID_WORKER_NAME/settings")"

          if [[ "$code" == "404" ]]; then
            printf '%s\n' 'export default { async fetch() { return new Response("CYID production bootstrap"); } };' > /tmp/cyid-production-bootstrap.mjs
            if ! npx wrangler deploy /tmp/cyid-production-bootstrap.mjs --name "$PROD_CYID_WORKER_NAME" --compatibility-date 2026-09-25 > /tmp/cyid-prod-worker-create.log 2>&1; then
              node -e '
                const fs=require("node:fs");
                const t=fs.existsSync("/tmp/cyid-prod-worker-create.log")?fs.readFileSync("/tmp/cyid-prod-worker-create.log","utf8").toLowerCase():"";
                const c=[];
                if(t.includes("access")||t.includes("permission")||t.includes("forbidden")||t.includes("unauthorized")) c.push("PERMISSION");
                if(t.includes("quota")||t.includes("limit")) c.push("QUOTA");
                if(t.includes("name")&&(t.includes("invalid")||t.includes("already"))) c.push("NAME");
                console.error("CYID production Worker creation failed category="+(c.join(",")||"unclassified"));
              '
              exit 1
            fi
          elif [[ "$code" != "200" ]]; then
            echo "Unable to inspect CYID production Worker target." >&2
            exit 1
          fi
          echo "Distinct CYID production Worker resource is available."

      - name: Create or confirm production D1
        shell: bash
        run: |
          set -euo pipefail
          list_file="$(mktemp)"
          npx wrangler d1 list --json > "$list_file" 2>/dev/null
          find_id() {
            DB_NAME="$PROD_CYID_D1_DATABASE_NAME" node -e '
              const fs=require("node:fs");
              const data=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              const rows=Array.isArray(data)?data:(Array.isArray(data?.result)?data.result:[]);
              const hit=rows.find(x=>String(x?.name||"")===process.env.DB_NAME);
              if(hit) process.stdout.write(String(hit.uuid||hit.id||""));
            ' "$list_file"
          }

          PROD_CYID_D1_DATABASE_ID="$(find_id)"
          if [[ -z "$PROD_CYID_D1_DATABASE_ID" ]]; then
            if ! npx wrangler d1 create "$PROD_CYID_D1_DATABASE_NAME" --location apac > /tmp/cyid-prod-d1-create.log 2>&1; then
              echo "Unable to create CYID production D1." >&2
              exit 1
            fi
            npx wrangler d1 list --json > "$list_file" 2>/dev/null
            PROD_CYID_D1_DATABASE_ID="$(find_id)"
          fi

          if [[ ! "$PROD_CYID_D1_DATABASE_ID" =~ ^[0-9a-fA-F-]{36}$ || "$PROD_CYID_D1_DATABASE_ID" == "$DEV_CYID_D1_DATABASE_ID" ]]; then
            echo "Production D1 isolation validation failed." >&2
            exit 1
          fi
          echo "::add-mask::$PROD_CYID_D1_DATABASE_ID"
          echo "CYID production resource preflight passed."

      - name: Cleanup
        if: always()
        run: rm -f /tmp/cyid-prod-* /tmp/cyid-production-bootstrap.mjs
