<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <script>
    (() => {
      const localHosts = new Set(['localhost', '127.0.0.1', '::1', '[::1]']);
      if (window.location.protocol === 'http:' && !localHosts.has(window.location.hostname)) {
        const secureUrl = new URL(window.location.href);
        secureUrl.protocol = 'https:';
        window.location.replace(secureUrl.toString());
      }
    })();
  </script>
  <title>志遠記帳系統 CYACC Web</title>
  <link rel="icon" href="/cyacc-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/login.css?rev=cyweb-login-alignment">
  <link rel="stylesheet" href="/cyacc-appearance.css?rev=cyweb-theme-owner-build1">
  <script src="/cyacc-appearance.js?rev=cyweb-theme-owner-build1"></script>
</head>
<body>
  <main class="login-shell">
    <div class="login-appearance"><button class="cy-op-button quiet cy-theme-toggle" data-cyacc-theme-toggle type="button" aria-label="外觀"></button></div>
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="brand-block">
        <span class="brand-mark" aria-hidden="true"><img src="/cyacc-icon.svg" width="46" height="46" alt=""></span>
        <div>
          <h1 id="loginTitle">志遠記帳系統</h1><p class="login-subtitle">CYACC Web</p>
        </div>
      </div>

      <section id="loginPanel">
        <h2>員工帳號登入</h2>
        <form id="loginForm" action="/login" method="post" class="login-form" autocomplete="on">
          <label>
            <span>員工編號</span>
            <input id="employeeNo" name="employeeNo" type="text" inputmode="numeric" maxlength="4" pattern="\d{4}" autocomplete="username" required>
          </label>
          <label>
            <span>密碼</span>
            <input name="password" type="password" autocomplete="current-password" required>
          </label>
          <p id="loginMessage" class="message" role="alert" aria-live="polite"></p>
          <div class="cyacc-login-options">
            <label class="cyacc-remember-label"><input id="rememberEmployee" type="checkbox"><span>記住我</span></label>
            <button id="forgotPassword" class="link-button" type="button">忘記密碼？</button>
          </div>
          <button id="loginButton" class="primary" type="submit">登入</button>
          <div id="firstLoginHelp" class="first-login-help">
            <strong>第一次使用 CY 系統？</strong>
            <span>請先到 CY Web，使用驗證信中的一次性首次登入密碼完成 Email 驗證，設定正式密碼後再登入記帳系統。</span>
            <a id="firstLoginCyWebLink" href="#" target="_blank" rel="noopener noreferrer" hidden>前往 CY Web 完成 Email 驗證</a>
          </div>
        </form>
      </section>

      <section id="recoveryPanel" hidden>
        <h2>重設密碼</h2>
        <form id="recoveryForm" class="login-form" autocomplete="off">
          <label>
            <span>員工編號</span>
            <input id="recoveryEmployeeNo" type="text" inputmode="numeric" maxlength="4" pattern="\d{4}" autocomplete="username" required>
          </label>
          <button id="recoverySend" class="primary" type="submit">寄送驗證碼</button>

          <div id="recoveryConfirmFields" class="recovery-fields" hidden>
            <p id="recoveryDelivery" class="delivery-note"></p>
            <label>
              <span>Email 驗證碼</span>
              <input id="recoveryCode" type="text" inputmode="numeric" maxlength="6" pattern="\d{6}" autocomplete="one-time-code">
            </label>
            <label>
              <span>新密碼</span>
              <input id="recoveryPassword" type="password" autocomplete="new-password">
            </label>
            <label>
              <span>再次輸入新密碼</span>
              <input id="recoveryPasswordConfirm" type="password" autocomplete="new-password">
            </label>
            <button id="recoveryConfirm" class="primary" type="submit">重設密碼</button>
            <button id="recoveryResend" class="secondary" type="button">重新寄送驗證碼</button>
          </div>

          <p id="recoveryMessage" class="message" role="status" aria-live="polite"></p>
          <button id="recoveryBack" class="link-button" type="button">返回登入</button>
        </form>
      </section>

    </section>
  </main>
  <script src="/login.js?rev=cyweb-login-alignment" defer></script>
</body>
</html>
