name: CYAccounting Build 8 Release Tabs (one-time)

on:
  push:
    branches:
      - cyaccounting/v1.2.0-visual-phase1
    paths:
      - .github/workflows/cyaccounting-build8-release-tabs.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cyaccounting/v1.2.0-visual-phase1
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Apply Build 8 corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('apps/CYAccounting')

          main_path = root / 'app/main.py'
          main = main_path.read_text(encoding='utf-8')
          helper_pattern = re.compile(
              r"    @staticmethod\n"
              r"    def _apply_secondary_dialog_no_icon\(dialog: QDialog\) -> None:\n"
              r".*?"
              r"(?=    def eventFilter\(self, watched, event\):)",
              re.S,
          )
          main, count = helper_pattern.subn('', main, count=1)
          if count != 1:
              raise SystemExit(f'icon-helper removal count={count}')
          dialog_branch_pattern = re.compile(
              r"            elif isinstance\(watched, QDialog\) and not isinstance\(watched, QFileDialog\):\n"
              r"                if event\.type\(\) == QEvent\.Type\.Polish:\n"
              r"                    self\._prepare_secondary_dialog_chrome\(watched\)\n"
              r"                QTimer\.singleShot\(0, lambda dlg=watched: self\._clear_secondary_dialog_icon\(dlg\)\)\n"
          )
          main, count = dialog_branch_pattern.subn('', main, count=1)
          if count != 1:
              raise SystemExit(f'secondary-dialog event branch removal count={count}')
          main_path.write_text(main, encoding='utf-8')

          dialogs_path = root / 'app/dialogs.py'
          dialogs = dialogs_path.read_text(encoding='utf-8')
          tab_setup_pattern = re.compile(
              r"(        tabs = QTabWidget\(\)\n)"
              r"        tabs\.setObjectName\(\"categoryManagerTabs\"\)\n"
              r"        tabs\.tabBar\(\)\.setExpanding\(False\)\n"
              r"        tabs\.tabBar\(\)\.setUsesScrollButtons\(False\)\n"
              r"(        tabs\.addTab\(CategoryPage\(db, \"income\"\), \"收入科目\"\)\n"
              r"        tabs\.addTab\(CategoryPage\(db, \"expense\"\), \"支出科目\"\)\n)"
          )
          dialogs, count = tab_setup_pattern.subn(r"\1\2", dialogs, count=1)
          if count != 1:
              raise SystemExit(f'category-tab construction replacement count={count}')
          dialogs_path.write_text(dialogs, encoding='utf-8')

          theme_path = root / 'app/theme.py'
          theme = theme_path.read_text(encoding='utf-8')
          tab_qss_pattern = re.compile(
              r"/\* Category manager: V1\.1\.0 conventional geometry, enlarged to current guide\..*?"
              r"(?=QLineEdit, QComboBox, QSpinBox, QDateEdit \{\{)",
              re.S,
          )
          theme, count = tab_qss_pattern.subn('', theme, count=1)
          if count != 1:
              raise SystemExit(f'category-manager QSS removal count={count}')
          theme_path.write_text(theme, encoding='utf-8')

          tests_path = root / 'tests/test_app.py'
          tests = tests_path.read_text(encoding='utf-8')
          regression_pattern = re.compile(
              r"    category_tabs = category_dlg\.findChild\(QTabWidget, 'categoryManagerTabs'\)\n"
              r".*?"
              r"(?=    combo = CategoryComboBox\(\))",
              re.S,
          )
          regression_replacement = (
              "    category_tabs = category_dlg.findChild(QTabWidget)\n"
              "    assert category_tabs is not None\n"
              "    assert category_tabs.count() == 2\n"
              "    # V1.1.0 Release implementation: plain native QTabWidget.\n"
              "    assert category_tabs.objectName() == ''\n"
              "    assert 'categoryManagerTabs' not in main_module.APP_STYLE\n"
              "    # Secondary dialogs inherit QApplication's ACC icon; no Win32\n"
              "    # fixed-dialog/no-icon manipulation remains.\n"
              "    assert not hasattr(main_module.ChineseStandardButtonFilter, '_prepare_secondary_dialog_chrome')\n"
          )
          tests, count = regression_pattern.subn(regression_replacement, tests, count=1)
          if count != 1:
              raise SystemExit(f'regression block replacement count={count}')
          tests_path.write_text(tests, encoding='utf-8')

          build_path = root / 'BUILD'
          if build_path.read_text(encoding='utf-8').strip() != '7':
              raise SystemExit('expected BUILD 7 before Build 8 migration')
          build_path.write_text('8\n', encoding='utf-8')

          notes_path = root / 'V1.2.0.txt'
          notes = notes_path.read_text(encoding='utf-8')
          if 'Build: 7' not in notes:
              raise SystemExit('Build 7 note header missing')
          notes = notes.replace('Build: 7', 'Build: 8', 1)
          marker = 'Current source on Phase 1 visual-alignment branch; test artifact, not a formal Release:\n'
          build8 = (
              '- Build 8 restores the income/expense category-manager tabs to the V1.1.0 Release implementation itself: a plain native QTabWidget with no CYAccounting-specific tab QSS, no forced expansion, and no custom tab-bar geometry.\n'
              '- Build 8 abandons secondary-dialog title-bar icon suppression. Dialogs again inherit the QApplication ACC icon from app/resources/app.ico; the Build 6/7 Win32 fixed-dialog/no-icon workaround is removed.\n'
          )
          if marker not in notes:
              raise SystemExit('version-note marker missing')
          notes = notes.replace(marker, marker + build8, 1)
          notes_path.write_text(notes, encoding='utf-8')
          PY

      - name: Validate transformed source
        shell: bash
        run: |
          python -m py_compile \
            apps/CYAccounting/app/main.py \
            apps/CYAccounting/app/dialogs.py \
            apps/CYAccounting/app/theme.py \
            apps/CYAccounting/tests/test_app.py
          test "$(tr -d '\r\n ' < apps/CYAccounting/BUILD)" = "8"
          ! grep -q 'categoryManagerTabs' apps/CYAccounting/app/dialogs.py
          ! grep -q 'categoryManagerTabs' apps/CYAccounting/app/theme.py
          ! grep -q 'MSWindowsFixedSizeDialogHint' apps/CYAccounting/app/main.py
          ! grep -q '_apply_secondary_dialog_no_icon' apps/CYAccounting/app/main.py
          grep -q 'app.setWindowIcon(QIcon(str(icon_path)))' apps/CYAccounting/app/main.py

      - name: Commit Build 8
        shell: bash
        run: |
          git config user.name "simonliu1118-byte"
          git config user.email "286269326+simonliu1118-byte@users.noreply.github.com"
          git add \
            apps/CYAccounting/BUILD \
            apps/CYAccounting/V1.2.0.txt \
            apps/CYAccounting/app/main.py \
            apps/CYAccounting/app/dialogs.py \
            apps/CYAccounting/app/theme.py \
            apps/CYAccounting/tests/test_app.py
          git commit -m "ui(CYAccounting): restore release tabs and ACC dialog icon"
          git push origin HEAD:cyaccounting/v1.2.0-visual-phase1
