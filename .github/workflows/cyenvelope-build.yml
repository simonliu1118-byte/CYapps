name: CYEnvelope Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "apps/CYEnvelope/**"
      - ".github/workflows/cyenvelope-build.yml"
      - ".github/scripts/scan-public-package.py"

permissions:
  contents: read

concurrency:
  group: cyenvelope-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/CYEnvelope
    steps:
      - uses: actions/checkout@v7

      - name: Read VERSION
        shell: pwsh
        run: |
          $version = (Get-Content ./VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid CYEnvelope VERSION: $version" }
          "CYENVELOPE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
          cache-dependency-path: apps/CYEnvelope/go.sum

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Test
        run: go test ./...

      - name: Build portable package
        shell: pwsh
        run: ./build.ps1

      - name: Scan engineering package for secrets and production bindings
        shell: pwsh
        run: |
          $package = Get-ChildItem ./dist/CYEnvelope_V*.zip | Select-Object -First 1
          if (-not $package) { throw "CYEnvelope package not found for safety scan" }
          python "$env:GITHUB_WORKSPACE/.github/scripts/scan-public-package.py" $package.FullName

      - name: Upload CYEnvelope engineering package
        uses: actions/upload-artifact@v7
        with:
          name: CYEnvelope-v${{ env.CYENVELOPE_VERSION }}-windows-x64-run${{ github.run_number }}
          path: apps/CYEnvelope/dist/CYEnvelope_V*.zip
          if-no-files-found: error
          retention-days: 3
