name: CYInvoice Development Cloud Deploy

on:
  pull_request:
    paths:
      - 'apps/CYInvoice/cloud/**'
      - '.github/workflows/cyinvoice-cloud-dev-deploy.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Read-only preflight, preserved code deployment, or approved development CYID preparation/activation'
        type: choice
        options: [preflight, deploy, prepare-cyid, activate-cyid]
        default: preflight
        required: true
      schema_upgrade:
        description: 'Explicit marker rollout only AFTER the original D1 migration is applied; allowance flags must stay off'
        type: choice
        options: ['none', '18:19', '19:20', '20:21']
        default: 'none'
        required: true
  push:
    branches:
      - cyinvoice/cloud-dev-preflight
      - cyinvoice/cloud-dev-deploy
      - cyinvoice/cloud-dev-prepare-cyid
      - cyinvoice/cloud-dev-activate-cyid

permissions:
  contents: read

concurrency:
  group: cyinvoice-development-cloud-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/CYInvoice/cloud
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Scan public source
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/scan-public-package.py apps/CYInvoice/cloud
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Validate source, deployment audit and Worker bundle
        run: npm run check && npm test && npm run deploy:dry-run

  development:
    name: Audit and optionally deploy original development Cloud
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    defaults:
      run:
        shell: bash
        working-directory: apps/CYInvoice/cloud
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CYID_WORKER_NAME: ${{ secrets.CYINVOICE_CYID_WORKER_NAME || secrets.CYID_WORKER_NAME }}
      CYINVOICE_CYID_ENVIRONMENT: ${{ vars.CYINVOICE_CYID_ENVIRONMENT || 'development' }}
      CYINVOICE_RETAINED_PROBE_WORKER_NAME: ${{ secrets.CYINVOICE_RETAINED_PROBE_WORKER_NAME }}
      CYINVOICE_DEPLOYMENT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.ref == 'refs/heads/cyinvoice/cloud-dev-activate-cyid' && 'activate-cyid' || github.ref == 'refs/heads/cyinvoice/cloud-dev-prepare-cyid' && 'prepare-cyid' || github.ref == 'refs/heads/cyinvoice/cloud-dev-deploy' && 'deploy' || 'preflight') }}
      CYINVOICE_SCHEMA_UPGRADE: ${{ github.event_name == 'workflow_dispatch' && inputs.schema_upgrade != 'none' && inputs.schema_upgrade || '' }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Read-only remote preflight and private recovery checkpoint
        run: |
          set -euo pipefail
          umask 077
          node scripts/deployment-preflight.mjs before "$RUNNER_TEMP/cyinvoice-deploy-audit.json"

      - name: Validate preserved development config before mutation
        if: env.CYINVOICE_DEPLOYMENT_MODE != 'preflight'
        run: |
          set -euo pipefail
          if ! npx wrangler deploy --dry-run --config wrangler.deploy.generated.jsonc --outdir "$RUNNER_TEMP/cyinvoice-deploy-bundle" > "$RUNNER_TEMP/cyinvoice-private-bundle.log" 2>&1; then
            echo 'Preserved development config bundle validation failed; no remote mutation performed.'
            exit 1
          fi

      # D1 migrations are a separate, explicitly authorized local MCP operation.
      # Applying every pending file here would skip the schema19 rollout stage.

      - name: Deploy reviewed development Worker with audited authority mode
        if: env.CYINVOICE_DEPLOYMENT_MODE != 'preflight'
        run: |
          set -euo pipefail
          node scripts/deployment-preflight.mjs deploy "$RUNNER_TEMP/cyinvoice-deploy-audit.json" "$RUNNER_TEMP/cyinvoice-deploy-bundle/app.js"

      - name: Verify source version, API compatibility and original history
        if: always()
        run: node scripts/deployment-preflight.mjs after "$RUNNER_TEMP/cyinvoice-deploy-audit.json"

      - name: Remove private generated files
        if: always()
        run: |
          rm -f wrangler.deploy.generated.jsonc "$RUNNER_TEMP/cyinvoice-deploy-audit.json" "$RUNNER_TEMP/cyinvoice-private-bundle.log" "$RUNNER_TEMP/cyinvoice-private-migration.log" "$RUNNER_TEMP/cyinvoice-private-deploy.log"
          rm -rf "$RUNNER_TEMP/cyinvoice-deploy-bundle"
