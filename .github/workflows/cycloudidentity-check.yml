name: CYCloud Identity Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/CYCloudIdentity/**'
      - '.github/workflows/cycloudidentity-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cycloudidentity-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate D1 identity foundation
        run: python3 apps/CYCloudIdentity/scripts/validate_schema.py

      - name: Scan CYCloud Identity public source
        run: python3 .github/scripts/scan-public-package.py apps/CYCloudIdentity
