name: CYInvoice Web Auth Live Smoke (Temporary)

on:
  push:
    branches:
      - cyinvoice/cloud-onboarding-first-device
    paths:
      - ".github/workflows/cyinvoice-web-auth-smoke-temp.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Web Auth readiness with nonexistent Employee
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          code="$(curl --silent --show-error --output "$tmp" --write-out '%{http_code}' \
            --request POST \
            --header 'content-type: application/json' \
            --data '{"application":"CYAccountingWeb","employeeNo":"0000","password":"cy-live-smoke-invalid"}' \
            'https://cyinvoice-cloud-dev.simonliu1118.workers.dev/v1/web-auth/login')"
          body="$(cat "$tmp")"
          rm -f "$tmp"
          echo "HTTP $code"
          echo "$body"

          if [[ "$code" == "401" ]] && grep -q 'WEB_AUTHENTICATION_FAILED' <<<"$body"; then
            echo 'WEB_AUTH_READY=true'
            exit 0
          fi
          if [[ "$code" == "503" ]] && grep -q 'WEB_AUTH_NOT_READY' <<<"$body"; then
            echo 'WEB_AUTH_READY=false'
            exit 0
          fi
          echo 'Unexpected Web Auth response.' >&2
          exit 1
