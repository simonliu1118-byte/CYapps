<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#132f2c"><meta name="robots" content="noindex,nofollow">
  <title>登入 · 價格觀測室</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23132f2c'/%3E%3Cpath d='M17 43V31M32 43V21M47 43V13' stroke='%23d8ef8b' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#183630;--muted:#77817b;--lime:#dbef9c;--line:#e6e9e2;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:#142f2b}
    .card{width:100%;max-width:400px;background:#fff;border-radius:18px;padding:36px 32px 30px;box-shadow:0 24px 60px #0006}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}
    .brand-icon{background:var(--lime);color:#203c2e;width:44px;height:48px;display:grid;place-items:center;border-radius:12px}
    .brand-icon svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2.7;stroke-linecap:round}
    h1{margin:0;font-size:20px;letter-spacing:.04em}
    .brand small{display:block;margin-top:5px;font-size:10px;letter-spacing:.24em;color:var(--muted)}
    h2{margin:0 0 16px;font-size:14px;font-weight:600;color:#365247}
    label{display:block;margin-bottom:14px;font-size:12px;color:#4d6258}
    input{display:block;width:100%;margin-top:6px;padding:11px 12px;border:1px solid #d4dbcf;border-radius:9px;font:inherit;font-size:16px;color:var(--ink);background:#fff}
    input:focus{outline:2px solid #82aa95;outline-offset:1px}
    button{width:100%;margin-top:6px;padding:12px;border:0;border-radius:9px;background:#254c42;color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
    button:hover{background:#1c3a32}
    .message{min-height:20px;margin:0 0 8px;font-size:13px;color:#b3261e}
    .portal{display:none;margin-top:6px;padding:12px 14px;border-radius:9px;background:#f4f8ec;font-size:12px;line-height:1.6}
    .portal a{display:inline-block;margin-top:4px;font-weight:600;text-decoration:underline}
    .note{margin:20px 0 0;font-size:11px;color:var(--muted)}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="brand-icon"><svg viewBox="0 0 32 32"><path d="M8 24v-7m8 7V11m8 13V6"/></svg></span><div><h1>價格觀測室</h1><small>PRICE DESK</small></div></div>
    <h2>員工帳號登入</h2>
    <form action="/api/auth/login" method="post" autocomplete="on">
      <label>員工編號<input name="employeeNo" type="text" inputmode="numeric" maxlength="4" pattern="\d{4}" autocomplete="username" required></label>
      <label>密碼<input name="password" type="password" minlength="8" maxlength="16" autocomplete="current-password" required></label>
      <p class="message" id="message" role="alert" aria-live="polite"></p>
      <button type="submit">登入</button>
    </form>
    <div class="portal" id="portal">首次使用或尚未完成 Email 驗證與密碼設定，請先到 CY Web 完成設定再回來登入。<br><a id="portal-link" href="#" target="_blank" rel="noopener noreferrer">前往 CY Web</a></div>
    <p class="note">與 CY 其他系統使用相同的員工帳號。</p>
  </main>
  <script>
    const messages={
      invalid:'請輸入 4 碼員工編號與 8 到 16 字元的密碼。',
      failed:'員工編號或密碼不正確。',
      access:'此員工帳號沒有價格觀測室的使用權限。',
      rate:'登入嘗試次數過多，請稍後再試。',
      service:'中央帳號服務目前無法使用，請稍後再試。',
      'first-login':'請先到 CY Web 完成 Email 驗證與密碼設定。'
    };
    const key=new URLSearchParams(location.search).get('error');
    if(key){
      document.getElementById('message').textContent=messages[key]||messages.failed;
      if(key==='first-login'){
        fetch('/api/auth/portal').then(r=>r.ok?r.json():null).then(data=>{
          if(!data)return;
          document.getElementById('portal-link').href=data.url;
          document.getElementById('portal').style.display='block';
        }).catch(()=>{});
      }
    }
  </script>
</body>
</html>
