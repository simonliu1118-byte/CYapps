          verify_asset "$base/app.js?rev=optimistic-create" "await api('/api/opening-balance-overrides'"
          verify_asset "$base/adaptive-ui.js?rev=device-preview-retirement" 'setupArchivedAccountDialog'
          verify_asset "$base/adaptive-ui.js?rev=device-preview-retirement" 'function settingsActionIcon'
          verify_asset "$base/adaptive-ui.js?rev=device-preview-retirement" '帳戶名稱最多八字'
          verify_asset "$base/app.js?rev=optimistic-create" 'function openingAccountRowHtml'
          verify_asset "$base/app.css?rev=app-shell" '.opening-source'
          verify_asset "$base/accounting-ui.css?rev=ledger-header-controls" 'data-settings-kind-choice'
          verify_asset "$base/accounting-ui.css?rev=ledger-header-controls" '.ledger-account-color::before'
          verify_asset "$base/app.js?rev=optimistic-create" 'const groupName = category.group_name'
