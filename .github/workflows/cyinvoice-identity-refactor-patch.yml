name: CYInvoice Identity Refactor Patch

on:
  pull_request:
    branches:
      - cyinvoice/feat-cloud-security-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'cyinvoice/identity-foundation-refactor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply exact Package 1 call-site cleanup
        shell: python
        run: |
          from pathlib import Path

          root = Path('apps/CYInvoice')

          for base in [root / 'src', root / 'tests']:
              for path in base.rglob('*.cs'):
                  text = path.read_text(encoding='utf-8')
                  updated = text.replace('EmployeeRoles.Employee', 'EmployeeRoles.User')
                  updated = updated.replace('"EMPLOYEE"', '"USER"').replace("'EMPLOYEE'", "'USER'")
                  updated = updated.replace('一般員工', '一般使用者')
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')

          for path in (root / 'cloud' / 'src').rglob('*.ts'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('"EMPLOYEE"', '"USER"').replace("'EMPLOYEE'", "'USER'")
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          bootstrap = root / 'src' / 'CYInvoice.WinForms' / 'CloudFirstWorkspaceForm.cs'
          text = bootstrap.read_text(encoding='utf-8')
          old = '''        var authenticated = repository.Employees.Authenticate(superAdmin.EmployeeNo, superAdminPassword.Text);\n        if (authenticated is null || authenticated.Role != EmployeeRoles.SuperAdmin || !authenticated.Enabled)'''
          new = '''        var authenticated = repository.AuthenticatePrincipal(superAdmin.EmployeeNo, superAdminPassword.Text);\n        if (authenticated is null || authenticated.Role != AppRole.SuperAdmin || !authenticated.Enabled)'''
          if text.count(old) != 1:
              raise SystemExit('CloudFirstWorkspaceForm direct-auth pattern was not found exactly once')
          bootstrap.write_text(text.replace(old, new), encoding='utf-8')

          workflow = Path('.github/workflows/cyinvoice-identity-refactor-patch.yml')
          workflow.unlink()
      - name: Validate patch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if grep -RInE 'EmployeeRoles\.Employee|["'"']EMPLOYEE["'"']' apps/CYInvoice/src apps/CYInvoice/tests apps/CYInvoice/cloud/src --include='*.cs' --include='*.ts'; then
            echo 'Forbidden active EMPLOYEE role vocabulary remains.' >&2
            exit 1
          fi
          if grep -RIn 'repository\.Employees\.Authenticate' apps/CYInvoice/src/CYInvoice.WinForms --include='*.cs'; then
            echo 'Direct EmployeeStore authentication remains in WinForms.' >&2
            exit 1
          fi
      - name: Commit exact cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/CYInvoice .github/workflows/cyinvoice-identity-refactor-patch.yml
          git commit -m 'refactor(CYInvoice): finish identity role call-site cleanup'
          git push origin HEAD:${{ github.head_ref }}
