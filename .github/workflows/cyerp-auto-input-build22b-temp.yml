name: CYERPAutoInput Build 22 Corrected Temp CI

on:
  push:
    branches: [ci-cyerp-build21]
    paths:
      - ".github/workflows/cyerp-auto-input-build22b-temp.yml"

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v7
        with:
          ref: cyerp-auto-input/v0.1.0-csharp
          fetch-depth: 0

      - name: Checkout patch driver
        uses: actions/checkout@v7
        with:
          ref: ci-cyerp-build21
          path: .build22-driver
          sparse-checkout: |
            .github/workflows/cyerp-auto-input-build22b-temp.yml
          sparse-checkout-cone-mode: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Apply Build 22 patch
        shell: bash
        working-directory: apps/CYERPAutoInput
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          def read(path):
              return Path(path).read_text(encoding='utf-8').replace('\r\n', '\n')

          def write(path, text):
              with open(path, 'w', encoding='utf-8', newline='\n') as f:
                  f.write(text)

          def dec(value):
              return base64.b64decode(value).decode('utf-8')

          def rep(path, old, new, count=1):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'Expected source block not found in {path}: {old[:120]!r}')
              write(path, text.replace(old, new, count))

          write('BUILD', '22\n')
          rep('AppLogger.cs', 'CYERPAutoInput V0.1.0 Build 21 starting', 'CYERPAutoInput V0.1.0 Build 22 starting')
          rep('Build10UiPatch.cs', 'V0.1.0 Build 21 · Esc：緊急停止 · 不自動儲存 ERP', 'V0.1.0 Build 22 · Esc：緊急停止 · 不自動儲存 ERP')
          rep('MainForm.cs', 'V0.1.0 Build 21 · Esc：緊急停止 · 不自動儲存 ERP', 'V0.1.0 Build 22 · Esc：緊急停止 · 不自動儲存 ERP')

          rep('ErpLayoutResolver.cs', '        return rows[0][1];\n', '        return rows[1][0];\n')

          old_isp = dec('')
          new_isp = dec('ICAgIHByaXZhdGUgc3RhdGljIGJvb2wgSXNQbGF1c2libGVTYWxlc09yZGVyTnVtYmVyKHN0cmluZyB2YWx1ZSkKICAgIHsKICAgICAgICBpZiAoc3RyaW5nLklzTnVsbE9yV2hpdGVTcGFjZSh2YWx1ZSkgfHwgdmFsdWUuTGVuZ3RoIGlzIDwgOCBvciA+IDIwKSByZXR1cm4gZmFsc2U7CiAgICAgICAgcmV0dXJuIHZhbHVlLkFsbChjaGFyLklzRGlnaXQpOwogICAgfQo=')
          rep('ErpAutomationService.cs', old_isp, new_isp)

          old_flow = dec('')
          new_flow = dec('')
          rep('ErpAutomationService.cs', old_flow, new_flow)

          old_warn = dec('')
          new_warn = dec('')
          rep('ErpAutomationService.cs', old_warn, new_warn)

          opt = read('OpticalTextLocator.cs')
          marker = '    private void LogTokens(string context, string target, IReadOnlyList<OcrToken> tokens, int maxTokens)\n'
          insert = dec('')
          if marker not in opt:
              raise SystemExit('OpticalTextLocator insertion marker not found')
          write('OpticalTextLocator.cs', opt.replace(marker, insert + marker, 1))

          f2 = read('F2BatchCellLocator.cs')
          start_marker = '        var horizontal = GridVisionService.FindHorizontalLines(image, Math.Max(0, header.Value.Bottom - 5));\n'
          end_marker = '        throw new InvalidOperationException("F2 批號查詢沒有找到「現有存量 > 0」的批號；已停止目前單據。");\n'
          start = f2.find(start_marker)
          end = f2.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('F2 batch fallback markers not found')
          end += len(end_marker)
          token_block = dec('')
          write('F2BatchCellLocator.cs', f2[:start] + token_block + f2[end:])
          PY

      - name: Fetch canonical CYERPAutoInput icon
        shell: pwsh
        working-directory: apps/CYERPAutoInput
        run: ./tools/fetch-canonical-icon.ps1

      - name: Fetch pinned PaddleOCR models
        shell: pwsh
        working-directory: apps/CYERPAutoInput
        run: ./tools/fetch-ocr-models.ps1

      - name: Restore
        shell: pwsh
        working-directory: apps/CYERPAutoInput
        run: dotnet restore CYERPAutoInput.csproj -r win-x64

      - name: Build
        shell: pwsh
        working-directory: apps/CYERPAutoInput
        run: dotnet build CYERPAutoInput.csproj -c Release -r win-x64 --no-restore -p:Version=0.1.0 -p:ContinuousIntegrationBuild=true

      - name: Optical pipeline self-test
        shell: pwsh
        working-directory: apps/CYERPAutoInput
        run: dotnet run --project CYERPAutoInput.csproj -c Release -r win-x64 --no-build -- --vision-self-test

      - name: Publish and verify portable package
        shell: pwsh
        working-directory: apps/CYERPAutoInput
        run: |
          Remove-Item -Recurse -Force package,publish-staging -ErrorAction SilentlyContinue
          $staging = "publish-staging"
          $outDir = Join-Path "package" "CYERPAutoInput"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          dotnet publish CYERPAutoInput.csproj -c Release -r win-x64 --no-restore --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -p:Version=0.1.0 -o $staging
          if (-not (Test-Path "$staging/CYERPAutoInput.exe")) { throw "CYERPAutoInput.exe was not produced" }
          Copy-Item "$staging/CYERPAutoInput.exe" "$outDir/CYERPAutoInput.exe"
          Copy-Item VERSION "$outDir/VERSION"
          Copy-Item BUILD "$outDir/BUILD"
          Copy-Item README.md "$outDir/README.md"
          Copy-Item THIRD_PARTY_NOTICES.md "$outDir/THIRD_PARTY_NOTICES.md"
          New-Item -ItemType Directory -Path "$outDir/Data" -Force | Out-Null
          Copy-Item settings.example.json "$outDir/Data/settings.example.json"
          New-Item -ItemType Directory -Path "$outDir/runtime/ocr" -Force | Out-Null
          Copy-Item "$staging/runtime/ocr/*.onnx" "$outDir/runtime/ocr/"
          $selfTest = Start-Process -FilePath "$outDir/CYERPAutoInput.exe" -ArgumentList "--vision-self-test" -Wait -PassThru -NoNewWindow
          if ($selfTest.ExitCode -ne 0) { throw "Packaged EXE vision self-test failed" }
          Remove-Item -Recurse -Force "$outDir/logs" -ErrorAction SilentlyContinue
          $unexpected = @(Get-ChildItem -LiteralPath $outDir -Recurse -File | Where-Object { $_.Extension -in @('.pdb','.lib','.dll') -or $_.Name -match 'SHA256' })
          if ($unexpected.Count -gt 0) { throw "Unexpected engineering files: $($unexpected.FullName -join ', ')" }

      - name: Commit Build 22 to development branch
        shell: bash
        run: |
          git config user.name "simonliu1118-byte"
          git config user.email "286269326+simonliu1118-byte@users.noreply.github.com"
          git add apps/CYERPAutoInput
          git commit -m "fix(CYERPAutoInput): correct detail order and lot OCR targeting"
          git push origin HEAD:cyerp-auto-input/v0.1.0-csharp

      - name: Upload Build 22 package
        uses: actions/upload-artifact@v7
        with:
          name: CYERPAutoInput-v0.1.0-build22-windows-x64-temp22
          path: apps/CYERPAutoInput/package/*
          if-no-files-found: error
          retention-days: 14
