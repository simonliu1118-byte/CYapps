name: CYCloud Identity Production Provisioning

on:
  push:
    branches:
      - deploy/cycloudidentity-production

permissions:
  contents: read

concurrency:
  group: cycloudidentity-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/CYCloudIdentity
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Scan public source
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/scan-public-package.py apps/CYCloudIdentity
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Type-check Worker
        run: npm run check
      - name: Run auth-core tests
        run: npm test
      - name: Render CI-only Cloudflare config
        env:
          CYID_WORKER_NAME: cycloud-identity-ci
          CYID_D1_DATABASE_NAME: cycloud_identity_ci
          CYID_D1_DATABASE_ID: 11111111-1111-4111-8111-111111111111
          CYID_LOGIN_RATE_LIMIT_NAMESPACE_ID: "900101"
          CYID_SESSION_TTL_SECONDS: "3600"
          CYID_EMAIL_PROVIDER: brevo
          CYID_EMAIL_FROM: Identity Test <identity@example.test>
          CYID_EMAIL_DAILY_BUDGET: "50"
          CYID_CORE_ACCOUNT_APPLICATION_ID: APP_TEST_LOGIN
          CYID_ACCOUNT_PORTAL_URL: https://portal.example.test/
        run: node scripts/render-deploy-config.mjs --output wrangler.ci.generated.jsonc
      - name: Validate migrations locally
        run: npx wrangler d1 migrations apply DB --local --persist-to /tmp/cycloudidentity-production-ci-d1 --config wrangler.ci.generated.jsonc
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.ci.generated.jsonc
      - name: Remove generated config
        if: always()
        run: rm -f wrangler.ci.generated.jsonc

  provision-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy/cycloudidentity-production'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The protected development Environment is used only as the existing deploy-
    # credential source. Production Worker/D1/runtime/secrets are separate resources.
    environment: development
    defaults:
      run:
        working-directory: apps/CYCloudIdentity
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CYID_BREVO_API_KEY: ${{ secrets.CYID_BREVO_API_KEY }}
      CYID_RESEND_API_KEY: ${{ secrets.CYID_RESEND_API_KEY }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Verify protected deploy credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing protected Cloudflare deployment credential." >&2
              exit 1
            fi
          done

      - name: Discover current CYID development authority without logging identifiers
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

          if ! curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" > /tmp/cyid-workers.json; then
            echo "Unable to inspect Cloudflare Worker inventory." >&2
            exit 1
          fi

          CYID_DEV_WORKER_NAME="$(node -e '
            const fs=require("node:fs");
            const data=JSON.parse(fs.readFileSync("/tmp/cyid-workers.json","utf8"));
            const rows=Array.isArray(data?.result)?data.result:[];
            const candidates=rows.map(x=>String(x?.id||"")).filter(Boolean).filter(name=>{
              const n=name.toLowerCase();
              return n.includes("identity") && (n.includes("dev") || n.includes("development")) && !n.includes("prod");
            });
            if (candidates.length!==1) process.exit(2);
            process.stdout.write(candidates[0]);
          ')"
          echo "::add-mask::$CYID_DEV_WORKER_NAME"

          if ! curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$CYID_DEV_WORKER_NAME/settings" > /tmp/cyid-dev-settings.json; then
            echo "Unable to read current CYID development runtime settings." >&2
            exit 1
          fi

          if ! npx wrangler d1 list --json > /tmp/cyid-d1-list.json 2>/dev/null; then
            echo "Unable to inspect Cloudflare D1 inventory." >&2
            exit 1
          fi

          CYID_DEV_WORKER_NAME="$CYID_DEV_WORKER_NAME" node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const settings=JSON.parse(fs.readFileSync('/tmp/cyid-dev-settings.json','utf8'))?.result || {};
          const bindings=Array.isArray(settings.bindings)?settings:[];
          const byName=new Map(bindings.map(x=>[String(x?.name||''),x]));
          const db=byName.get('DB');
          const databaseId=String(db?.database_id || db?.id || '');
          const list=JSON.parse(fs.readFileSync('/tmp/cyid-d1-list.json','utf8'));
          const dbs=Array.isArray(list)?list:(Array.isArray(list?.result)?list.result:[]);
          const dbRow=dbs.find(x=>String(x?.uuid||x?.id||'')===databaseId);
          const text=(name)=>String(byName.get(name)?.text ?? '');
          const required={
            databaseId,
            databaseName:String(dbRow?.name||''),
            sessionTtl:text('SESSION_TTL_SECONDS'),
            emailProvider:text('EMAIL_PROVIDER'),
            emailFrom:text('EMAIL_FROM'),
            emailDailyBudget:text('EMAIL_DAILY_BUDGET'),
            coreApplicationId:text('CORE_ACCOUNT_APPLICATION_ID'),
          };
          if (!required.databaseId || !required.databaseName || !required.sessionTtl || !required.emailProvider ||
              !required.emailFrom || !required.emailDailyBudget || !required.coreApplicationId) process.exit(3);
          const devWorker=process.env.CYID_DEV_WORKER_NAME;
          const prodWorker=/(?:-dev|-development)$/i.test(devWorker)
            ? devWorker.replace(/(?:-dev|-development)$/i,'-prod')
            : `${devWorker}-prod`;
          const devDb=required.databaseName;
          const prodDb=/(?:-dev(?:-db)?|_dev(?:_db)?)$/i.test(devDb)
            ? devDb.replace(/(?:-dev(?:-db)?|_dev(?:_db)?)$/i, m=>m.startsWith('_')?'_prod_db':'-prod-db')
            : `${devDb}-prod`;
          const h=crypto.createHash('sha256').update(prodWorker).digest('hex').slice(0,15);
