name: CYAccounting Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "apps/CYAccounting/**"
      - ".github/workflows/cyaccounting-build.yml"

permissions:
  contents: write

concurrency:
  group: cyaccounting-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/CYAccounting
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Apply one-time visual migration to PR branch
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          if (Test-Path ./tools/apply_visual_phase1.py) {
            python ./tools/apply_visual_phase1.py
            git config user.name "simonliu1118-byte"
            git config user.email "286269326+simonliu1118-byte@users.noreply.github.com"
            git add app/main.py app/dialogs.py app/import_dialog.py app/widgets.py app/models.py
            git rm tools/apply_visual_phase1.py
            if (-not (git diff --cached --quiet)) {
              git commit -m "style(CYAccounting): align Phase 1 visual system"
              git push origin HEAD:${{ github.event.pull_request.head.ref }}
            }
          } else {
            Write-Host "Visual migration already applied; continuing with normal CI."
          }

      - name: Read VERSION
        shell: pwsh
        run: |
          $version = (Get-Content ./VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid CYAccounting VERSION: $version" }
          $build = (Get-Content ./BUILD -Raw).Trim()
          if ($build -notmatch '^(0|[1-9][0-9]*)$') { throw "Invalid CYAccounting BUILD: $build" }
          $buildSuffix = if ([int]$build -gt 0) { "_Build_$build" } else { "" }
          "CYACCOUNTING_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CYACCOUNTING_BUILD_SUFFIX=$buildSuffix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q app tests

      - name: Run application tests
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python tests/test_app.py
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            Write-Host "CYAccounting tests failed with exit code $testExit"
            if (Test-Path "Data/startup_trace.log") {
              Write-Host "--- Data/startup_trace.log ---"
              Get-Content "Data/startup_trace.log"
              Write-Host "--- end startup_trace.log ---"
            }
            if (Test-Path "Data/Logs") {
              Get-ChildItem "Data/Logs" -Filter "*.log" | ForEach-Object {
                Write-Host "--- $($_.FullName) ---"
                Get-Content $_.FullName
              }
            }
            exit $testExit
          }

      - name: Run safety and integration tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*_unittest.py" -v

      - uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"

      - name: Compile Windows GUI launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          go build -trimpath -ldflags="-H windowsgui" -o out/CYAccountingLauncher.exe launcher_go/main.go
          if (-not (Test-Path out/CYAccountingLauncher.exe)) { throw "launcher build failed" }

      - name: Test Windows GUI launcher lifecycle
        shell: pwsh
        run: go test ./launcher_go -v

      - name: Build Windows x64 portable test package
        shell: pwsh
        run: ./tools/build_portable.ps1

      - name: Verify clean package and embedded startup
        shell: pwsh
        run: |
          $package = "out/portable-dist/CYAccounting_V${env:CYACCOUNTING_VERSION}${env:CYACCOUNTING_BUILD_SUFFIX}_Windows_x64.zip"
          ./tools/verify_portable.ps1 -Package $package

      - name: Verify single-extraction artifact root
        shell: pwsh
        run: |
          $roots = @(Get-ChildItem -LiteralPath out/portable-stage -Force)
          if ($roots.Count -ne 1 -or $roots[0].Name -ne "CYAccounting" -or -not $roots[0].PSIsContainer) {
            throw "Download artifact must contain only the CYAccounting/ folder"
          }
          if (!(Test-Path out/portable-stage/CYAccounting/CYAccounting.exe)) {
            throw "Download artifact must contain CYAccounting.exe"
          }

      - name: Upload portable test package
        uses: actions/upload-artifact@v7
        with:
          name: CYAccounting_V${{ env.CYACCOUNTING_VERSION }}${{ env.CYACCOUNTING_BUILD_SUFFIX }}_Windows_x64_run${{ github.run_number }}
          path: apps/CYAccounting/out/portable-stage/*
          if-no-files-found: error
          retention-days: 3

      - name: Build reproducible source archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $output = "out/cyaccounting-v$env:CYACCOUNTING_VERSION-source.tar.gz"
          python tools/create_source_archive.py --output $output

      - name: Upload source verification archive
        uses: actions/upload-artifact@v7
        with:
          name: cyaccounting-v${{ env.CYACCOUNTING_VERSION }}-source-run${{ github.run_number }}
          path: |
            apps/CYAccounting/out/cyaccounting-v${{ env.CYACCOUNTING_VERSION }}-source.tar.gz
            apps/CYAccounting/out/cyaccounting-v${{ env.CYACCOUNTING_VERSION }}-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3
