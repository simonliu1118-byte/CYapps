name: CYAccounting UI Refinement Pass 5 (one-time)

on:
  push:
    branches:
      - cyaccounting/v1.2.0-visual-phase1
    paths:
      - .github/workflows/cyaccounting-ui-refinement-pass5.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cyaccounting/v1.2.0-visual-phase1
          fetch-depth: 0

      - name: Apply guarded Build 2 refinement
        working-directory: apps/CYAccounting
        run: python tools/refine_ui_build2.py

      - name: Validate transformed source
        run: |
          python -m compileall -q apps/CYAccounting/app apps/CYAccounting/tests
          test "$(cat apps/CYAccounting/BUILD | tr -d '\r\n')" = "2"
          grep -q 'self.setMinimumSize(1120, 740)' apps/CYAccounting/app/main.py
          grep -q 'WS_EX_DLGMODALFRAME' apps/CYAccounting/app/main.py
          grep -q 'QDialog#settingsDialog QGroupBox' apps/CYAccounting/app/theme.py

      - name: Commit final Build 2 source only
        run: |
          rm apps/CYAccounting/tools/refine_ui_build2.py
          rm .github/workflows/cyaccounting-ui-refinement-pass5.yml
          git config user.name "simonliu1118-byte"
          git config user.email "286269326+simonliu1118-byte@users.noreply.github.com"
          git add apps/CYAccounting/app/main.py apps/CYAccounting/app/theme.py apps/CYAccounting/app/dialogs.py apps/CYAccounting/BUILD apps/CYAccounting/V1.2.0.txt apps/CYAccounting/tools/refine_ui_build2.py .github/workflows/cyaccounting-ui-refinement-pass5.yml
          git diff --cached --check
          git commit -m "ui(CYAccounting): refine Build 2 dialogs and compact layout"
          git push origin HEAD:cyaccounting/v1.2.0-visual-phase1

# Retriggered after scoping the InputTab margin change to the class body.
