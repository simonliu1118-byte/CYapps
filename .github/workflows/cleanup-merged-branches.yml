name: Cleanup Merged Branches

on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-merged-branches.yml"

permissions:
  contents: write

jobs:
  cleanup-merged-head:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged short-term branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$HEAD_BRANCH" = "main" ]; then exit 0; fi
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$HEAD_BRANCH"

  cleanup-existing-cyinvoice-branches:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed CYInvoice branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branches=(
            "cyinvoice/csharp-remake"
            "cyinvoice/fix-four-group-titles"
            "cyinvoice/v2.4.0-orderid-build2b"
            "cyinvoice/v2.4.0-retention-build5c"
            "cyinvoice/v2.4.0-sync-issues-build6a"
            "cyinvoice/work-v2.3.0-build1"
            "cyinvoice/work-v2.3.0-build2"
            "cyinvoice/work-v2.3.0-build3"
            "cyinvoice/work-v2.3.0-build4"
            "governance/cyinvoice-v2.0.0"
            "release/cyinvoice-v2.0.0"
            "governance/cyinvoice-auto-release"
            "ci/cyinvoice-auto-release"
            "governance/cyinvoice-go-v1-archive"
          )
          for branch in "${branches[@]}"; do
            if gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" --silent; then
              echo "Deleted $branch"
            else
              echo "Already absent or not deletable: $branch"
            fi
          done

  # One-time cleanup for the merged 2026 TriINVCalc import and governance PRs.
  # This temporary job will be removed in a second cleanup PR after it runs.
  cleanup-completed-triinvcalc:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Delete only verified historical TriINVCalc branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rows=(
            "triinvcalc/initial-import 701ac9ba88ceaccd11c3d863efc5cd08509394cc 7"
            "governance/add-triinvcalc b7351d5a8e2d13e619372e091ed18d7852d1b001 6"
          )
          for row in "${rows[@]}"; do
            read -r branch expected_sha pr <<< "$row"
            ref="repos/$GITHUB_REPOSITORY/git/ref/heads/$branch"
            current_sha=$(gh api "$ref" --jq '.object.sha' 2>/dev/null) || {
              echo "Already absent: $branch"
              continue
            }
            if [ "$current_sha" != "$expected_sha" ]; then
              echo "::error::Branch $branch moved after closeout inspection; refuse deletion."
              exit 1
            fi
            merged_at=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.merged_at')
            if [ -z "$merged_at" ] || [ "$merged_at" = "null" ]; then
              echo "::error::PR #$pr is not merged; refuse deletion."
              exit 1
            fi
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" --silent
            echo "Deleted merged historical branch $branch (PR #$pr)."
          done
