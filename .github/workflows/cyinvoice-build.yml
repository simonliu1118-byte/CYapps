name: CYInvoice Windows Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "apps/CYInvoice/CYInvoice.sln"
      - "apps/CYInvoice/Directory.Build.props"
      - "apps/CYInvoice/VERSION"
      - "apps/CYInvoice/BUILD"
      - "apps/CYInvoice/src/**"
      - "apps/CYInvoice/tests/**"
      - "apps/CYInvoice/assets/**"
      - "apps/CYInvoice/scripts/**"
      - ".github/workflows/cyinvoice-build.yml"
      - ".github/workflows/cyinvoice-release.yml"

permissions:
  contents: read

concurrency:
  group: cyinvoice-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
        working-directory: apps/CYInvoice

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Read VERSION and BUILD
        run: |
          $version = (Get-Content ./VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid CYInvoice VERSION: $version" }
          $build = (Get-Content ./BUILD -Raw).Trim()
          if ($build -notmatch '^\d+$') { throw "Invalid CYInvoice BUILD: $build" }
          $buildNumber = [int]$build
          $artifactVersion = $version
          if ($buildNumber -gt 0) { $artifactVersion = "${version}_Build${buildNumber}" }
          "CYINVOICE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CYINVOICE_BUILD=$buildNumber" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CYINVOICE_ARTIFACT_VERSION=$artifactVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Scan tracked source for confidential runtime data
        run: ./scripts/verify-source.ps1

      - name: Restore
        run: dotnet restore CYInvoice.sln

      - name: Build with warnings as errors
        run: dotnet build CYInvoice.sln -c Release -p:Platform=x64 -p:Version=$env:CYINVOICE_VERSION --no-restore

      - name: Run WinForms startup smoke test
        run: |
          dotnet run --project src/CYInvoice.WinForms/CYInvoice.WinForms.csproj -c Release -p:Platform=x64 --no-build -- --startup-smoke-test
          if ($LASTEXITCODE -ne 0) {
            $startupLog = Get-ChildItem -Path ./src/CYInvoice.WinForms/bin -Filter startup-error.log -File -Recurse | Select-Object -First 1
            if ($startupLog) { Get-Content $startupLog.FullName | Write-Error }
            throw "WinForms startup smoke test failed"
          }

      - name: Run core parity tests
        run: dotnet run --project tests/CYInvoice.Core.Tests/CYInvoice.Core.Tests.csproj -c Release --no-build

      - name: Build Windows x64 package
        run: ./scripts/build.ps1 -Version $env:CYINVOICE_VERSION -Build $env:CYINVOICE_BUILD -Engineering

      - name: Verify PE structure and package layout
        run: |
          ./scripts/verify-pe.ps1 -Path ./dist/CYInvoice/CYInvoice.exe
          ./scripts/verify-package.ps1 -Path ("./dist/CYInvoice_V{0}.zip" -f $env:CYINVOICE_ARTIFACT_VERSION) -Version $env:CYINVOICE_VERSION -Build $env:CYINVOICE_BUILD -Channel engineering

      - name: Smoke test packaged portable folder
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP ("cyinvoice-package-smoke-" + [guid]::NewGuid().ToString("N"))
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = (Resolve-Path ("./dist/CYInvoice_V{0}.zip" -f $env:CYINVOICE_ARTIFACT_VERSION)).Path
          [System.IO.Compression.ZipFile]::ExtractToDirectory($zipPath, $smokeRoot)
          try {
            & (Join-Path $smokeRoot "CYInvoice/CYInvoice.exe") --startup-smoke-test
            if ($LASTEXITCODE -ne 0) { throw "Packaged CYInvoice startup smoke test failed" }
          }
          finally { Remove-Item $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue }

      - name: Upload failed package for diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: CYInvoice-V${{ env.CYINVOICE_ARTIFACT_VERSION }}-diagnostic
          path: apps/CYInvoice/dist/CYInvoice_V${{ env.CYINVOICE_ARTIFACT_VERSION }}.zip
          retention-days: 1
          if-no-files-found: error

      - name: Prepare one-layer engineering artifact
        run: |
          $artifactRoot = "./dist/engineering-artifact"
          New-Item -Path $artifactRoot -ItemType Directory -Force | Out-Null
          Copy-Item -Path "./dist/CYInvoice" -Destination $artifactRoot -Recurse
          if (!(Test-Path "$artifactRoot/CYInvoice/CYInvoice.exe" -PathType Leaf)) { throw "Engineering artifact is missing CYInvoice.exe" }

      - name: Upload engineering artifact
        uses: actions/upload-artifact@v7
        with:
          name: CYInvoice_V${{ env.CYINVOICE_ARTIFACT_VERSION }}_engineering-run${{ github.run_number }}
          path: apps/CYInvoice/dist/engineering-artifact/
          if-no-files-found: error
          retention-days: 14
