name: CYAccounting UI Refinement Pass 4 (one-time)

on:
  push:
    branches:
      - cyaccounting/v1.2.0-visual-phase1
    paths:
      - .github/workflows/cyaccounting-ui-refinement-pass4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cyaccounting/v1.2.0-visual-phase1
          fetch-depth: 0

      - name: Apply guarded UI refinement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('apps/CYAccounting')

          def replace_exact(path: Path, old: str, new: str, expected: int = 1):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          main = root / 'app/main.py'
          replacements = [
              ('        basic = QGroupBox()\n', '        basic = QGroupBox("基本資訊")\n'),
              ('        basic_title = QLabel("基本資訊")\n        basic_title.setObjectName("sectionTitle")\n        basic_v.addWidget(basic_title)\n', ''),
              ('        income = QGroupBox()\n', '        income = QGroupBox("收入")\n'),
              ('        income_title = QLabel("收入")\n        income_title.setObjectName("sectionTitle")\n        income_v.addWidget(income_title)\n', ''),
              ('        expense = QGroupBox()\n', '        expense = QGroupBox("支出")\n'),
              ('        expense_title = QLabel("支出")\n        expense_title.setObjectName("sectionTitle")\n        expense_v.addWidget(expense_title)\n', ''),
              ('        confirm = QGroupBox()\n', '        confirm = QGroupBox("輸入確認")\n'),
              ('        confirm_title = QLabel("輸入確認")\n        confirm_title.setObjectName("sectionTitle")\n        cv.addWidget(confirm_title)\n        cv.addSpacing(4)\n', ''),
          ]
          for old, new in replacements:
              replace_exact(main, old, new)

          theme = root / 'app/theme.py'
          old_sections = '''QGroupBox#confirmationCard, QGroupBox#inputSection, QGroupBox#incomeSection, QGroupBox#expenseSection {{
              border: 1px solid {NEUTRAL_BORDER};
              border-radius: 6px;
              margin-top: 0;
              padding: 0;
          }}
          QGroupBox#confirmationCard, QGroupBox#inputSection {{
              background: {NEUTRAL_WINDOW};
          }}
          QGroupBox#incomeSection {{
              background: #E7F3E9;
              border-color: #C7DCCB;
          }}
          QGroupBox#expenseSection {{
              background: #F8E9E7;
              border-color: #E7CECA;
          }}
          QLabel#sectionTitle {{
              background: transparent;
              color: {TEXT_PRIMARY};
              font-size: 11.5pt;
              font-weight: 600;
          }}
          '''
          new_sections = '''QGroupBox#confirmationCard, QGroupBox#inputSection, QGroupBox#incomeSection, QGroupBox#expenseSection {{
              border: 1px solid {NEUTRAL_BORDER};
              border-radius: 6px;
              margin-top: 10px;
              padding: 0;
              background: {NEUTRAL_WHITE};
          }}
          QGroupBox#confirmationCard::title, QGroupBox#inputSection::title, QGroupBox#incomeSection::title, QGroupBox#expenseSection::title {{
              subcontrol-origin: margin;
              subcontrol-position: top left;
              left: 10px;
              padding: 0 5px;
              background: {NEUTRAL_WHITE};
              color: {TEXT_PRIMARY};
              font-size: 11.5pt;
              font-weight: 600;
          }}
          '''
          replace_exact(theme, old_sections, new_sections)

          old_input_combo = '''QWidget#inputPage QLineEdit, QWidget#inputPage QComboBox {{
              min-height: 30px;
              font-size: 11pt;
          }}
          QWidget#inputPage QComboBox {{
              padding-right: 34px;
          }}
          QWidget#inputPage QComboBox::drop-down {{
              subcontrol-origin: padding;
              subcontrol-position: top right;
              width: 30px;
              border-left: 1px solid #AEB9C5;
              background: #F1F4F7;
              border-top-right-radius: 4px;
              border-bottom-right-radius: 4px;
          }}
          QWidget#inputPage QComboBox::drop-down:hover {{
              background: #E0E7EE;
          }}
          QWidget#inputPage QComboBox::down-arrow {{
              image: url("{COMBO_ARROW_PATH}");
              width: 14px;
              height: 9px;
          }}
          '''
          new_input_combo = '''QWidget#inputPage QLineEdit, QWidget#inputPage QComboBox {{
              min-height: 30px;
              font-size: 11pt;
          }}
          '''
          replace_exact(theme, old_input_combo, new_input_combo)

          old_controls = '''QLineEdit, QComboBox, QSpinBox, QDateEdit {{
              border: 1px solid {NEUTRAL_BORDER};
              border-radius: 4px;
              padding: 4px 7px;
              background: {NEUTRAL_WHITE};
              color: {TEXT_PRIMARY};
              selection-background-color: {ACCENT_SOFT};
              selection-color: {TEXT_PRIMARY};
          }}
          '''
          new_controls = '''QLineEdit, QComboBox, QSpinBox, QDateEdit {{
              border: 1px solid {NEUTRAL_BORDER};
              border-radius: 4px;
              padding: 4px 7px;
              background: {NEUTRAL_WHITE};
              color: {TEXT_PRIMARY};
              selection-background-color: {ACCENT_SOFT};
              selection-color: {TEXT_PRIMARY};
          }}
          QComboBox {{
              padding-right: 34px;
          }}
          QComboBox::drop-down {{
              subcontrol-origin: padding;
              subcontrol-position: top right;
              width: 30px;
              border-left: 1px solid #AEB9C5;
              background: #F1F4F7;
              border-top-right-radius: 4px;
              border-bottom-right-radius: 4px;
          }}
          QComboBox::drop-down:hover {{
              background: #E0E7EE;
          }}
          QComboBox::drop-down:disabled {{
              background: {NEUTRAL_READ_ONLY};
              border-left-color: {NEUTRAL_BORDER};
          }}
          QComboBox::down-arrow {{
              image: url("{COMBO_ARROW_PATH}");
              width: 14px;
              height: 9px;
          }}
          '''
          replace_exact(theme, old_controls, new_controls)

          replace_exact(
              theme,
              '''QFrame#pageContainer {{
              border: 0;
              background: {NEUTRAL_WINDOW};
          }}
          ''',
              '''QFrame#pageContainer {{
              border: 1px solid {NEUTRAL_BORDER};
              border-radius: 6px;
              background: {NEUTRAL_WINDOW};
          }}
          ''',
          )

          widgets = root / 'app/widgets.py'
          replace_exact(
              widgets,
              'from theme import CALENDAR_STYLE, CATEGORY_POPUP_STYLE\n',
              'from theme import CALENDAR_STYLE, CATEGORY_POPUP_STYLE, COMBO_ARROW_PATH\n',
          )
          old_inline = '''        elif isinstance(editor, QComboBox):
              editor.setStyleSheet(
                  "QComboBox { font-size: 9pt; min-height: 0px; padding: 0px 13px 0px 3px; "
                  "border-radius: 0px; } "
                  "QComboBox::drop-down { subcontrol-origin: padding; subcontrol-position: top right; "
                  "width: 12px; border-left: 1px solid #aeb9c5; background:#f1f4f7; } "
                  "QComboBox::down-arrow { width: 8px; height: 6px; } "
                  "QComboBox QAbstractItemView { font-size: 9pt; }"
              )
          '''
          new_inline = '''        elif isinstance(editor, QComboBox):
              editor.setStyleSheet(
                  f"QComboBox {{ font-size: 9pt; min-height: 0px; padding: 0px 13px 0px 3px; "
                  "border-radius: 0px; } "
                  "QComboBox::drop-down { subcontrol-origin: padding; subcontrol-position: top right; "
                  "width: 12px; border-left: 1px solid #aeb9c5; background:#f1f4f7; } "
                  f"QComboBox::down-arrow {{ image: url(\\\"{COMBO_ARROW_PATH}\\\"); width: 8px; height: 6px; }} "
                  "QComboBox QAbstractItemView { font-size: 9pt; }"
              )
          '''
          replace_exact(widgets, old_inline, new_inline)

          build = root / 'BUILD'
          current_build = build.read_text(encoding='utf-8').strip()
          if current_build != '0':
              raise SystemExit(f'Unexpected BUILD value: {current_build}')
          build.write_text('1\n', encoding='utf-8')

          notes = root / 'V1.2.0.txt'
          text = notes.read_text(encoding='utf-8')
          text = text.replace('Version: V1.2.0\nDate:', 'Version: V1.2.0\nBuild: 1\nDate:', 1)
          text = text.replace(
              '- Basic Information, Income and Expense remain clearly framed sections; Income uses the CYAccountingWeb soft green #E7F3E9 and Expense uses soft red #F8E9E7.\n',
              '- Basic Information, Income, Expense and Input Confirmation use a consistent white framed section treatment; income/expense background tinting was removed after Windows real-machine review.\n',
              1,
          )
          text = text.replace(
              '- Input-page category ComboBoxes retain the polished separate drop-down area and existing combo-arrow asset; other ComboBoxes keep the newer Phase 1 treatment.\n',
              '- All regular ComboBoxes now share the polished separate drop-down area and the same modern chevron asset; high-density ledger inline ComboBoxes keep their narrow geometry but use the same chevron.\n',
              1,
          )
          text = text.replace(
              '- Main tabs use a lower-presence header treatment with an accent underline; page chrome and decorative borders are reduced.\n',
              '- Main tabs keep the lower-presence accent-underline header treatment, while a thin neutral workspace frame now groups the active page content without restoring the old heavy QTabWidget chrome.\n',
              1,
          )
          text = text.replace(
              '- Phase 1 input refinement: internal section titles replace GroupBox legend labels; Basic Information shares the confirmation neutral fill; income/expense vertical rhythm is fixed at 8px around the dark dashed summary divider; save-button height follows the adjacent amount field; minimum/initial window size is 1120x760; secondary dialogs suppress the app icon while native MessageBox behavior remains unchanged.\n',
              '- Build 1 real-machine refinement: the four input sections return to border-integrated GroupBox titles with white fills; income/expense vertical rhythm remains fixed at 8px around the dark dashed summary divider; save-button height follows the adjacent amount field; minimum/initial window size remains 1120x760; secondary dialogs suppress the app icon while native MessageBox behavior remains unchanged.\n',
              1,
          )
          notes.write_text(text, encoding='utf-8')
          PY

      - name: Validate Python syntax
        shell: bash
        run: python -m compileall -q apps/CYAccounting/app

      - name: Commit final source only
        shell: bash
        run: |
          rm .github/workflows/cyaccounting-ui-refinement-pass4.yml
          git config user.name "simonliu1118-byte"
          git config user.email "286269326+simonliu1118-byte@users.noreply.github.com"
          git add apps/CYAccounting/app/main.py apps/CYAccounting/app/theme.py apps/CYAccounting/app/widgets.py apps/CYAccounting/BUILD apps/CYAccounting/V1.2.0.txt .github/workflows/cyaccounting-ui-refinement-pass4.yml
          git diff --cached --check
          git commit -m "ui(CYAccounting): refine framed workspace and combo boxes"
          git push origin HEAD:cyaccounting/v1.2.0-visual-phase1
