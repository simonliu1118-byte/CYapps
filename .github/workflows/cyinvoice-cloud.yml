name: CYInvoice Cloud Check

on:
  pull_request:
    paths:
      - 'apps/CYInvoice/cloud/**'
      - '.github/workflows/cyinvoice-cloud.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/CYInvoice/cloud/**'
      - '.github/workflows/cyinvoice-cloud.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/CYInvoice/cloud

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/CYInvoice/cloud/package.json

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Type check
        run: npm run check

      - name: Validate Worker bundle
        run: npm run deploy:dry-run

      - name: Validate D1 migration with SQLite
        shell: bash
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path

          sql = Path('migrations/0001_cloud_foundation.sql').read_text(encoding='utf-8')
          db = sqlite3.connect(':memory:')
          db.executescript(sql)
          tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required = {'workspaces', 'devices'}
          missing = required - tables
          if missing:
              raise SystemExit(f'missing tables: {sorted(missing)}')
          print('D1 migration syntax/shape check passed')
          PY
