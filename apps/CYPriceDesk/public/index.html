<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3b4cca"><meta name="robots" content="noindex,nofollow">
  <meta name="description" content="私有的競品價格比較工作臺，集中記錄商品、平台價格與查價時間。">
  <title>價格觀測室 · Price Desk</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233b4cca'/%3E%3Cpath d='M17 43V31M32 43V21M47 43V13' stroke='white' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css"><script type="module" src="/shell.js"></script><script type="module" src="/app.js"></script><script type="module" src="/search.js"></script><script type="module" src="/tracked.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="nav" id="nav">
    <a class="brand" href="#overview"><span class="brand-mark">CY</span><span><span class="brand-name">價格觀測室</span><span class="brand-sub">志遠企業管理系統</span></span></a>
    <div class="nav-groups">
      <div class="nav-group"><span class="nav-label">價格</span>
        <a class="nav-item nav-page active" href="#overview" data-title="比價總覽"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>比價總覽</a>
        <a class="nav-item nav-page" href="#tracked" data-title="追蹤商品"><svg viewBox="0 0 24 24"><path d="M4 21h16M7 17V9m5 8V3m5 14v-5"/></svg>追蹤商品</a>
        <a class="nav-item nav-page" href="#auto-query" data-title="自動查價"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>自動查價</a>
      </div>
      <div class="nav-group"><span class="nav-label">系統</span>
        <button class="nav-item" id="sidebar-audit" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>操作紀錄</button>
      </div>
    </div>
  </aside>
  <div class="backdrop" id="nav-backdrop"></div>
  <div class="workspace">
    <header class="topbar">
      <button class="menu-toggle" id="menu-toggle" type="button" aria-label="開啟選單"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <h1 id="page-title">比價總覽</h1>
      <div class="account topbar-end" id="account">
        <button class="account-trigger" id="account-trigger" type="button" aria-haspopup="menu" aria-expanded="false"><span class="avatar" data-user-avatar></span><strong data-user-name></strong><svg viewBox="0 0 24 24" width="14" height="14"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="account-popover" id="account-popover" role="menu" hidden><form action="/api/auth/logout" method="post"><button type="submit" role="menuitem">登出</button></form></div>
      </div>
    </header>

    <main class="page" id="overview">
      <div id="storage-warning" class="notice error" hidden></div>
      <div id="demo-banner" class="notice" hidden><span>範例模式：以下價格為示意資料，並非平台即時行情。</span><button class="btn small" id="exit-demo" type="button">返回我的資料</button></div>
      <div class="toolbar">
        <div class="toolbar-group"><label class="search"><input id="search" type="search" placeholder="搜尋商品、規格或賣家" aria-label="搜尋商品"></label><select id="platform-filter" aria-label="篩選平台"><option value="">所有平台</option></select><div class="segmented" role="group" aria-label="價格比較基準"><button class="selected" data-basis="price" aria-pressed="true" type="button">商品價格</button><button data-basis="total" aria-pressed="false" type="button">含運總價</button></div></div>
        <div class="toolbar-group"><button class="btn quiet" id="demo-btn" type="button">看看範例</button><button class="btn" id="import-btn" type="button">匯入</button><button class="btn" id="export-btn" type="button">匯出 CSV</button><button class="btn primary" id="add-btn" type="button">新增查價</button></div>
      </div>
      <p class="summary-line" id="stats"></p>
      <div id="groups"><div class="empty"><p>載入價格紀錄中…</p></div></div>
      <p class="muted"><span id="save-status">價格紀錄儲存於雲端，登入者共用</span> · 金額為新臺幣，時間為臺北時間</p>
    </main>

    <main class="page" id="tracked" hidden>
      <section id="tracked-list-view" class="sections">
        <div class="toolbar">
          <div class="toolbar-group"><label class="search"><input id="tr-search" type="search" placeholder="搜尋名稱或型號" aria-label="搜尋追蹤商品"></label><div class="segmented" role="group" aria-label="篩選"><button class="selected" data-tr-filter="all" type="button">全部</button><button data-tr-filter="pending" type="button">有待確認</button><button data-tr-filter="inactive" type="button">已停用</button></div></div>
          <div class="toolbar-group"><button class="btn primary" id="tr-add" type="button">新增追蹤商品</button></div>
        </div>
        <div id="tr-list"></div>
      </section>
      <section id="tracked-detail-view" class="sections" hidden></section>
    </main>

    <main class="page" id="auto-query" hidden>
      <section class="panel" aria-labelledby="aq-title">
        <div class="panel-head"><h2 id="aq-title">查價結果</h2><div class="segmented" role="group" aria-label="查詢來源"><button class="selected" data-source="momo" aria-pressed="true" type="button">momo</button><button data-source="shopee" aria-pressed="false" type="button">飛比蝦皮</button><button data-source="coupang" aria-pressed="false" type="button">飛比酷澎</button></div></div>
        <form id="aq-form" class="aq-form"><label class="search"><input id="aq-keyword" name="keyword" type="search" maxlength="80" required placeholder="關鍵字，例如：羅技 M331" aria-label="搜尋商品關鍵字"></label><select id="aq-sort" aria-label="排序方式"><option value="relevance">相關程度優先</option><option value="asc">價格低到高</option><option value="desc">價格高到低</option></select><button class="btn primary" id="aq-submit" type="submit">查詢價格</button></form>
        <p id="aq-disclaimer" class="notice warning" hidden></p>
        <div id="aq-status" class="aq-status" aria-live="polite"><p class="aq-empty">輸入關鍵字，即可查看搜尋結果。</p></div>
        <div id="aq-results"></div>
        <nav id="aq-pager" class="aq-pager" aria-label="結果分頁" hidden><button class="btn small" id="aq-prev" type="button">上一頁</button><span id="aq-page"></span><button class="btn small" id="aq-next" type="button">下一頁</button></nav>
      </section>
      <section id="aq-analysis" class="panel" hidden>
        <div class="panel-head"><h2>規格與單位價格 <small id="aq-group-count"></small></h2></div>
        <div id="aq-facets" class="aq-facets"></div>
        <p id="aq-count" class="muted"></p>
        <div id="aq-groups"></div>
      </section>
    </main>
  </div>
</div>

<dialog id="offer-dialog" aria-labelledby="offer-dialog-title">
  <form id="offer-form" class="dialog-surface">
    <div class="dialog-header"><h2 id="offer-dialog-title">新增查價</h2><button type="button" class="dialog-close" data-close="offer-dialog" aria-label="關閉">×</button></div>
    <div class="dialog-body">
      <div class="form-grid">
        <label class="wide">商品名稱 <span class="required">*</span><input name="product" id="product-input" required maxlength="200" list="product-suggestions"><datalist id="product-suggestions"></datalist></label>
        <label class="wide">規格／型號<input name="spec" maxlength="200"></label>
        <label class="wide">商品連結<input name="url" id="url-input" type="url" maxlength="2048" placeholder="https://"></label>
        <label>平台 <span class="required">*</span><input name="platform" id="platform-input" list="platform-suggestions" required maxlength="200"><datalist id="platform-suggestions"><option value="蝦皮"><option value="momo"><option value="PChome"><option value="Yahoo"><option value="其他"></datalist></label>
        <label>賣家／通路<input name="seller" maxlength="200"></label>
        <label>商品價格（NT$）<input name="price" id="price-input" type="number" min="0" max="1000000000" step="0.01" placeholder="尚未查價可留白"></label>
        <label>運費（NT$）<input name="shipping" type="number" min="0" max="1000000000" step="0.01" placeholder="免運填 0，未知留白"></label>
        <label class="wide">查價時間（臺北時間）<input name="checkedAt" id="time-input" type="datetime-local"></label>
        <div class="wide"><button class="btn small" type="button" id="set-now">設為現在</button></div>
        <label class="wide">備註<textarea name="note" rows="2" maxlength="1000"></textarea></label>
      </div>
      <div class="form-error" id="offer-error" role="alert" hidden></div>
    </div>
    <div class="dialog-footer"><button class="btn" type="button" data-close="offer-dialog">取消</button><button class="btn primary" type="submit">儲存</button></div>
  </form>
</dialog>

<dialog id="class-dialog" aria-labelledby="class-title">
  <form id="class-form" class="dialog-surface">
    <div class="dialog-header"><h2 id="class-title">人工商品分類</h2><button type="button" class="dialog-close" data-close="class-dialog" aria-label="關閉">×</button></div>
    <div class="dialog-body">
      <p class="muted"><span id="class-source"></span>　<span id="class-listing"></span></p>
      <div class="form-grid">
        <label class="wide">型號<input name="model" maxlength="80" placeholder="例如 1530-0"></label>
        <label>包裝數量<input name="quantity" type="number" min="1" step="any" max="100000"></label>
        <label>單價計算單位<input name="unit" maxlength="20" placeholder="捲、入、盒、g"></label>
        <label class="wide">其他可比較規格（每行「名稱=內容」）<textarea name="attributes" rows="3" placeholder="尺寸=0.5吋"></textarea></label>
        <label class="wide">使用狀態<select name="decision"><option value="include">納入比較</option><option value="exclude">不使用</option></select></label>
      </div>
      <div class="form-error" id="class-error" role="alert" hidden></div>
    </div>
    <div class="dialog-footer"><button class="btn quiet" type="button" id="class-reset">清除人工分類</button><button class="btn" type="button" data-close="class-dialog">取消</button><button class="btn primary" type="submit">儲存</button></div>
  </form>
</dialog>

<dialog id="import-dialog" class="dialog-large" aria-labelledby="import-title">
  <div class="dialog-surface">
    <div class="dialog-header"><h2 id="import-title">匯入查價資料</h2><button class="dialog-close" data-close="import-dialog" aria-label="關閉" type="button">×</button></div>
    <div class="dialog-body">
      <div class="panel-actions"><label class="btn">選擇 CSV 檔<input type="file" id="csv-file" accept=".csv,.tsv,text/csv,text/tab-separated-values" hidden></label><button class="btn quiet" id="sample-csv" type="button">填入格式範例</button></div>
      <label class="paste-label">查價資料<textarea id="paste-input" rows="7" spellcheck="false" placeholder="商品,規格,平台,價格,運費,查價時間,連結,賣家,備註"></textarea></label>
      <p class="hint">標題列至少需含「商品、平台、價格」或「商品、平台、連結」。</p>
      <div id="import-preview" aria-live="polite"></div><div id="import-error" class="form-error" role="alert" hidden></div>
    </div>
    <div class="dialog-footer"><button class="btn" id="preview-btn" type="button">預覽資料</button><button class="btn primary" id="confirm-import" type="button" disabled>確認匯入</button></div>
  </div>
</dialog>

<dialog id="delete-dialog" class="dialog-mini" aria-labelledby="delete-title">
  <div class="dialog-surface">
    <div class="dialog-header"><h2 id="delete-title">刪除此筆查價？</h2><button class="dialog-close" data-close="delete-dialog" aria-label="關閉" type="button">×</button></div>
    <div class="dialog-body"><p id="delete-description"></p></div>
    <div class="dialog-footer"><button class="btn" data-close="delete-dialog" type="button">取消</button><button class="btn danger" id="confirm-delete" type="button">刪除</button></div>
  </div>
</dialog>

<dialog id="audit-dialog" aria-labelledby="audit-title">
  <div class="dialog-surface">
    <div class="dialog-header"><h2 id="audit-title">操作紀錄（最近 50 筆）</h2><button class="dialog-close" data-close="audit-dialog" aria-label="關閉" type="button">×</button></div>
    <div id="audit-body" class="dialog-body" aria-live="polite"></div>
  </div>
</dialog>

<dialog id="tracked-dialog" aria-labelledby="tracked-title">
  <form id="tracked-form" class="dialog-surface">
    <div class="dialog-header"><h2 id="tracked-title">新增追蹤商品</h2><button type="button" class="dialog-close" data-close="tracked-dialog" aria-label="關閉">×</button></div>
    <div class="dialog-body">
      <div class="form-grid">
        <label class="wide">名稱 <span class="required">*</span><input name="name" required maxlength="200"></label>
        <label>型號 <span class="required">*</span><input name="model" required maxlength="80" placeholder="例如 1530-0"></label>
        <label>規格屬性（每行「名稱=內容」）<textarea name="attributes" rows="2" placeholder="尺寸=0.5吋"></textarea></label>
        <label>包裝數量 <span class="required">*</span><input name="packageQuantity" type="number" min="1" step="any" max="100000" required></label>
        <label>包裝單位 <span class="required">*</span><input name="packageUnit" required maxlength="20" placeholder="入、捲、盒"></label>
        <label id="tr-price-field">自己的售價（NT$）<input name="myPrice" type="number" min="0" step="0.01"></label>
        <label>自己的商品連結<input name="myUrl" type="url" maxlength="2048" placeholder="https://"></label>
        <label>momo 查詢關鍵字<input name="momoKeyword" maxlength="80"></label>
        <label>飛比查詢關鍵字<input name="feebeeKeyword" maxlength="80"></label>
        <label class="check wide"><input name="active" type="checkbox" checked>啟用定期查價</label>
      </div>
      <div class="form-error" id="tracked-error" role="alert" hidden></div>
    </div>
    <div class="dialog-footer"><button class="btn" type="button" data-close="tracked-dialog">取消</button><button class="btn primary" type="submit">儲存</button></div>
  </form>
</dialog>

<dialog id="price-dialog" class="dialog-small" aria-labelledby="price-title">
  <form id="price-form" class="dialog-surface">
    <div class="dialog-header"><h2 id="price-title">修改售價</h2><button type="button" class="dialog-close" data-close="price-dialog" aria-label="關閉">×</button></div>
    <div class="dialog-body">
      <div class="form-grid">
        <label class="wide">新售價（NT$）<input name="price" type="number" min="0" step="0.01" required></label>
        <label class="wide">備註<input name="note" maxlength="200"></label>
      </div>
      <div class="form-error" id="price-error" role="alert" hidden></div>
    </div>
    <div class="dialog-footer"><button class="btn" type="button" data-close="price-dialog">取消</button><button class="btn primary" type="submit">儲存</button></div>
  </form>
</dialog>

<dialog id="package-dialog" class="dialog-mini" aria-labelledby="package-title">
  <form id="package-form" class="dialog-surface">
    <div class="dialog-header"><h2 id="package-title">其他包裝</h2><button type="button" class="dialog-close" data-close="package-dialog" aria-label="關閉">×</button></div>
    <div class="dialog-body">
      <div class="form-grid">
        <label class="wide">數量<input name="quantity" type="number" min="1" step="any" max="100000" required></label>
        <label class="wide">單位<input name="unit" required maxlength="20" placeholder="入、捲、盒"></label>
      </div>
      <div class="form-error" id="package-error" role="alert" hidden></div>
    </div>
    <div class="dialog-footer"><button class="btn" type="button" data-close="package-dialog">取消</button><button class="btn primary" type="submit">儲存</button></div>
  </form>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
