name: CYERPAutoInput Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "apps/CYERPAutoInput/**"
      - ".github/workflows/cyerp-auto-input-build.yml"

permissions:
  contents: read

concurrency:
  group: cyerp-auto-input-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/CYERPAutoInput
    steps:
      - uses: actions/checkout@v7

      - name: Read VERSION and BUILD
        shell: pwsh
        run: |
          $version = (Get-Content ./VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid CYERPAutoInput VERSION: $version" }
          $build = (Get-Content ./BUILD -Raw).Trim()
          if ($build -notmatch '^\d+$') { throw "Invalid CYERPAutoInput BUILD: $build" }
          $suffix = ""
          if ([int]$build -gt 0) { $suffix = "-build$build" }
          "CYERPAUTOINPUT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CYERPAUTOINPUT_BUILD=$build" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CYERPAUTOINPUT_ARTIFACT_SUFFIX=$suffix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Fetch canonical CYERPAutoInput icon
        shell: pwsh
        run: ./tools/fetch-canonical-icon.ps1

      - name: Fetch pinned PaddleOCR models
        shell: pwsh
        run: ./tools/fetch-ocr-models.ps1

      - name: Restore
        shell: pwsh
        run: dotnet restore CYERPAutoInput.csproj -r win-x64

      - name: Build
        shell: pwsh
        run: dotnet build CYERPAutoInput.csproj -c Release -r win-x64 --no-restore -p:Version=$env:CYERPAUTOINPUT_VERSION -p:ContinuousIntegrationBuild=true

      - name: Optical pipeline self-test
        shell: pwsh
        run: dotnet run --project CYERPAutoInput.csproj -c Release -r win-x64 --no-build -- --vision-self-test

      - name: Publish Windows x64 portable package
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force package,publish-staging -ErrorAction SilentlyContinue
          $staging = "publish-staging"
          $outDir = Join-Path "package" "CYERPAutoInput"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          dotnet publish CYERPAutoInput.csproj -c Release -r win-x64 --no-restore --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -p:Version=$env:CYERPAUTOINPUT_VERSION -o $staging
          if (-not (Test-Path "$staging/CYERPAutoInput.exe")) { throw "CYERPAutoInput.exe was not produced" }

          Copy-Item "$staging/CYERPAutoInput.exe" "$outDir/CYERPAutoInput.exe"
          Copy-Item VERSION "$outDir/VERSION"
          Copy-Item BUILD "$outDir/BUILD"

          New-Item -ItemType Directory -Path "$outDir/Data" -Force | Out-Null
          Copy-Item settings.example.json "$outDir/Data/settings.example.json"

          New-Item -ItemType Directory -Path "$outDir/docs" -Force | Out-Null
          Copy-Item README.md "$outDir/docs/README.md"
          Copy-Item THIRD_PARTY_NOTICES.md "$outDir/docs/THIRD_PARTY_NOTICES.md"

          New-Item -ItemType Directory -Path "$outDir/runtime/ocr" -Force | Out-Null
          Copy-Item "$staging/runtime/ocr/*.onnx" "$outDir/runtime/ocr/"

      - name: Verify packaged executable and structure
        shell: pwsh
        run: |
          $root = "package/CYERPAutoInput"
          $required = @(
            "$root/CYERPAutoInput.exe",
            "$root/BUILD",
            "$root/VERSION",
            "$root/Data/settings.example.json",
            "$root/docs/README.md",
            "$root/docs/THIRD_PARTY_NOTICES.md",
            "$root/runtime/ocr/ch_PP-OCRv5_det_mobile.onnx",
            "$root/runtime/ocr/ch_PP-OCRv5_rec_mobile.onnx",
            "$root/runtime/ocr/ch_PP-LCNet_x0_25_textline_ori_cls_mobile.onnx"
          )
          foreach ($path in $required) {
            if (!(Test-Path $path)) { throw "Missing packaged file: $path" }
          }

          $unexpected = @(Get-ChildItem -LiteralPath $root -Recurse -File | Where-Object { $_.Extension -in @('.pdb','.lib','.dll') -or $_.Name -match 'SHA256' })
          if ($unexpected.Count -gt 0) {
            throw "Unexpected engineering files in user package: $($unexpected.FullName -join ', ')"
          }

          $roots = @(Get-ChildItem -LiteralPath package -Force)
          if ($roots.Count -ne 1 -or $roots[0].Name -ne "CYERPAutoInput" -or -not $roots[0].PSIsContainer) {
            throw "Download artifact must contain only the CYERPAutoInput/ folder"
          }

          & "$root/CYERPAutoInput.exe" --vision-self-test
          if ($LASTEXITCODE -ne 0) { throw "Packaged EXE vision self-test failed with code $LASTEXITCODE" }
          Remove-Item -Recurse -Force "$root/logs" -ErrorAction SilentlyContinue

      - name: Upload engineering package
        uses: actions/upload-artifact@v7
        with:
          name: CYERPAutoInput-v${{ env.CYERPAUTOINPUT_VERSION }}${{ env.CYERPAUTOINPUT_ARTIFACT_SUFFIX }}-windows-x64-run${{ github.run_number }}
          path: apps/CYERPAutoInput/package/*
          if-no-files-found: error
          retention-days: 14
