name: CYAccounting Visual Migration (one-time)

on:
  push:
    branches:
      - cyaccounting/v1.2.0-visual-phase1
    paths:
      - "apps/CYAccounting/tools/apply_visual_phase1.py"
      - ".github/workflows/cyaccounting-visual-migrate.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore(CYAccounting): add visual migration workflow'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cyaccounting/v1.2.0-visual-phase1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Apply deterministic source migration
        working-directory: apps/CYAccounting
        shell: pwsh
        run: python tools/apply_visual_phase1.py
      - name: Compile transformed Python sources
        working-directory: apps/CYAccounting
        shell: pwsh
        run: python -m compileall -q app tests
      - name: Commit transformed sources
        shell: pwsh
        run: |
          git config user.name "simonliu1118-byte"
          git config user.email "286269326+simonliu1118-byte@users.noreply.github.com"
          git add apps/CYAccounting/app/main.py apps/CYAccounting/app/dialogs.py apps/CYAccounting/app/import_dialog.py apps/CYAccounting/app/widgets.py apps/CYAccounting/app/models.py
          if (git diff --cached --quiet) { throw "Visual migration produced no source changes" }
          git commit -m "style(CYAccounting): align Phase 1 visual system"
          git push origin HEAD:cyaccounting/v1.2.0-visual-phase1
