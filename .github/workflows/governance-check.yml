name: Governance Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate governance structure and common-rules sync
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import pathlib, re, sys

          allowed = [
              re.compile(r'^REPOSITORY_RULES\.md$'),
              re.compile(r'^REPO_POLICY\.md$'),
              re.compile(r'^RULES_INDEX\.md$'),
              re.compile(r'^COMMON_RULES_VERSION$'),
              re.compile(r'^COMMON_RULES_CHANGELOG\.md$'),
              re.compile(r'^GOVERNANCE_VERSION$'),
              re.compile(r'^GOVERNANCE_CHANGELOG\.md$'),
              re.compile(r'^AGENTS\.md$'),
              re.compile(r'^apps/[^/]+/PROJECT_RULES\.md$'),
          ]
          suspicious = re.compile(r'(?i)(rules|policy|instruction|governance|versioning|agents)')

          for path in pathlib.Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              rel = path.as_posix()
              if path.suffix.lower() not in {'.md', '.txt'} and path.name != 'AGENTS.md':
                  continue
              if suspicious.search(path.name) and not any(rx.fullmatch(rel) for rx in allowed):
                  print(f'ERROR: unauthorized/obsolete rules entrypoint: {rel}')
                  sys.exit(1)

          for rel in ['COMMON_RULES_VERSION', 'GOVERNANCE_VERSION']:
              p = pathlib.Path(rel)
              if not p.is_file() or not re.fullmatch(r'\d+\.\d+\.\d+\n?', p.read_text(encoding='utf-8')):
                  print(f'ERROR: {rel} must contain X.Y.Z')
                  sys.exit(1)

          provider_root = pathlib.Path('apps/CYCloudIdentity')
          current_path = provider_root / 'CONSUMER_CONTRACT_VERSION'
          minimum_path = provider_root / 'CONSUMER_MIN_COMPATIBLE_VERSION'
          standard_path = provider_root / 'docs/CONSUMER_INTEGRATION_STANDARD.md'
          changelog_path = provider_root / 'docs/CONSUMER_CONTRACT_CHANGELOG.md'
          for p in [current_path, minimum_path, standard_path, changelog_path]:
              if not p.is_file():
                  print(f'ERROR: missing CYID consumer contract file: {p.as_posix()}')
                  sys.exit(1)

          def semver(text: str):
              value = text.strip()
              if not re.fullmatch(r'\d+\.\d+\.\d+', value):
                  raise ValueError(value)
              return tuple(int(x) for x in value.split('.'))

          try:
              consumer_current = semver(current_path.read_text(encoding='utf-8'))
              consumer_min = semver(minimum_path.read_text(encoding='utf-8'))
          except ValueError as exc:
              print(f'ERROR: invalid CYID consumer contract version: {exc}')
              sys.exit(1)
          if consumer_min > consumer_current:
              print('ERROR: CYID minimum compatible consumer version exceeds current contract version')
              sys.exit(1)

          standard_text = standard_path.read_text(encoding='utf-8')
          current_text = '.'.join(str(x) for x in consumer_current)
          minimum_text = '.'.join(str(x) for x in consumer_min)
          if f'Contract version:** `{current_text}`' not in standard_text:
              print('ERROR: CYID consumer standard header does not match CONSUMER_CONTRACT_VERSION')
              sys.exit(1)
          if f'Minimum compatible consumer version:** `{minimum_text}`' not in standard_text:
              print('ERROR: CYID consumer standard header does not match CONSUMER_MIN_COMPATIBLE_VERSION')
              sys.exit(1)

          for marker_path in sorted(pathlib.Path('apps').glob('*/CYID_CONSUMER_VERSION')):
              try:
                  adopted = semver(marker_path.read_text(encoding='utf-8'))
              except ValueError as exc:
                  print(f'ERROR: invalid {marker_path.as_posix()}: {exc}')
                  sys.exit(1)
              if adopted < consumer_min or adopted > consumer_current:
                  print(
                      f'ERROR: {marker_path.as_posix()}={marker_path.read_text().strip()} '
                      f'is outside CYID supported consumer window {minimum_text}..{current_text}'
                  )
                  sys.exit(1)
              project_rules = marker_path.parent / 'PROJECT_RULES.md'
              if not project_rules.is_file() or 'CONSUMER_INTEGRATION_STANDARD.md' not in project_rules.read_text(encoding='utf-8'):
                  print(f'ERROR: {marker_path.parent.as_posix()} declares CYID_CONSUMER_VERSION but PROJECT_RULES does not adopt the CYID consumer standard')
                  sys.exit(1)

          required_root = [
              'REPOSITORY_RULES.md','REPO_POLICY.md','RULES_INDEX.md',
              'COMMON_RULES_CHANGELOG.md','GOVERNANCE_CHANGELOG.md','AGENTS.md'
          ]
          for rel in required_root:
              if not pathlib.Path(rel).is_file():
                  print(f'ERROR: missing governance file: {rel}')
                  sys.exit(1)

          scanner = pathlib.Path('.github/scripts/scan-public-package.py')
          if not scanner.is_file():
              print('ERROR: missing public artifact safety scanner')
              sys.exit(1)

          for workflow in sorted(pathlib.Path('.github/workflows').glob('*.yml')):
              text = workflow.read_text(encoding='utf-8')
              publishes = 'actions/upload-artifact@' in text or 'gh release create' in text
              if publishes and 'scan-public-package.py' not in text:
                  print(f'ERROR: public Artifact/Release workflow lacks safety scan: {workflow.as_posix()}')
                  sys.exit(1)

          apps = pathlib.Path('apps')
          if apps.is_dir():
              for project in sorted(p for p in apps.iterdir() if p.is_dir()):
                  for filename in ['PROJECT_RULES.md', 'VERSION', 'BUILD']:
                      if not (project / filename).is_file():
                          print(f'ERROR: active project lacks {filename}: {project.as_posix()}')
                          sys.exit(1)
                  version = (project / 'VERSION').read_text(encoding='utf-8').strip()
                  build = (project / 'BUILD').read_text(encoding='utf-8').strip()
                  if not re.fullmatch(r'\d+\.\d+\.\d+', version):
                      print(f'ERROR: invalid VERSION in {project.as_posix()}: {version!r}')
                      sys.exit(1)
                  if not re.fullmatch(r'\d+', build):
                      print(f'ERROR: invalid BUILD in {project.as_posix()}: {build!r}')
                      sys.exit(1)
          print('Local governance structure OK')
          PY

          scan_tmp="$(mktemp -d)"
          printf '%s\n' 'CLOUDFLARE_API_TOKEN=__DEPLOYMENT_SECRET__' > "$scan_tmp/safe.txt"
          python3 .github/scripts/scan-public-package.py "$scan_tmp/safe.txt"
          printf '%s\n' 'CLOUDFLARE_API_TOKEN=abcdefghijklmnopqrstuvwxyz123456' > "$scan_tmp/bad.txt"
          if python3 .github/scripts/scan-public-package.py "$scan_tmp/bad.txt" >/dev/null 2>&1; then
            echo "ERROR: public artifact safety scanner failed its blocking self-test"
            exit 1
          fi
          python3 .github/scripts/test-public-package-scan.py
          rm -rf "$scan_tmp"
          echo "Public artifact safety scanner self-test OK."

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          base='https://raw.githubusercontent.com/simonliu1118-byte/AITeam/main'
          for file in REPOSITORY_RULES.md COMMON_RULES_VERSION COMMON_RULES_CHANGELOG.md; do
            curl --fail --silent --show-error --location --retry 3 "$base/$file" -o "$tmp/$file"
            cmp --silent "$file" "$tmp/$file" || {
              echo "ERROR: $file is not synchronized with AITeam main. Run/merge common-rules sync first."
              exit 1
            }
          done
          echo "Common rules match AITeam main."

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "main:refs/remotes/origin/main"
            mapfile -t changed < <(git diff --name-only "origin/main...HEAD")

            common_changed=0
            common_rules_changed=0
            common_version_changed=0
            common_changelog_changed=0
            repo_gov_changed=0
            gov_version_changed=0
            gov_changelog_changed=0
            cyid_changed=0
            consumer_standard_changed=0
            consumer_version_changed=0
            consumer_min_changed=0
            consumer_min_existed=0
            consumer_changelog_changed=0

            if git cat-file -e "origin/main:apps/CYCloudIdentity/CONSUMER_MIN_COMPATIBLE_VERSION" 2>/dev/null; then
              consumer_min_existed=1
            fi

            for path in "${changed[@]}"; do
              case "$path" in
                REPOSITORY_RULES.md|COMMON_RULES_VERSION|COMMON_RULES_CHANGELOG.md)
                  common_changed=1 ;;
              esac
              [ "$path" = "REPOSITORY_RULES.md" ] && common_rules_changed=1
              [ "$path" = "COMMON_RULES_VERSION" ] && common_version_changed=1
              [ "$path" = "COMMON_RULES_CHANGELOG.md" ] && common_changelog_changed=1

              case "$path" in
                REPO_POLICY.md|RULES_INDEX.md|GOVERNANCE_VERSION|GOVERNANCE_CHANGELOG.md|AGENTS.md|apps/*/PROJECT_RULES.md|.github/workflows/governance-check.yml|.github/workflows/sync-common-rules.yml|.github/scripts/scan-public-package.py|.github/scripts/test-public-package-scan.py)
                  repo_gov_changed=1 ;;
              esac
              [ "$path" = "GOVERNANCE_VERSION" ] && gov_version_changed=1
              [ "$path" = "GOVERNANCE_CHANGELOG.md" ] && gov_changelog_changed=1

              case "$path" in
                apps/CYCloudIdentity/*) cyid_changed=1 ;;
              esac
              [ "$path" = "apps/CYCloudIdentity/docs/CONSUMER_INTEGRATION_STANDARD.md" ] && consumer_standard_changed=1
              [ "$path" = "apps/CYCloudIdentity/CONSUMER_CONTRACT_VERSION" ] && consumer_version_changed=1
              [ "$path" = "apps/CYCloudIdentity/CONSUMER_MIN_COMPATIBLE_VERSION" ] && consumer_min_changed=1
              [ "$path" = "apps/CYCloudIdentity/docs/CONSUMER_CONTRACT_CHANGELOG.md" ] && consumer_changelog_changed=1
            done

            if [ "$common_changed" -eq 1 ]; then
              case "$HEAD_REF" in
                governance/*) ;;
                *) echo "ERROR: common rules may only change through governance/*"; exit 1 ;;
              esac
              [ "$common_rules_changed" -eq 1 ] || { echo "ERROR: common-rules sync must update REPOSITORY_RULES.md"; exit 1; }
              [ "$common_version_changed" -eq 1 ] || { echo "ERROR: common-rules sync must update COMMON_RULES_VERSION"; exit 1; }
              [ "$common_changelog_changed" -eq 1 ] || { echo "ERROR: common-rules sync must update COMMON_RULES_CHANGELOG.md"; exit 1; }
            fi

            if [ "$repo_gov_changed" -eq 1 ]; then
              case "$HEAD_REF" in
                governance/*) ;;
                *) echo "ERROR: repository governance changes require governance/*"; exit 1 ;;
              esac
              [ "$gov_version_changed" -eq 1 ] || { echo "ERROR: repository governance change must update GOVERNANCE_VERSION"; exit 1; }
              [ "$gov_changelog_changed" -eq 1 ] || { echo "ERROR: repository governance change must update GOVERNANCE_CHANGELOG.md"; exit 1; }
            fi

            if [ "$cyid_changed" -eq 1 ]; then
              impact="$(printf '%s' "$PR_BODY" | sed -nE 's/.*CYID Consumer Impact:[[:space:]]*(NONE|BACKWARD_COMPATIBLE|CONSUMER_UPDATE_REQUIRED).*/\1/p' | head -n 1)"
              case "$impact" in
                NONE|BACKWARD_COMPATIBLE|CONSUMER_UPDATE_REQUIRED) ;;
                *)
                  echo "ERROR: CYID PR must declare 'CYID Consumer Impact: NONE|BACKWARD_COMPATIBLE|CONSUMER_UPDATE_REQUIRED' in the PR body"
                  exit 1
                  ;;
              esac

              if [ "$impact" = "NONE" ]; then
                if [ "$consumer_version_changed" -eq 1 ] || [ "$consumer_min_changed" -eq 1 ]; then
                  echo "ERROR: CYID Consumer Impact NONE cannot change consumer compatibility versions"
                  exit 1
                fi
              else
                [ "$consumer_standard_changed" -eq 1 ] || { echo "ERROR: consumer-visible CYID change must update CONSUMER_INTEGRATION_STANDARD.md"; exit 1; }
                [ "$consumer_version_changed" -eq 1 ] || { echo "ERROR: consumer-visible CYID change must update CONSUMER_CONTRACT_VERSION"; exit 1; }
                [ "$consumer_changelog_changed" -eq 1 ] || { echo "ERROR: consumer-visible CYID change must update CONSUMER_CONTRACT_CHANGELOG.md"; exit 1; }
              fi

              if [ "$consumer_min_changed" -eq 1 ] && [ "$consumer_min_existed" -eq 1 ] && [ "$impact" != "CONSUMER_UPDATE_REQUIRED" ]; then
                echo "ERROR: changing an established minimum compatible consumer version requires CYID Consumer Impact CONSUMER_UPDATE_REQUIRED"
                exit 1
              fi
            fi
          fi

          echo "Governance Check passed."
