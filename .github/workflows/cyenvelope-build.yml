name: CYEnvelope WPF Check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "apps/CYEnvelope/**"
      - ".github/workflows/cyenvelope-build.yml"

permissions:
  contents: read

concurrency:
  group: cyenvelope-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/CYEnvelope
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Validate version identity
        shell: pwsh
        run: |
          $version = (Get-Content ./VERSION -Raw).Trim()
          $build = (Get-Content ./BUILD -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $build -notmatch '^\d+$') {
            throw "Invalid CYEnvelope VERSION/BUILD: $version / $build"
          }

      - name: Build Windows application
        shell: pwsh
        run: dotnet build ./src/CYEnvelope/CYEnvelope.csproj -c Release --nologo -warnaserror

      - name: Run Windows core checks
        shell: pwsh
        run: dotnet run --project ./tests/CYEnvelope.Tests/CYEnvelope.Tests.csproj -c Release --nologo

      - name: Startup smoke
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) 'src/CYEnvelope/bin/Release/net10.0-windows/CYEnvelope.exe'
          $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          try {
            Start-Sleep -Seconds 4
            $proc.Refresh()
            if ($proc.HasExited) { throw "CYEnvelope exited during startup with code $($proc.ExitCode)" }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
