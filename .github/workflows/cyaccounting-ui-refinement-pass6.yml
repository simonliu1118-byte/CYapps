name: CYAccounting UI Refinement Pass 6 (one-time)

on:
  push:
    branches:
      - cyaccounting/v1.2.0-visual-phase1
    paths:
      - .github/workflows/cyaccounting-ui-refinement-pass6.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cyaccounting/v1.2.0-visual-phase1
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Apply guarded Build 3 refinement
        working-directory: apps/CYAccounting
        shell: pwsh
        run: |
          python tools/refine_ui_build3.py
          if ($LASTEXITCODE -ne 0) { throw "Build 3 visual refinement failed" }

      - name: Validate transformed source
        shell: pwsh
        run: |
          python -m compileall -q apps/CYAccounting/app apps/CYAccounting/tests
          if ((Get-Content apps/CYAccounting/BUILD -Raw).Trim() -ne "3") { throw "BUILD is not 3" }
          Select-String -Path apps/CYAccounting/app/main.py -Pattern 'self.setMinimumSize\(1120, 710\)' -Quiet | Out-Null
          Select-String -Path apps/CYAccounting/app/main.py -Pattern '_blank_dialog_hicon' -Quiet | Out-Null
          Select-String -Path apps/CYAccounting/app/theme.py -Pattern 'font-weight: 700' -Quiet | Out-Null

      - name: Commit Build 3 source
        shell: pwsh
        run: |
          git config user.name "simonliu1118-byte"
          git config user.email "286269326+simonliu1118-byte@users.noreply.github.com"
          git add apps/CYAccounting/app/main.py apps/CYAccounting/app/theme.py apps/CYAccounting/tests/test_app.py apps/CYAccounting/BUILD apps/CYAccounting/V1.2.0.txt
          git rm apps/CYAccounting/tools/refine_ui_build3.py
          git diff --cached --check
          if (git diff --cached --quiet) { throw "No Build 3 source changes staged" }
          git commit -m "ui(CYAccounting): refine Build 3 legends and dialog chrome"
          git push origin HEAD:cyaccounting/v1.2.0-visual-phase1
