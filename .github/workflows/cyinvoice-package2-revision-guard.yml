name: CYInvoice Package 2 Revision Guard

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'cyinvoice/fix-cloud-authority-freshness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Add monotonic authority snapshot guard and regression test
        shell: python
        run: |
          from pathlib import Path

          cache = Path('apps/CYInvoice/src/CYInvoice.Core/CloudEmployeeCacheStore.cs')
          text = cache.read_text(encoding='utf-8')
          old = '''            using var transaction = connection.BeginTransaction();\n\n            using (var clear = connection.CreateCommand())'''
          new = '''            using var transaction = connection.BeginTransaction();\n\n            using (var currentState = connection.CreateCommand())\n            {\n                currentState.Transaction = transaction;\n                currentState.CommandText = \"SELECT workspace_id, workspace_revision FROM cloud_employee_cache_state WHERE singleton_id = 1;\";\n                using var reader = currentState.ExecuteReader();\n                if (reader.Read()\n                    && string.Equals(reader.GetString(0), workspaceId, StringComparison.Ordinal)\n                    && reader.GetInt32(1) > workspaceRevision)\n                {\n                    transaction.Rollback();\n                    return;\n                }\n            }\n\n            using (var clear = connection.CreateCommand())'''
          if text.count(old) != 1:
              raise SystemExit(f'cache insertion point expected once, found {text.count(old)}')
          cache.write_text(text.replace(old, new), encoding='utf-8')

          tests = Path('apps/CYInvoice/tests/CYInvoice.Cloud.Tests/IdentityProviderFreshnessTests.cs')
          text = tests.read_text(encoding='utf-8')
          old_run = '''        await ExplicitAuthorityRefreshUpdatesProtectedCacheAsync();\n        await TransportFailureUsesTrustedCacheAsync();'''
          new_run = '''        await ExplicitAuthorityRefreshUpdatesProtectedCacheAsync();\n        await OlderConcurrentSnapshotCannotRollBackNewerAuthorityAsync();\n        await TransportFailureUsesTrustedCacheAsync();'''
          if text.count(old_run) != 1:
              raise SystemExit('freshness RunAsync insertion point changed')
          text = text.replace(old_run, new_run)

          marker = '''    private static async Task TransportFailureUsesTrustedCacheAsync()\n    {'''
          method = '''    private static async Task OlderConcurrentSnapshotCannotRollBackNewerAuthorityAsync()\n    {\n        using var context = FreshnessContext.Create(\n            Seed(\"emp_user\", \"0002\", \"Existing User\", \"existing@example.test\", EmployeeRoles.Admin, \"NewestPass2\", 4, 20));\n        context.Cache.ReplaceSnapshot(\n            \"ws_test\",\n            50,\n            new[]\n            {\n                Seed(\"emp_super\", \"0001\", \"Cloud Admin\", \"admin@example.test\", EmployeeRoles.SuperAdmin, \"AdminPass1\", 1, 1),\n                Seed(\"emp_user\", \"0002\", \"Existing User\", \"existing@example.test\", EmployeeRoles.Admin, \"NewestPass2\", 4, 20),\n            });\n        context.Handler.EnqueueSnapshot(\n            49,\n            Seed(\"emp_user\", \"0002\", \"Existing User\", \"existing@example.test\", EmployeeRoles.User, \"OlderPass2\", 3, 19));\n\n        var principal = await context.Provider.AuthenticateAsync(\n            new IdentityAuthenticationRequest(\"0002\", \"NewestPass2\"));\n\n        NotNull(principal, \"an older concurrent response must not roll back a newer trusted cache\");\n        Equal(AppRole.Admin, principal!.Role, \"newer cached role must win over an older response\");\n        Equal(50, context.Cache.LoadState()?.WorkspaceRevision ?? -1,\n            \"older concurrent response must not reduce Workspace authority revision\");\n        True(await AuthenticateCachedAsync(context.Cache, \"0002\", \"OlderPass2\") is null,\n            \"older credential verifier must not replace newer cached credentials\");\n    }\n\n    private static Task<CloudEmployeeCachedAccount?> AuthenticateCachedAsync(\n        CloudEmployeeCacheStore cache,\n        string employeeNo,\n        string password) =>\n        Task.FromResult(cache.Authenticate(employeeNo, password));\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('transport test marker changed')
          text = text.replace(marker, method + marker)
          tests.write_text(text, encoding='utf-8')

          Path('.github/workflows/cyinvoice-package2-revision-guard.yml').unlink()
      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'reader.GetInt32(1) > workspaceRevision' apps/CYInvoice/src/CYInvoice.Core/CloudEmployeeCacheStore.cs
          grep -q 'OlderConcurrentSnapshotCannotRollBackNewerAuthorityAsync' apps/CYInvoice/tests/CYInvoice.Cloud.Tests/IdentityProviderFreshnessTests.cs
      - name: Commit revision guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/CYInvoice/src/CYInvoice.Core/CloudEmployeeCacheStore.cs apps/CYInvoice/tests/CYInvoice.Cloud.Tests/IdentityProviderFreshnessTests.cs .github/workflows/cyinvoice-package2-revision-guard.yml
          git commit -m 'fix(CYInvoice): prevent Cloud authority snapshot rollback'
          git push origin HEAD:${{ github.head_ref }}
