name: CYCloud Identity Development Deploy

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/CYCloudIdentity/**"
      - ".github/workflows/cycloudidentity-deploy.yml"
  workflow_dispatch:
  push:
    branches:
      - deploy/cycloudidentity-development

permissions:
  contents: read

concurrency:
  group: cycloudidentity-deploy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/CYCloudIdentity

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Scan public source
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/scan-public-package.py apps/CYCloudIdentity

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Type-check Worker
        run: npm run check

      - name: Run auth-core tests
        run: npm test

      - name: Render CI-only Cloudflare config
        env:
          CYID_WORKER_NAME: cycloud-identity-ci
          CYID_D1_DATABASE_NAME: cycloud_identity_ci
          CYID_D1_DATABASE_ID: 11111111-1111-4111-8111-111111111111
          CYID_LOGIN_RATE_LIMIT_NAMESPACE_ID: "900101"
          CYID_SESSION_TTL_SECONDS: "3600"
          CYID_EMAIL_PROVIDER: brevo
          CYID_EMAIL_FROM: Identity Test <identity@example.test>
          CYID_EMAIL_DAILY_BUDGET: "50"
          CYID_CORE_ACCOUNT_APPLICATION_ID: APP_TEST_LOGIN
          CYID_ACCOUNT_PORTAL_URL: https://portal.example.test/
        run: node scripts/render-deploy-config.mjs --output wrangler.ci.generated.jsonc

      - name: Validate migrations locally
        run: npx wrangler d1 migrations apply DB --local --persist-to /tmp/cycloudidentity-ci-d1 --config wrangler.ci.generated.jsonc

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.ci.generated.jsonc

      - name: Remove generated config
        if: always()
        run: rm -f wrangler.ci.generated.jsonc

  deploy-development:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/deploy/cycloudidentity-development')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    defaults:
      run:
        working-directory: apps/CYCloudIdentity

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CYID_WORKER_NAME: ${{ vars.CYID_WORKER_NAME }}
      CYID_D1_DATABASE_NAME: ${{ vars.CYID_D1_DATABASE_NAME }}
      CYID_D1_DATABASE_ID: ${{ vars.CYID_D1_DATABASE_ID }}
      CYID_LOGIN_RATE_LIMIT_NAMESPACE_ID: ${{ vars.CYID_LOGIN_RATE_LIMIT_NAMESPACE_ID }}
      CYID_SESSION_TTL_SECONDS: ${{ vars.CYID_SESSION_TTL_SECONDS }}
      CYID_EMAIL_PROVIDER: ${{ vars.CYID_EMAIL_PROVIDER }}
      CYID_EMAIL_FROM: ${{ vars.CYID_EMAIL_FROM }}
      CYID_EMAIL_DAILY_BUDGET: ${{ vars.CYID_EMAIL_DAILY_BUDGET }}
      CYID_CORE_ACCOUNT_APPLICATION_ID: ${{ vars.CYID_CORE_ACCOUNT_APPLICATION_ID }}
      CYID_ACCOUNT_PORTAL_URL: ${{ vars.CYID_ACCOUNT_PORTAL_URL }}
      CYID_BREVO_API_KEY: ${{ secrets.CYID_BREVO_API_KEY }}
      CYID_RESEND_API_KEY: ${{ secrets.CYID_RESEND_API_KEY }}
      CYID_OTP_PEPPER: ${{ secrets.CYID_OTP_PEPPER }}
      CYID_BOOTSTRAP_SECRET: ${{ secrets.CYID_BOOTSTRAP_SECRET }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install development dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Verify deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
            CYID_WORKER_NAME CYID_D1_DATABASE_NAME CYID_D1_DATABASE_ID
            CYID_LOGIN_RATE_LIMIT_NAMESPACE_ID CYID_SESSION_TTL_SECONDS
            CYID_EMAIL_PROVIDER CYID_EMAIL_FROM CYID_EMAIL_DAILY_BUDGET
            CYID_CORE_ACCOUNT_APPLICATION_ID CYID_ACCOUNT_PORTAL_URL
            CYID_OTP_PEPPER CYID_BOOTSTRAP_SECRET
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required development setting: ${name}" >&2
              exit 1
            fi
          done
          if [[ "${CYID_EMAIL_PROVIDER}" == "brevo" && -z "${CYID_BREVO_API_KEY:-}" ]]; then
            echo "Missing CYID_BREVO_API_KEY for Brevo." >&2
            exit 1
          fi
          if [[ "${CYID_EMAIL_PROVIDER}" == "resend" && -z "${CYID_RESEND_API_KEY:-}" ]]; then
            echo "Missing CYID_RESEND_API_KEY for Resend." >&2
            exit 1
          fi

      - name: Render development Cloudflare config
        run: node scripts/render-deploy-config.mjs --output wrangler.deploy.generated.jsonc

      - name: Apply remote D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.deploy.generated.jsonc

      - name: Deploy development Worker
        run: npx wrangler deploy --config wrangler.deploy.generated.jsonc

      - name: Configure Identity secrets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CYID_OTP_PEPPER" | npx wrangler secret put OTP_PEPPER --config wrangler.deploy.generated.jsonc
          printf '%s' "$CYID_BOOTSTRAP_SECRET" | npx wrangler secret put BOOTSTRAP_SECRET --config wrangler.deploy.generated.jsonc
          if [[ "$CYID_EMAIL_PROVIDER" == "brevo" ]]; then
            printf '%s' "$CYID_BREVO_API_KEY" | npx wrangler secret put BREVO_API_KEY --config wrangler.deploy.generated.jsonc
          else
            printf '%s' "$CYID_RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY --config wrangler.deploy.generated.jsonc
          fi

      - name: Remove generated config
        if: always()
        run: rm -f wrangler.deploy.generated.jsonc
