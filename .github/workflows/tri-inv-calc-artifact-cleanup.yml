name: TriINVCalc One-time Engineering Artifact Cleanup

# Temporary workflow: remove this file after successful execution.
# Runs only when this exact cleanup workflow is first added to main.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tri-inv-calc-artifact-cleanup.yml'

permissions:
  contents: read
  actions: write

jobs:
  remove-completed-test-packages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Remove only verified TriINVCalc test artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Artifact ID / exact artifact name / original workflow run ID.
          # All are temporary PR test ZIPs already superseded by the
          # published TriINVCalc-v1.5.6 GitHub Release.
          rows=(
            '11989820045 TriINVCalc-ea737b5322c895f17a632cfb8c0223dfc4e989de 38765309201'
            '11990771113 TriINVCalc-546c45b9b946744aa96181817e67bb249683bbe2 38768661167'
            '11991970293 TriINVCalc-c115c74134d73d90d4df3f5a28cb6d3419460831 38770368504'
          )
          for row in "${rows[@]}"; do
            read -r artifact_id expected_name expected_run <<< "$row"
            endpoint="repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
            # Abort rather than delete if any metadata is unexpectedly changed
            # or the item is no longer accessible.
            metadata=$(gh api "$endpoint")
            actual_id=$(jq -r '.id' <<< "$metadata")
            actual_name=$(jq -r '.name' <<< "$metadata")
            actual_run=$(jq -r '.workflow_run.id' <<< "$metadata")
            if [[ "$actual_id" != "$artifact_id" || "$actual_name" != "$expected_name" || "$actual_run" != "$expected_run" ]]; then
              echo "::error::Artifact metadata mismatch for $artifact_id: refusing deletion."
              exit 1
            fi
            gh api --method DELETE "$endpoint" --silent
            echo "Deleted superseded TriINVCalc PR artifact: $artifact_id ($expected_name)"
          done
