name: CYEnvelope Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/CYEnvelope/**"
      - ".github/workflows/cyenvelope-build.yml"

permissions:
  contents: read

concurrency:
  group: cyenvelope-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/CYEnvelope
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
          cache-dependency-path: apps/CYEnvelope/go.sum
      - name: Test
        run: go test ./...
      - name: Build portable package
        shell: pwsh
        run: ./build.ps1
      - name: Upload CYEnvelope only
        uses: actions/upload-artifact@v7
        with:
          name: CYEnvelope-windows-x64
          path: apps/CYEnvelope/dist/CYEnvelope_V*.zip
          if-no-files-found: error
          retention-days: 14
