name: CYERPAutoInput Build 23 Temp CI

on:
  push:
    branches: [ci-cyerp-build23]
    paths:
      - ".github/workflows/cyerp-auto-input-build23-temp.yml"

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v7
        with:
          ref: cyerp-auto-input/v0.1.0-csharp
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Apply Build 23 stabilization
        shell: bash
        working-directory: apps/CYERPAutoInput
