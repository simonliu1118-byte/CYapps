name: CYCloud Identity Production Provisioning

on:
  push:
    branches:
      - deploy/cycloudidentity-production

permissions:
  contents: read

concurrency:
  group: cycloudidentity-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/CYCloudIdentity
    steps:
      - uses: actions/checkout@v7
      - name: Scan public source
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/scan-public-package.py apps/CYCloudIdentity
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Validate provider source
        run: |
          npm run check
          npm test


  provision-resources:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    defaults:
      run:
        working-directory: apps/CYCloudIdentity
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEV_CYID_WORKER_NAME: ${{ vars.CYID_WORKER_NAME }}
      DEV_CYID_D1_DATABASE_NAME: ${{ vars.CYID_D1_DATABASE_NAME }}
      DEV_CYID_D1_DATABASE_ID: ${{ vars.CYID_D1_DATABASE_ID }}
      CYID_SESSION_TTL_SECONDS: ${{ vars.CYID_SESSION_TTL_SECONDS }}
      CYID_EMAIL_PROVIDER: ${{ vars.CYID_EMAIL_PROVIDER }}
      CYID_EMAIL_FROM: ${{ vars.CYID_EMAIL_FROM }}
      CYID_EMAIL_DAILY_BUDGET: ${{ vars.CYID_EMAIL_DAILY_BUDGET }}
      CYID_CORE_ACCOUNT_APPLICATION_ID: ${{ vars.CYID_CORE_ACCOUNT_APPLICATION_ID }}
      CYID_BREVO_API_KEY: ${{ secrets.CYID_BREVO_API_KEY }}
      CYID_RESEND_API_KEY: ${{ secrets.CYID_RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Derive isolated production resource targets
        shell: bash
        run: |
          set -euo pipefail
          required=(CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DEV_CYID_WORKER_NAME DEV_CYID_D1_DATABASE_NAME DEV_CYID_D1_DATABASE_ID)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing protected production provisioning prerequisite." >&2
              exit 1
            fi
          done

          if [[ "$DEV_CYID_WORKER_NAME" == *-development ]]; then
            PROD_CYID_WORKER_NAME="${DEV_CYID_WORKER_NAME%-development}-production"
          elif [[ "$DEV_CYID_WORKER_NAME" == *-dev ]]; then
            PROD_CYID_WORKER_NAME="${DEV_CYID_WORKER_NAME%-dev}-prod"
          else
            PROD_CYID_WORKER_NAME="${DEV_CYID_WORKER_NAME}-prod"
          fi

          if [[ "$DEV_CYID_D1_DATABASE_NAME" == *-dev-db ]]; then
            PROD_CYID_D1_DATABASE_NAME="${DEV_CYID_D1_DATABASE_NAME%-dev-db}-prod-db"
          elif [[ "$DEV_CYID_D1_DATABASE_NAME" == *_dev_db ]]; then
            PROD_CYID_D1_DATABASE_NAME="${DEV_CYID_D1_DATABASE_NAME%_dev_db}_prod_db"
          else
            PROD_CYID_D1_DATABASE_NAME="${DEV_CYID_D1_DATABASE_NAME}-prod"
          fi

          if [[ "$PROD_CYID_WORKER_NAME" == "$DEV_CYID_WORKER_NAME" || "$PROD_CYID_D1_DATABASE_NAME" == "$DEV_CYID_D1_DATABASE_NAME" ]]; then
            echo "Production resources must be distinct from development." >&2
            exit 1
          fi

          for value in "$DEV_CYID_WORKER_NAME" "$DEV_CYID_D1_DATABASE_NAME" "$DEV_CYID_D1_DATABASE_ID" "$PROD_CYID_WORKER_NAME" "$PROD_CYID_D1_DATABASE_NAME"; do
            echo "::add-mask::$value"
          done
          PROD_RATE_NAMESPACE_ID="$(PROD_CYID_WORKER_NAME="$PROD_CYID_WORKER_NAME" node -e '
            const crypto=require("node:crypto");
            const h=crypto.createHash("sha256").update(process.env.PROD_CYID_WORKER_NAME+":rate").digest("hex").slice(0,10);
            process.stdout.write(String(Number(BigInt("0x"+h)%900000000n)+100000000));
          ')"
          for value in "$PROD_RATE_NAMESPACE_ID" "${CYID_EMAIL_FROM:-}" "${CYID_CORE_ACCOUNT_APPLICATION_ID:-}"; do
            [[ -n "$value" ]] && echo "::add-mask::$value"
          done
          {
            echo "PROD_CYID_WORKER_NAME=$PROD_CYID_WORKER_NAME"
            echo "PROD_CYID_D1_DATABASE_NAME=$PROD_CYID_D1_DATABASE_NAME"
            echo "PROD_RATE_NAMESPACE_ID=$PROD_RATE_NAMESPACE_ID"
          } >> "$GITHUB_ENV"

      - name: Create or confirm production Worker
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          code="$(curl -sS -o /tmp/cyid-prod-worker-check.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PROD_CYID_WORKER_NAME/settings")"

          if [[ "$code" == "404" ]]; then
            create_code="$(curl -sS -o /tmp/cyid-prod-worker-resource.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers" \
              --data "$(node -e 'process.stdout.write(JSON.stringify({name:process.env.PROD_CYID_WORKER_NAME}))')")"
            if [[ "$create_code" != "200" && "$create_code" != "201" ]]; then
              echo "CYID_PROD_WORKER_READY=0" >> "$GITHUB_ENV"
              echo "CYID production Worker resource creation is blocked by current Cloudflare authorization." >&2
              exit 0
            fi

            printf '%s\n' 'export default { async fetch() { return new Response("CYID production bootstrap"); } };' > /tmp/cyid-production-bootstrap.mjs
            if ! npx wrangler deploy /tmp/cyid-production-bootstrap.mjs --name "$PROD_CYID_WORKER_NAME" --compatibility-date 2026-09-25 > /tmp/cyid-prod-worker-create.log 2>&1; then
              node -e '
                const fs=require("node:fs");
                const t=fs.existsSync("/tmp/cyid-prod-worker-create.log")?fs.readFileSync("/tmp/cyid-prod-worker-create.log","utf8").toLowerCase():"";
                const c=[];
                if(t.includes("access")||t.includes("permission")||t.includes("forbidden")||t.includes("unauthorized")) c.push("PERMISSION");
                if(t.includes("quota")||t.includes("limit")) c.push("QUOTA");
                console.error("CYID production Worker bootstrap deployment failed category="+(c.join(",")||"unclassified"));
              '
              echo "CYID_PROD_WORKER_READY=0" >> "$GITHUB_ENV"
              exit 0
            fi
          elif [[ "$code" != "200" ]]; then
            echo "Unable to inspect CYID production Worker target." >&2
            exit 1
          fi
          echo "CYID_PROD_WORKER_READY=1" >> "$GITHUB_ENV"
          echo "Distinct CYID production Worker resource is available."

      - name: Create or confirm production D1
        shell: bash
        run: |
          set -euo pipefail
          list_file="$(mktemp)"
          npx wrangler d1 list --json > "$list_file" 2>/dev/null
          find_id() {
            DB_NAME="$PROD_CYID_D1_DATABASE_NAME" node -e '
              const fs=require("node:fs");
              const data=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              const rows=Array.isArray(data)?data:(Array.isArray(data?.result)?data.result:[]);
              const hit=rows.find(x=>String(x?.name||"")===process.env.DB_NAME);
              if(hit) process.stdout.write(String(hit.uuid||hit.id||""));
            ' "$list_file"
          }

          PROD_CYID_D1_DATABASE_ID="$(find_id)"
          if [[ -z "$PROD_CYID_D1_DATABASE_ID" ]]; then
            if ! npx wrangler d1 create "$PROD_CYID_D1_DATABASE_NAME" --location apac > /tmp/cyid-prod-d1-create.log 2>&1; then
              echo "Unable to create CYID production D1." >&2
              exit 1
            fi
            npx wrangler d1 list --json > "$list_file" 2>/dev/null
            PROD_CYID_D1_DATABASE_ID="$(find_id)"
          fi

          if [[ ! "$PROD_CYID_D1_DATABASE_ID" =~ ^[0-9a-fA-F-]{36}$ || "$PROD_CYID_D1_DATABASE_ID" == "$DEV_CYID_D1_DATABASE_ID" ]]; then
            echo "Production D1 isolation validation failed." >&2
            exit 1
          fi
          echo "::add-mask::$PROD_CYID_D1_DATABASE_ID"
          echo "PROD_CYID_D1_DATABASE_ID=$PROD_CYID_D1_DATABASE_ID" >> "$GITHUB_ENV"
          echo "CYID production D1 isolation is ready."

      - name: Apply CYID production schema
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/cyid-prod-d1.jsonc <<EOF
          {
            "name": "cyid-production-d1-maintenance",
            "compatibility_date": "2026-09-25",
            "d1_databases": [{
              "binding": "DB",
              "database_name": "$PROD_CYID_D1_DATABASE_NAME",
              "database_id": "$PROD_CYID_D1_DATABASE_ID",
              "migrations_dir": "$GITHUB_WORKSPACE/apps/CYCloudIdentity/migrations"
            }]
          }
          EOF
          if ! npx wrangler d1 migrations apply DB --remote --config /tmp/cyid-prod-d1.jsonc > /tmp/cyid-prod-migrate.log 2>&1; then
            echo "CYID production schema migration failed." >&2
            exit 1
          fi

      - name: Capture durable development authority
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/cyid-dev-d1.jsonc <<EOF
          {
            "name": "cyid-development-d1-source",
            "compatibility_date": "2026-09-25",
            "d1_databases": [{
              "binding": "DB",
              "database_name": "$DEV_CYID_D1_DATABASE_NAME",
              "database_id": "$DEV_CYID_D1_DATABASE_ID"
            }]
          }
          EOF

          mkdir -p /tmp/cyid-dev-authority
          tables=(
            workspaces employees employee_credentials employee_initial_credentials
            applications workspace_applications employee_application_access
            identity_groups employee_identity_groups identity_group_application_access
            identity_security_policies
          )
          for table in "${tables[@]}"; do
            npx wrangler d1 execute DB --remote --json --config /tmp/cyid-dev-d1.jsonc --command "SELECT * FROM $table;" > "/tmp/cyid-dev-authority/$table.json" 2>/dev/null
          done

          scalar() {
            local sql="$1" out="$2"
            npx wrangler d1 execute DB --remote --json --config /tmp/cyid-dev-d1.jsonc --command "$sql" > "$out" 2>/dev/null
            node -e '
              const fs=require("node:fs");
              const raw=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              const roots=Array.isArray(raw)?raw:[raw], rows=[];
              for(const r of roots){ if(Array.isArray(r?.results)) rows.push(...r.results); if(Array.isArray(r?.result?.results)) rows.push(...r.result.results); }
              if(rows.length!==1 || rows[0]?.value===undefined || rows[0]?.value===null) process.exit(2);
              process.stdout.write(String(rows[0].value));
            ' "$out"
          }

          inflight="$(scalar "SELECT COUNT(*) AS value FROM employee_initial_credentials WHERE exchange_token_digest IS NOT NULL OR verified_at IS NOT NULL;" /tmp/cyid-inflight.json)"
          if [[ "$inflight" != "0" ]]; then
            echo "Production continuity blocked by an in-flight first-login exchange." >&2
            exit 1
          fi

          DEV_WORKSPACE_ID="$(scalar "SELECT workspace_id AS value FROM workspaces WHERE status='active';" /tmp/cyid-dev-workspace.json)"
          DEV_CYACC_APPLICATION_ID="$(scalar "SELECT application_id AS value FROM applications WHERE status='active' AND upper(replace(display_name,' ','')) IN ('CYACCOUNTINGWEB','CYACC');" /tmp/cyid-dev-cyacc.json)"
          echo "::add-mask::$DEV_WORKSPACE_ID"
          echo "::add-mask::$DEV_CYACC_APPLICATION_ID"

          PROD_CYACC_APPLICATION_ID="$(DEV_CYACC_APPLICATION_ID="$DEV_CYACC_APPLICATION_ID" node -e '
            const crypto=require("node:crypto");
            const h=crypto.createHash("sha256").update(process.env.DEV_CYACC_APPLICATION_ID+":production").digest("hex").slice(0,24).toUpperCase();
            process.stdout.write("CYACC_"+h);
          ')"
          echo "::add-mask::$PROD_CYACC_APPLICATION_ID"
          {
            echo "PROD_WORKSPACE_ID=$DEV_WORKSPACE_ID"
            echo "DEV_CYACC_APPLICATION_ID=$DEV_CYACC_APPLICATION_ID"
            echo "PROD_CYACC_APPLICATION_ID=$PROD_CYACC_APPLICATION_ID"
          } >> "$GITHUB_ENV"

      - name: Import production authority continuity
        shell: bash
        run: |
          set -euo pipefail
          DEV_CYACC_APPLICATION_ID="$DEV_CYACC_APPLICATION_ID" PROD_CYACC_APPLICATION_ID="$PROD_CYACC_APPLICATION_ID" node <<'NODE'
          const fs=require('node:fs');
          const dir='/tmp/cyid-dev-authority';
          const tableOrder=[
            'workspaces','employees','employee_credentials','employee_initial_credentials',
            'applications','workspace_applications','employee_application_access',
            'identity_groups','employee_identity_groups','identity_group_application_access',
            'identity_security_policies'
          ];
          function rows(table){
            const raw=JSON.parse(fs.readFileSync(dir+'/'+table+'.json','utf8'));
            const roots=Array.isArray(raw)?raw:[raw], out=[];
            for(const r of roots){ if(Array.isArray(r?.results)) out.push(...r.results); if(Array.isArray(r?.result?.results)) out.push(...r.result.results); }
            return out;
          }
          function qid(v){ return '"'+String(v).replaceAll('"','""')+'"'; }
          function lit(v){
            if(v===null || v===undefined) return 'NULL';
            if(typeof v==='number') return String(v);
            return "'"+String(v).replaceAll("'","''")+"'";
          }
          function mapped(row){
            const r={...row};
            if(r.application_id===process.env.DEV_CYACC_APPLICATION_ID) r.application_id=process.env.PROD_CYACC_APPLICATION_ID;
            return r;
          }
          function ins(table,row){
            const keys=Object.keys(row);
            return 'INSERT INTO '+qid(table)+'('+keys.map(qid).join(',')+') VALUES('+keys.map(k=>lit(row[k])).join(',')+');';
          }
          const data=Object.fromEntries(tableOrder.map(t=>[t,rows(t)]));
          const sql=['PRAGMA foreign_keys = ON;'];
          for(const row of data.workspaces) sql.push(ins('workspaces',{...row,status:'bootstrap',super_admin_employee_id:null}));
          for(const t of ['employees','employee_credentials','employee_initial_credentials']) for(const row of data[t]) sql.push(ins(t,row));
          for(const row of data.workspaces){
            const sets=Object.keys(row).filter(k=>k!=='workspace_id').map(k=>qid(k)+'='+lit(row[k])).join(',');
            sql.push('UPDATE "workspaces" SET '+sets+' WHERE "workspace_id"='+lit(row.workspace_id)+';');
          }
          for(const t of ['applications','workspace_applications','employee_application_access','identity_groups','employee_identity_groups','identity_group_application_access','identity_security_policies']){
            for(const row of data[t]) sql.push(ins(t,mapped(row)));
          }
          fs.writeFileSync('/tmp/cyid-prod-continuity.sql',sql.join('\n')+'\n',{mode:0o600});
          NODE

          existing="$(npx wrangler d1 execute DB --remote --json --config /tmp/cyid-prod-d1.jsonc --command "SELECT COUNT(*) AS value FROM workspaces;" 2>/dev/null | node -e '
            let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const raw=JSON.parse(s), roots=Array.isArray(raw)?raw:[raw], rows=[];for(const r of roots){if(Array.isArray(r?.results))rows.push(...r.results);if(Array.isArray(r?.result?.results))rows.push(...r.result.results);}if(rows.length!==1)process.exit(2);process.stdout.write(String(rows[0].value));});
          ')"
          if [[ "$existing" == "0" ]]; then
            if ! npx wrangler d1 execute DB --remote --config /tmp/cyid-prod-d1.jsonc --file /tmp/cyid-prod-continuity.sql > /tmp/cyid-prod-import.log 2>&1; then
              echo "CYID production authority continuity import failed." >&2
              exit 1
            fi
          fi

          node <<'NODE'
          const fs=require('node:fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/cyid-dev-authority/employees.json','utf8'));
          const roots=Array.isArray(raw)?raw:[raw], rows=[];
          for(const r of roots){ if(Array.isArray(r?.results)) rows.push(...r.results); if(Array.isArray(r?.result?.results)) rows.push(...r.result.results); }
          const qid=v=>'"'+String(v).replaceAll('"','""')+'"';
          const lit=v=>v===null||v===undefined?'NULL':(typeof v==='number'?String(v):"'"+String(v).replaceAll("'","''")+"'");
          const sql=[];
          for(const row of rows){
            const sets=Object.keys(row).filter(k=>k!=='employee_id').map(k=>qid(k)+'='+lit(row[k])).join(',');
            sql.push('UPDATE "employees" SET '+sets+' WHERE "employee_id"='+lit(row.employee_id)+';');
          }
          fs.writeFileSync('/tmp/cyid-prod-employee-repair.sql',sql.join('\n')+'\n',{mode:0o600});
          NODE
          npx wrangler d1 execute DB --remote --config /tmp/cyid-prod-d1.jsonc --file /tmp/cyid-prod-employee-repair.sql > /dev/null 2>&1

      - name: Verify production authority continuity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cyid-prod-authority
          tables=(
            workspaces employees employee_credentials employee_initial_credentials
            applications workspace_applications employee_application_access
            identity_groups employee_identity_groups identity_group_application_access
            identity_security_policies
          )
          for table in "${tables[@]}"; do
            npx wrangler d1 execute DB --remote --json --config /tmp/cyid-prod-d1.jsonc --command "SELECT * FROM $table;" > "/tmp/cyid-prod-authority/$table.json" 2>/dev/null
          done

          DEV_CYACC_APPLICATION_ID="$DEV_CYACC_APPLICATION_ID" PROD_CYACC_APPLICATION_ID="$PROD_CYACC_APPLICATION_ID" node <<'NODE'
          const fs=require('node:fs'), crypto=require('node:crypto');
          const tables=[
            'workspaces','employees','employee_credentials','employee_initial_credentials',
            'applications','workspace_applications','employee_application_access',
            'identity_groups','employee_identity_groups','identity_group_application_access',
            'identity_security_policies'
          ];
          function rows(dir,t){
            const raw=JSON.parse(fs.readFileSync(dir+'/'+t+'.json','utf8'));
            const roots=Array.isArray(raw)?raw:[raw], out=[];
            for(const r of roots){ if(Array.isArray(r?.results)) out.push(...r.results); if(Array.isArray(r?.result?.results)) out.push(...r.result.results); }
            return out;
          }
          function canon(v){
            if(Array.isArray(v)) return '['+v.map(canon).join(',')+']';
            if(v&&typeof v==='object') return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';
            return JSON.stringify(v);
          }
          function tableDigest(dir,t,source){
            const h=crypto.createHash('sha256');
            const rs=rows(dir,t).map(r=>{
              const x={...r};
              if(source && x.application_id===process.env.DEV_CYACC_APPLICATION_ID) x.application_id=process.env.PROD_CYACC_APPLICATION_ID;
              return canon(x);
            }).sort();
            h.update(t+'\n'+rs.join('\n')+'\n');
            return h.digest('hex');
          }
          for(const t of tables){
            if(tableDigest('/tmp/cyid-dev-authority',t,true)!==tableDigest('/tmp/cyid-prod-authority',t,false)){
              console.error('Authority continuity mismatch table='+t);
              process.exit(2);
            }
          }
          NODE

          transient="$(npx wrangler d1 execute DB --remote --json --config /tmp/cyid-prod-d1.jsonc --command "SELECT (SELECT COUNT(*) FROM identity_sessions)+(SELECT COUNT(*) FROM email_otp_challenges)+(SELECT COUNT(*) FROM bootstrap_requests)+(SELECT COUNT(*) FROM identity_audit_events) AS value;" 2>/dev/null | node -e '
            let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const raw=JSON.parse(s), roots=Array.isArray(raw)?raw:[raw], rows=[];for(const r of roots){if(Array.isArray(r?.results))rows.push(...r.results);if(Array.isArray(r?.result?.results))rows.push(...r.result.results);}if(rows.length!==1)process.exit(2);process.stdout.write(String(rows[0].value));});
          ')"
          if [[ "$transient" != "0" ]]; then
            echo "CYID production continuity contains forbidden transient development authority." >&2
            exit 1
          fi

          enabled="$(npx wrangler d1 execute DB --remote --json --config /tmp/cyid-prod-d1.jsonc --command "SELECT COUNT(*) AS value FROM workspace_applications WHERE workspace_id='$PROD_WORKSPACE_ID' AND application_id='$PROD_CYACC_APPLICATION_ID' AND enabled=1;" 2>/dev/null | node -e '
            let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const raw=JSON.parse(s), roots=Array.isArray(raw)?raw:[raw], rows=[];for(const r of roots){if(Array.isArray(r?.results))rows.push(...r.results);if(Array.isArray(r?.result?.results))rows.push(...r.result.results);}if(rows.length!==1)process.exit(2);process.stdout.write(String(rows[0].value));});
          ')"
          if [[ "$enabled" != "1" ]]; then
            echo "CYACC production Application enablement validation failed." >&2
            exit 1
          fi
          echo "CYID production D1 durable authority continuity verified."

      - name: Probe temporary production-token delegation capability
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          list_code="$(curl -sS -o /tmp/cyid-token-groups.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/permission_groups")"
          create_probe="$(curl -sS -o /tmp/cyid-token-create-probe.json -w '%{http_code}' -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens" --data '{}')"
          if [[ "$list_code" == "200" && ( "$create_probe" == "400" || "$create_probe" == "422" ) ]]; then
            echo "CYID_TEMP_TOKEN_DELEGATION=1" >> "$GITHUB_ENV"
            echo "Cloudflare credential can provision a temporary account token."
          else
            echo "CYID_TEMP_TOKEN_DELEGATION=0" >> "$GITHUB_ENV"
            echo "Cloudflare credential cannot provision a temporary account token."
          fi

      - name: Render CYID production Worker runtime
        if: env.CYID_PROD_WORKER_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          required=(CYID_SESSION_TTL_SECONDS CYID_EMAIL_PROVIDER CYID_EMAIL_FROM CYID_EMAIL_DAILY_BUDGET CYID_CORE_ACCOUNT_APPLICATION_ID PROD_RATE_NAMESPACE_ID)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing protected CYID production runtime prerequisite." >&2
              exit 1
            fi
          done
          node <<'NODE'
          const fs=require('node:fs');
          const config={
            name:process.env.PROD_CYID_WORKER_NAME,
            main:'src/index.ts',
            compatibility_date:'2026-09-25',
            workers_dev:true,
            d1_databases:[{
              binding:'DB',
              database_name:process.env.PROD_CYID_D1_DATABASE_NAME,
              database_id:process.env.PROD_CYID_D1_DATABASE_ID,
              migrations_dir:'migrations'
            }],
            ratelimits:[{
              name:'LOGIN_RATE_LIMITER',
              namespace_id:process.env.PROD_RATE_NAMESPACE_ID,
              simple:{limit:10,period:60}
            }],
            vars:{
              APP_ENV:'production',
              API_VERSION:'v1',
              SESSION_TTL_SECONDS:process.env.CYID_SESSION_TTL_SECONDS,
              EMAIL_PROVIDER:process.env.CYID_EMAIL_PROVIDER,
              EMAIL_FROM:process.env.CYID_EMAIL_FROM,
              EMAIL_DAILY_BUDGET:process.env.CYID_EMAIL_DAILY_BUDGET,
              CORE_ACCOUNT_APPLICATION_ID:process.env.CYID_CORE_ACCOUNT_APPLICATION_ID,
              ACCOUNT_PORTAL_URL:'https://admin.chihyuancm.com',
              CYACC_APPLICATION_ID:process.env.PROD_CYACC_APPLICATION_ID,
              CYACC_WORKSPACE_ID:process.env.PROD_WORKSPACE_ID,
              CYACC_SERVICE_BINDING_TARGET:process.env.PROD_CYID_WORKER_NAME
            }
          };
          fs.writeFileSync('wrangler.production.generated.jsonc',JSON.stringify(config,null,2)+'\n',{mode:0o600});
          NODE

      - name: Deploy CYID production Worker runtime
        if: env.CYID_PROD_WORKER_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          if ! npx wrangler deploy --config wrangler.production.generated.jsonc > /tmp/cyid-prod-deploy.log 2>&1; then
            echo "CYID production Worker deployment failed." >&2
            exit 1
          fi
          CYID_PRODUCTION_URL="$(node -e '
            const fs=require("node:fs");
            const text=fs.readFileSync("/tmp/cyid-prod-deploy.log","utf8");
            const m=text.match(/https:\/\/[A-Za-z0-9.-]+\.workers\.dev/);
            if(m) process.stdout.write(m[0]);
          ')"
          if [[ -z "$CYID_PRODUCTION_URL" ]]; then
            echo "CYID production Worker deployed without a validation URL." >&2
            exit 1
          fi
          echo "::add-mask::$CYID_PRODUCTION_URL"
          echo "CYID_PRODUCTION_URL=$CYID_PRODUCTION_URL" >> "$GITHUB_ENV"

      - name: Configure production-only CYID secrets
        if: env.CYID_PROD_WORKER_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PROD_CYID_WORKER_NAME/settings" > /tmp/cyid-prod-runtime-settings-before-secrets.json

          has_secret() {
            SECRET_NAME="$1" node -e '
              const fs=require("node:fs");
              const data=JSON.parse(fs.readFileSync("/tmp/cyid-prod-runtime-settings-before-secrets.json","utf8"))?.result||{};
              const bindings=Array.isArray(data.bindings)?data.bindings:[];
              process.exit(bindings.some(x=>String(x?.name||"")===process.env.SECRET_NAME && String(x?.type||"").includes("secret"))?0:1);
            '
          }

          if ! has_secret OTP_PEPPER; then
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            printf '%s' "$value" | npx wrangler secret put OTP_PEPPER --config wrangler.production.generated.jsonc > /dev/null
          fi
          if ! has_secret BOOTSTRAP_SECRET; then
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            printf '%s' "$value" | npx wrangler secret put BOOTSTRAP_SECRET --config wrangler.production.generated.jsonc > /dev/null
          fi

          if [[ "$CYID_EMAIL_PROVIDER" == "brevo" ]]; then
            [[ -n "${CYID_BREVO_API_KEY:-}" ]] || { echo "Missing protected production Email provider credential." >&2; exit 1; }
            printf '%s' "$CYID_BREVO_API_KEY" | npx wrangler secret put BREVO_API_KEY --config wrangler.production.generated.jsonc > /dev/null
          elif [[ "$CYID_EMAIL_PROVIDER" == "resend" ]]; then
            [[ -n "${CYID_RESEND_API_KEY:-}" ]] || { echo "Missing protected production Email provider credential." >&2; exit 1; }
            printf '%s' "$CYID_RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY --config wrangler.production.generated.jsonc > /dev/null
          else
            echo "Unsupported production Email provider." >&2
            exit 1
          fi

      - name: Verify CYID production provider runtime
        if: env.CYID_PROD_WORKER_READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl -sS -o /tmp/cyid-prod-health.json -w '%{http_code}' "$CYID_PRODUCTION_URL/v1/health")"
          [[ "$health" == "200" ]] || { echo "CYID production health verification failed." >&2; exit 1; }

          api="https://api.cloudflare.com/client/v4"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PROD_CYID_WORKER_NAME/settings" > /tmp/cyid-prod-runtime-settings.json
          node <<'NODE'
          const fs=require('node:fs');
          const data=JSON.parse(fs.readFileSync('/tmp/cyid-prod-runtime-settings.json','utf8'))?.result||{};
          const bindings=Array.isArray(data.bindings)?data.bindings:[];
          const by=new Map(bindings.map(x=>[String(x?.name||''),x]));
          const text=n=>String(by.get(n)?.text??'');
          const db=by.get('DB');
          const dbid=String(db?.database_id||db?.id||'');
          if(text('APP_ENV')!=='production') process.exit(2);
          if(text('CYACC_APPLICATION_ID')!==process.env.PROD_CYACC_APPLICATION_ID) process.exit(3);
          if(text('CYACC_WORKSPACE_ID')!==process.env.PROD_WORKSPACE_ID) process.exit(4);
          if(text('CYACC_SERVICE_BINDING_TARGET')!==process.env.PROD_CYID_WORKER_NAME) process.exit(5);
          if(dbid!==process.env.PROD_CYID_D1_DATABASE_ID) process.exit(6);
          for(const name of ['OTP_PEPPER','BOOTSTRAP_SECRET']){
            const b=by.get(name);
            if(!b || !String(b.type||'').includes('secret')) process.exit(7);
          }
          NODE

          npx wrangler d1 execute DB --remote --json --config /tmp/cyid-prod-d1.jsonc --command "SELECT e.employee_id,e.revision,c.credential_version,e.workspace_id,aa.application_id FROM employee_application_access aa JOIN employees e ON e.workspace_id=aa.workspace_id AND e.employee_id=aa.employee_id JOIN employee_credentials c ON c.employee_id=e.employee_id WHERE aa.workspace_id='$PROD_WORKSPACE_ID' AND aa.application_id='$PROD_CYACC_APPLICATION_ID' AND aa.enabled=1 AND e.enabled=1 ORDER BY e.employee_no LIMIT 1;" > /tmp/cyid-prod-principal.json 2>/dev/null

          PROBE_TOKEN="cyid_$(openssl rand -hex 32)"
          PROBE_HASH="$(printf '%s' "$PROBE_TOKEN" | sha256sum | awk '{print $1}')"
          echo "::add-mask::$PROBE_TOKEN"
          echo "::add-mask::$PROBE_HASH"

          PROBE_HASH="$PROBE_HASH" node <<'NODE'
          const fs=require('node:fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/cyid-prod-principal.json','utf8'));
          const roots=Array.isArray(raw)?raw:[raw], rows=[];
          for(const r of roots){ if(Array.isArray(r?.results)) rows.push(...r.results); if(Array.isArray(r?.result?.results)) rows.push(...r.result.results); }
          if(rows.length!==1) process.exit(2);
          const r=rows[0];
          const q=v=>"'"+String(v).replaceAll("'","''")+"'";
          const now=new Date(), exp=new Date(now.getTime()+300000);
          const sql='INSERT INTO identity_sessions(session_hash,workspace_id,employee_id,application_id,credential_version,employee_revision,created_at,expires_at,revoked_at) VALUES('+
            [q(process.env.PROBE_HASH),q(r.workspace_id),q(r.employee_id),q(r.application_id),Number(r.credential_version),Number(r.revision),q(now.toISOString()),q(exp.toISOString()),'NULL'].join(',')+');\n';
          fs.writeFileSync('/tmp/cyid-prod-probe.sql',sql,{mode:0o600});
          fs.writeFileSync('/tmp/cyid-prod-probe-app.txt',String(r.application_id),{mode:0o600});
          NODE
          npx wrangler d1 execute DB --remote --config /tmp/cyid-prod-d1.jsonc --file /tmp/cyid-prod-probe.sql > /dev/null 2>&1
          PROBE_APP="$(cat /tmp/cyid-prod-probe-app.txt)"
          echo "::add-mask::$PROBE_APP"

          cleanup_probe() {
            printf "DELETE FROM identity_sessions WHERE session_hash='%s';\n" "$PROBE_HASH" > /tmp/cyid-prod-probe-cleanup.sql
            npx wrangler d1 execute DB --remote --config /tmp/cyid-prod-d1.jsonc --file /tmp/cyid-prod-probe-cleanup.sql > /dev/null 2>&1 || true
          }
          trap cleanup_probe EXIT

          code="$(curl -sS -o /tmp/cyid-prod-resolve.json -w '%{http_code}' -X POST "$CYID_PRODUCTION_URL/v1/identity/session/resolve" -H "authorization: Bearer $PROBE_TOKEN" -H "x-identity-application: $PROBE_APP")"
          [[ "$code" == "200" ]] || { echo "CYID production Session resolve verification failed." >&2; exit 1; }
          code="$(curl -sS -o /tmp/cyid-prod-logout.json -w '%{http_code}' -X POST "$CYID_PRODUCTION_URL/v1/identity/logout" -H "authorization: Bearer $PROBE_TOKEN" -H "x-identity-application: $PROBE_APP")"
          [[ "$code" == "200" ]] || { echo "CYID production logout verification failed." >&2; exit 1; }
          code="$(curl -sS -o /tmp/cyid-prod-after.json -w '%{http_code}' -X POST "$CYID_PRODUCTION_URL/v1/identity/session/resolve" -H "authorization: Bearer $PROBE_TOKEN" -H "x-identity-application: $PROBE_APP")"
          [[ "$code" == "401" ]] || { echo "CYID production Session invalidation verification failed." >&2; exit 1; }
          cleanup_probe
          trap - EXIT

          remaining="$(npx wrangler d1 execute DB --remote --json --config /tmp/cyid-prod-d1.jsonc --command "SELECT COUNT(*) AS value FROM identity_sessions;" 2>/dev/null | node -e '
            let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const raw=JSON.parse(s), roots=Array.isArray(raw)?raw:[raw], rows=[];for(const r of roots){if(Array.isArray(r?.results))rows.push(...r.results);if(Array.isArray(r?.result?.results))rows.push(...r.result.results);}if(rows.length!==1)process.exit(2);process.stdout.write(String(rows[0].value));});
          ')"
          [[ "$remaining" == "0" ]] || { echo "CYID production verification left Session state." >&2; exit 1; }
          echo "CYID_PROD_PROVIDER_VERIFIED=1" >> "$GITHUB_ENV"
          echo "CYID production provider runtime verified."

      - name: Final production provider resource gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CYID_PROD_WORKER_READY:-0}" != "1" ]]; then
            echo "CYID production D1 and authority continuity are ready, but production Worker creation remains blocked by Cloudflare authorization." >&2
            exit 1
          fi
          if [[ "${CYID_PROD_PROVIDER_VERIFIED:-0}" != "1" ]]; then
            echo "CYID production Worker exists but provider runtime verification is incomplete." >&2
            exit 1
          fi
          echo "CYID production provider provisioning and self-verification passed."
      - name: Cleanup
        if: always()
        run: |
          rm -rf /tmp/cyid-prod-* /tmp/cyid-dev-* /tmp/cyid-production-bootstrap.mjs
          rm -f wrangler.production.generated.jsonc
