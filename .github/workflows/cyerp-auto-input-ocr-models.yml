name: CYERPAutoInput OCR Model Mirror

# Publishes the pinned PaddleOCR model set (apps/CYERPAutoInput/tools/ocr-models.json)
# as Release assets so builds do not depend on the upstream repository.
# Run manually from main once per model-set change. Existing releases are never overwritten.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cyerp-auto-input-ocr-models
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/CYERPAutoInput
    steps:
      - uses: actions/checkout@v7

      - name: Require main
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne "refs/heads/main") { throw "OCR model releases are published from main only (got $env:GITHUB_REF)." }

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Download pinned upstream models and verify SHA-256
        shell: pwsh
        run: ./tools/fetch-ocr-models.ps1 -UpstreamOnly

      - name: Scan release payload for secrets
        shell: pwsh
        run: python "$env:GITHUB_WORKSPACE/.github/scripts/scan-public-package.py" ./runtime/ocr

      - name: Publish model release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content ./tools/ocr-models.json -Raw | ConvertFrom-Json
          $tag = $manifest.releaseTag
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; OCR model releases are never overwritten." }

          $files = @($manifest.models | ForEach-Object { "runtime/ocr/$($_.name)" }) + "runtime/ocr/SHA256.txt"
          $notes = @"
          CYERPAutoInput OCR model set mirror. This is not a CYERPAutoInput product release.

          - Models: PaddleOCR PP-OCRv5 mobile (detection, recognition, text-line orientation), ONNX format.
          - License: Apache License 2.0 (PaddleOCR / PaddlePaddle; ONNX files via meloht/RapidOCRSharpOnnx).
          - Upstream: $($manifest.upstreamBaseUrl)
          - SHA-256 values are pinned in apps/CYERPAutoInput/tools/ocr-models.json and listed in SHA256.txt.
          "@
          gh release create $tag @files --prerelease --target $env:GITHUB_SHA --title "CYERPAutoInput OCR models ($tag)" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
