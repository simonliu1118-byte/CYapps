name: CYPriceDesk Deploy

# Manual publish only. Merging to main never deploys; PR validation lives in cypricedesk-check.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cypricedesk-production
    concurrency:
      group: cypricedesk-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/CYPriceDesk
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_IDENTITY_SERVICE: ${{ vars.CF_IDENTITY_SERVICE }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
      CF_D1_DATABASE_NAME: ${{ vars.CF_D1_DATABASE_NAME }}
      CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
      CF_CYID_APPLICATION_ID: ${{ vars.CF_CYID_APPLICATION_ID }}
      CF_CYID_WORKSPACE_ID: ${{ vars.CF_CYID_WORKSPACE_ID }}
      CF_CYWEB_PORTAL_URL: ${{ vars.CF_CYWEB_PORTAL_URL }}
      CF_CYPD_FETCHER_URL: ${{ vars.CF_CYPD_FETCHER_URL }}
      CF_CYPRICEDESK_CUSTOM_DOMAIN: ${{ vars.CF_CYPRICEDESK_CUSTOM_DOMAIN }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Verify deployed commit is the current remote main
        run: |
          remote="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ "$remote" != "$GITHUB_SHA" ]; then
            echo "This run is not the current main commit; dispatch again from the latest main." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/CYPriceDesk/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Mask deployment resource identifiers
        run: |
          node -e 'for (const key of ["CF_WORKER_NAME","CF_D1_DATABASE_NAME","CF_D1_DATABASE_ID","CF_IDENTITY_SERVICE","CF_CYID_APPLICATION_ID","CF_CYID_WORKSPACE_ID","CF_CYPRICEDESK_CUSTOM_DOMAIN","CF_CYPD_FETCHER_URL"]) { if (process.env[key]) console.log("::add-mask::" + process.env[key]); }'

      - name: Render production Cloudflare config
        run: node scripts/render-wrangler.mjs --output wrangler.deploy.jsonc

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.deploy.jsonc

      - name: Deploy Worker and static assets
        run: npx wrangler deploy --config wrangler.deploy.jsonc

      - name: Set fetcher signing secret
        env:
          CYPD_FETCHER_SECRET: ${{ secrets.CYPD_FETCHER_SECRET }}
        run: |
          if [ -z "$CYPD_FETCHER_SECRET" ]; then echo "CYPD_FETCHER_SECRET not set; auto query stays disabled."; exit 0; fi
          printf '%s' "$CYPD_FETCHER_SECRET" | npx wrangler secret put CYPD_FETCHER_SECRET --config wrangler.deploy.jsonc

      - name: Remove production generated files
        if: always()
        run: rm -f wrangler.deploy.jsonc
