name: SMARTCOPIConverter Build

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/SMARTCOPIConverter/**'
      - '.github/scripts/scan-public-package.py'
      - '.github/workflows/smartcopiconverter-build.yml'

permissions:
  contents: read

concurrency:
  group: smartcopiconverter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/SMARTCOPIConverter

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache-dependency-path: apps/SMARTCOPIConverter/go.mod

      - name: Build and test
        shell: pwsh
        run: ./build.ps1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Scan engineering artifact for secrets and production bindings
        shell: pwsh
        run: python "$env:GITHUB_WORKSPACE/.github/scripts/scan-public-package.py" ./SMARTCOPIConverter.exe

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $b = [int](Get-Content BUILD -Raw).Trim()
          $display = if ($b -gt 0) { "V$v Build $b" } else { "V$v" }
          "display=$display" >> $env:GITHUB_OUTPUT

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: SMARTCOPIConverter-${{ steps.version.outputs.display }}-win-x64
          path: apps/SMARTCOPIConverter/SMARTCOPIConverter.exe
          retention-days: 3
