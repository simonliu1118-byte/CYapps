name: CYAccounting Input Refinement Pass 2 (one-time)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: cyaccounting-input-refine-pass2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'cyaccounting/v1.2.0-visual-phase1'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Apply input layout pass 2
        working-directory: apps/CYAccounting
        shell: pwsh
        run: |
          if (-not (Test-Path ./tools/refine_input_layout_pass2.py)) {
            Write-Host "Pass 2 already applied."
            exit 0
          }
          python ./tools/refine_input_layout_pass2.py
          if ($LASTEXITCODE -ne 0) { throw "Input layout pass 2 failed" }
      - name: Commit transformed sources
        shell: pwsh
        run: |
          if (-not (Test-Path apps/CYAccounting/tools/refine_input_layout_pass2.py)) {
            Write-Host "No pass-2 migration source remaining."
            exit 0
          }
          git config user.name "simonliu1118-byte"
          git config user.email "286269326+simonliu1118-byte@users.noreply.github.com"
          git add apps/CYAccounting/app/main.py apps/CYAccounting/app/theme.py apps/CYAccounting/V1.2.0.txt
          git rm apps/CYAccounting/tools/refine_input_layout_pass2.py
          if (git diff --cached --quiet) { throw "Input layout pass 2 produced no source changes" }
          git commit -m "style(CYAccounting): stabilize input layout and section chrome"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
