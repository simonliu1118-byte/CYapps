name: Governance Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate governance structure
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import pathlib, re, sys

          allowed = [
              re.compile(r'^REPOSITORY_RULES\.md$'),
              re.compile(r'^REPO_POLICY\.md$'),
              re.compile(r'^RULES_INDEX\.md$'),
              re.compile(r'^GOVERNANCE_VERSION$'),
              re.compile(r'^GOVERNANCE_CHANGELOG\.md$'),
              re.compile(r'^AGENTS\.md$'),
              re.compile(r'^apps/[^/]+/PROJECT_RULES\.md$'),
              re.compile(r'^apps/[^/]+/AGENTS\.md$'),
              re.compile(r'^\.github/workflows/governance-check\.yml$'),
          ]
          suspicious = re.compile(r'(?i)(rules|policy|instruction|governance)')
          for path in pathlib.Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              rel = path.as_posix()
              name = path.name
              if suspicious.search(name) and not any(rx.fullmatch(rel) for rx in allowed):
                  print(f'ERROR: unauthorized governance/rules file: {rel}')
                  sys.exit(1)

          version = pathlib.Path('GOVERNANCE_VERSION')
          if not version.exists() or not re.fullmatch(r'\d+\.\d+\.\d+\n?', version.read_text(encoding='utf-8')):
              print('ERROR: GOVERNANCE_VERSION must contain MAJOR.MINOR.PATCH')
              sys.exit(1)

          required_root = ['REPOSITORY_RULES.md','REPO_POLICY.md','RULES_INDEX.md','GOVERNANCE_CHANGELOG.md','AGENTS.md']
          for rel in required_root:
              if not pathlib.Path(rel).is_file():
                  print(f'ERROR: missing governance file: {rel}')
                  sys.exit(1)

          apps = pathlib.Path('apps')
          if apps.is_dir():
              for project in sorted(p for p in apps.iterdir() if p.is_dir()):
                  if not (project / 'PROJECT_RULES.md').is_file():
                      print(f'ERROR: active project lacks PROJECT_RULES.md: {project.as_posix()}')
                      sys.exit(1)
                  if not (project / 'VERSION').is_file():
                      print(f'ERROR: active project lacks VERSION: {project.as_posix()}')
                      sys.exit(1)
          print('Governance structure OK')
          PY

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "main:refs/remotes/origin/main"
            mapfile -t changed < <(git diff --name-only "origin/main...HEAD")
            governance_changed=0
            version_changed=0
            changelog_changed=0
            for path in "${changed[@]}"; do
              case "$path" in
                REPOSITORY_RULES.md|REPO_POLICY.md|RULES_INDEX.md|GOVERNANCE_VERSION|GOVERNANCE_CHANGELOG.md|AGENTS.md|apps/*/PROJECT_RULES.md|apps/*/AGENTS.md|.github/workflows/governance-check.yml)
                  governance_changed=1 ;;
              esac
              [ "$path" = "GOVERNANCE_VERSION" ] && version_changed=1
              [ "$path" = "GOVERNANCE_CHANGELOG.md" ] && changelog_changed=1
            done

            if [ "$governance_changed" -eq 1 ]; then
              case "$HEAD_REF" in
                governance/*) ;;
                *) echo "ERROR: permanent governance changes require governance/* branch"; exit 1 ;;
              esac
              [ "$version_changed" -eq 1 ] || { echo "ERROR: governance change must update GOVERNANCE_VERSION"; exit 1; }
              [ "$changelog_changed" -eq 1 ] || { echo "ERROR: governance change must update GOVERNANCE_CHANGELOG.md"; exit 1; }
            fi
          fi

          echo "Governance Check passed."
